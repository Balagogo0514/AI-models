<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d">
  <title id="t">AI 學習路徑：從基礎直覺到 LLM 原理，再到研究與 Agent 應用</title>
  <desc id="d">四個階段由上而下。第一階段基礎直覺：3Blue1Brown 神經網路系列、李宏毅機器學習、fast.ai、Dive into Deep Learning。第二階段 LLM 原理與動手實作：Karpathy Neural Networks Zero to Hero、Raschka 的 Build a Large Language Model From Scratch、Stanford CS336、The Illustrated Transformer。第三階段訓練、評測與研究：論文清單、Stanford CS224N、Lil&#x27;Log、Epoch AI，對應本筆記庫的 Scaling-Laws、Post-Training、Transformer-Attention。第四階段應用與 Agent：Chip Huyen 的 AI Engineering、Hugging Face Agents Course、Anthropic Building effective agents、各家官方文件，對應 Agentic-Engineering、Claude-Agent、CodeX-Agent。已有程式基礎者可從第二階段開始，只想用 Agent 可直接從第四階段開始，這是依目的所做的歸納。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="518.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">學習路徑：四個階段</text>
  <rect class="box" x="12" y="44" width="616" height="98" rx="10"/>
  <rect class="acc" x="22" y="56" width="28" height="28" rx="14"/>
  <text class="b" x="36" y="75" text-anchor="middle">1</text>
  <text class="b" x="62" y="72">基礎直覺</text>
  <text class="s" x="62" y="90">神經網路、反向傳播、訓練在做什麼</text>
  <text x="62" y="110">3Blue1Brown 神經網路系列　李宏毅 機器學習</text>
  <text x="62" y="126">fast.ai　Dive into Deep Learning（d2l.ai）</text>
  <path class="ln" d="M320.0,143.0 L320.0,151.0" marker-end="url(#a)"/>
  <rect class="acc" x="12" y="152" width="616" height="98" rx="10"/>
  <rect class="acc" x="22" y="164" width="28" height="28" rx="14"/>
  <text class="b" x="36" y="183" text-anchor="middle">2</text>
  <text class="b" x="62" y="180">LLM 原理與動手實作</text>
  <text class="s" x="62" y="198">tokenizer、Transformer、從零訓練小型 GPT</text>
  <text x="62" y="218">Karpathy：Neural Networks: Zero to Hero</text>
  <text x="62" y="234">Raschka 書　Stanford CS336　Illustrated Transformer</text>
  <path class="ln" d="M320.0,251.0 L320.0,259.0" marker-end="url(#a)"/>
  <rect class="good" x="12" y="260" width="616" height="98" rx="10"/>
  <rect class="acc" x="22" y="272" width="28" height="28" rx="14"/>
  <text class="b" x="36" y="291" text-anchor="middle">3</text>
  <text class="b" x="62" y="288">訓練、評測與研究</text>
  <text class="s" x="62" y="306">scaling、後訓練、注意力、長上下文</text>
  <text x="62" y="326">論文清單（第 4 節）　Stanford CS224N　Lil&#x27;Log</text>
  <text x="62" y="342">本庫：Scaling-Laws、Post-Training、Transformer-Attention</text>
  <path class="ln" d="M320.0,359.0 L320.0,367.0" marker-end="url(#a)"/>
  <rect class="good" x="12" y="368" width="616" height="112" rx="10"/>
  <rect class="acc" x="22" y="380" width="28" height="28" rx="14"/>
  <text class="b" x="36" y="399" text-anchor="middle">4</text>
  <text class="b" x="62" y="396">應用與 Agent</text>
  <text class="s" x="62" y="414">RAG、tool use、Agent 工程、開發工具</text>
  <text x="62" y="434">Chip Huyen：AI Engineering　HF Agents Course</text>
  <text x="62" y="450">Anthropic：Building effective agents　各家官方文件</text>
  <text x="62" y="466">本庫：Agentic-Engineering、Claude-Agent、CodeX-Agent</text>
  <text class="s" x="320" y="498" text-anchor="middle">有程式基礎可從階段 2 開始；只想用 Agent 可直接到階段 4（我的歸納，不是官方建議）</text>
</svg>
