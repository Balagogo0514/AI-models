<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-labelledby="t d">
  <title id="t">LoRA 的流程：資料、訓練、評測、登錄、部署、監控</title>
  <desc id="d">七個步驟由上到下。一，確認問題：是行為、格式或術語，不是檢索或資料品質。二，準備資料：高品質、有人審查，權限與個資先處理，評測集與訓練資料分開。三，訓練 LoRA：用 PEFT，記憶體不夠可用 QLoRA。四，評測：與微調前對比，沒過就回到資料或訓練。五，登錄：記錄版本、基礎模型版本、資料版本與評測結果。六，部署：動態載入 adapter 或合併成獨立模型。七，監控與回歸。基礎模型換版或資料更新時，回到訓練重做。這是設計建議，沒有實測。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="538.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">LoRA 的流程</text>
  <rect class="box" x="12" y="46" width="360" height="52" rx="10"/>
  <text class="b" x="26" y="68">1 確認問題</text>
  <text class="s" x="26" y="88">行為、格式、術語；不是檢索或資料品質</text>
  <path class="ln" d="M192.0,98.0 L192.0,112.0" marker-end="url(#a)"/>
  <rect class="box" x="12" y="112" width="360" height="52" rx="10"/>
  <text class="b" x="26" y="134">2 準備資料</text>
  <text class="s" x="26" y="154">高品質、有人審查；先處理權限與個資；評測集分開</text>
  <path class="ln" d="M192.0,164.0 L192.0,178.0" marker-end="url(#a)"/>
  <rect class="good" x="12" y="178" width="360" height="52" rx="10"/>
  <text class="b" x="26" y="200">3 訓練 LoRA</text>
  <text class="s" x="26" y="220">PEFT；記憶體不夠時用 QLoRA</text>
  <path class="ln" d="M192.0,230.0 L192.0,244.0" marker-end="url(#a)"/>
  <rect class="acc" x="12" y="244" width="360" height="52" rx="10"/>
  <text class="b" x="26" y="266">4 評測</text>
  <text class="s" x="26" y="286">與微調前對比；用分開的評測集</text>
  <path class="ln" d="M192.0,296.0 L192.0,310.0" marker-end="url(#a)"/>
  <rect class="box" x="12" y="310" width="360" height="52" rx="10"/>
  <text class="b" x="26" y="332">5 登錄</text>
  <text class="s" x="26" y="352">adapter 版本、基礎模型版本、資料版本、評測結果</text>
  <path class="ln" d="M192.0,362.0 L192.0,376.0" marker-end="url(#a)"/>
  <rect class="good" x="12" y="376" width="360" height="52" rx="10"/>
  <text class="b" x="26" y="398">6 部署</text>
  <text class="s" x="26" y="418">動態載入 adapter，或合併成獨立模型</text>
  <path class="ln" d="M192.0,428.0 L192.0,442.0" marker-end="url(#a)"/>
  <rect class="box" x="12" y="442" width="360" height="52" rx="10"/>
  <text class="b" x="26" y="464">7 監控與回歸</text>
  <text class="s" x="26" y="484">線上品質、錯誤樣本；定期跑評測集</text>
  <path class="dash" d="M372.0,270.0 L402.0,270.0 L402.0,204.0 L372.0,204.0" marker-end="url(#a)"/>
  <text class="s" x="414" y="231.0">沒過：</text>
  <text class="s" x="414" y="247.0">回訓練或資料</text>
  <path class="dash" d="M372.0,468.0 L512.0,468.0 L512.0,138.0 L372.0,138.0" marker-end="url(#a)"/>
  <text class="s" x="522" y="422">基礎模型換版</text>
  <text class="s" x="522" y="438">或資料更新：</text>
  <text class="s" x="522" y="454">回到資料與</text>
  <text class="s" x="522" y="470">訓練重做</text>
  <text class="s" x="320" y="524" text-anchor="middle">設計建議；沒有實測；超參數與資料量不給固定數字，請用評測集決定</text>
</svg>
