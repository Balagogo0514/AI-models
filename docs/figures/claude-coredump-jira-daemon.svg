<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 556" role="img" aria-labelledby="t d">
  <title id="t">Python 常駐服務直接接 Jira：憑證與不可信的 dump 分開</title>
  <desc id="d">Jira 以 webhook 把事件送到常駐服務的接收端，接收端驗證與去重後寫入 jobs 表。隔離 worker 從 jobs 表領取案件，在唯讀掛載、無憑證、無對外網路、有 timeout 的環境中用 gdb、lldb 與 symbol 工具擷取精簡證據。證據回到服務的回寫端，由它呼叫 Claude API、驗證 schema，再用 Jira REST 回寫。憑證只在上層服務；worker 被入侵也拿不到 Jira token 與 API key。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="554.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">常駐服務：憑證與不可信的 dump 分開</text>
  <rect class="box" x="235.0" y="48.0" width="130" height="44" rx="8"/>
  <text class="b" x="300" y="74" text-anchor="middle">Jira</text>
  <rect class="box" x="495.0" y="48.0" width="130" height="44" rx="8"/>
  <text class="b" x="560" y="66" text-anchor="middle">Claude API</text>
  <text x="560" y="82" text-anchor="middle">只看精簡證據</text>
  <rect class="zone" x="12" y="112" width="616" height="190" rx="10"/>
  <text class="b" x="24" y="132">常駐服務（持有 Jira 與 API 憑證）</text>
  <rect class="acc" x="35.0" y="164.0" width="150" height="64" rx="8"/>
  <text class="b" x="110" y="192" text-anchor="middle">接收端</text>
  <text x="110" y="208" text-anchor="middle">驗證、去重、回 2xx</text>
  <rect class="acc" x="225.0" y="164.0" width="150" height="64" rx="8"/>
  <text class="b" x="300" y="192" text-anchor="middle">jobs 表</text>
  <text x="300" y="208" text-anchor="middle">待處理／分析中／完成</text>
  <rect class="good" x="435.0" y="164.0" width="170" height="64" rx="8"/>
  <text class="b" x="520" y="192" text-anchor="middle">回寫端</text>
  <text x="520" y="208" text-anchor="middle">呼叫 Claude、驗 schema</text>
  <path class="ln" d="M185.0,196.0 L225.0,196.0" marker-end="url(#a)"/>
  <path class="ln" d="M375.0,196.0 L435.0,196.0" marker-end="url(#a)"/>
  <text class="s" x="405" y="186" text-anchor="middle">證據就緒</text>
  <path class="ln" d="M300.0,92.0 L300.0,106.0 L110.0,106.0 L110.0,164.0" marker-end="url(#a)"/>
  <text class="s" x="205" y="100" text-anchor="middle">webhook</text>
  <path class="ln" d="M560.0,164.0 L560.0,92.0" marker-end="url(#a)"/>
  <path class="ln" d="M480.0,164.0 L480.0,70.0 L365.0,70.0" marker-end="url(#a)"/>
  <text class="s" x="437" y="92" text-anchor="middle">回寫 Jira</text>
  <rect class="zone" x="12" y="326" width="616" height="140" rx="10"/>
  <text class="b" x="24" y="346">隔離 worker（無憑證、無對外網路、有 timeout）</text>
  <rect class="box" x="40.0" y="382.0" width="300" height="56" rx="8"/>
  <text class="b" x="190" y="406" text-anchor="middle">gdb／lldb、readelf、symbol 工具</text>
  <text x="190" y="422" text-anchor="middle">唯讀掛載 dump</text>
  <rect class="box" x="435.0" y="382.0" width="170" height="56" rx="8"/>
  <text class="b" x="520" y="406" text-anchor="middle">精簡證據 JSON</text>
  <text x="520" y="422" text-anchor="middle">＋ evidence ID</text>
  <path class="ln" d="M300.0,228.0 L300.0,382.0" marker-end="url(#a)"/>
  <text class="s" x="340" y="262" text-anchor="middle">領取案件</text>
  <path class="ln" d="M340.0,410.0 L435.0,410.0" marker-end="url(#a)"/>
  <path class="ln" d="M520.0,382.0 L520.0,228.0" marker-end="url(#a)"/>
  <text class="s" x="320" y="490" text-anchor="middle">憑證只在上層服務；worker 被入侵，也拿不到 Jira token 與 API key</text>
  <text class="s" x="320" y="510" text-anchor="middle">jobs 表要持久（SQLite、Postgres、Redis 皆可），服務重啟才不會丟案件</text>
  <text class="s" x="320" y="530" text-anchor="middle">分析不要寫在收 webhook 的請求裡：先入表、立刻回 2xx</text>
</svg>
