<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 690" role="img" aria-labelledby="t d">
  <title id="t">事件去重與防迴圈：回寫 Jira 之後不要再被自己觸發</title>
  <desc id="d">四個角色：Jira、服務（接收加回寫）、jobs 表加隔離 worker、Claude API。順序：一，Jira 送來含附件的 issue 事件。二，服務驗證來源並算去重 key，也就是 issue key 加 attachment id。三，只有新案件才寫入 jobs 表。四，服務立刻回 2xx。五，隔離 worker 擷取證據。六，證據就緒通知服務。七，服務送精簡證據給 Claude。八，Claude 回傳報告 JSON。九，服務驗證 schema 並轉成 Markdown。十，服務用 REST 回寫 comment 與 label。十一，回寫又觸發 Jira 的更新事件。十二，服務判斷是 bot 事件，略過。這是依一般做法整理的建議，Jira 的重送與逾時行為沒有查證。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="688.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">事件去重與防迴圈</text>
  <rect class="acc" x="16.0" y="45.0" width="128" height="34" rx="8"/>
  <text class="b" x="80" y="66" text-anchor="middle">Jira</text>
  <line class="dash" x1="80" y1="86" x2="80" y2="644"/>
  <rect class="acc" x="176.0" y="40.0" width="128" height="44" rx="8"/>
  <text class="b" x="240" y="58" text-anchor="middle">服務</text>
  <text x="240" y="74" text-anchor="middle">接收＋回寫</text>
  <line class="dash" x1="240" y1="86" x2="240" y2="644"/>
  <rect class="acc" x="336.0" y="40.0" width="128" height="44" rx="8"/>
  <text class="b" x="400" y="58" text-anchor="middle">jobs 表＋</text>
  <text x="400" y="74" text-anchor="middle">隔離 worker</text>
  <line class="dash" x1="400" y1="86" x2="400" y2="644"/>
  <rect class="acc" x="496.0" y="45.0" width="128" height="34" rx="8"/>
  <text class="b" x="560" y="66" text-anchor="middle">Claude API</text>
  <line class="dash" x1="560" y1="86" x2="560" y2="644"/>
  <path class="ln" d="M80.0,112.0 L240.0,112.0" marker-end="url(#a)"/>
  <rect x="99.7" y="92" width="120.5" height="16" fill="var(--bg)"/>
  <text class="s" x="160.0" y="104" text-anchor="middle">1 issue 事件（含附件）</text>
  <rect class="good" x="140" y="144" width="200" height="28" rx="6"/>
  <text x="240" y="163" text-anchor="middle">2 驗證來源、算去重 key</text>
  <path class="ln" d="M240.0,204.0 L400.0,204.0" marker-end="url(#a)"/>
  <rect x="264.6" y="184" width="110.7" height="16" fill="var(--bg)"/>
  <text class="s" x="320.0" y="196" text-anchor="middle">3 新案件才入 jobs 表</text>
  <path class="ln" d="M240.0,250.0 L80.0,250.0" marker-end="url(#a)"/>
  <rect x="124.8" y="230" width="70.3" height="16" fill="var(--bg)"/>
  <text class="s" x="160.0" y="242" text-anchor="middle">4 立刻回 2xx</text>
  <rect class="good" x="300" y="282" width="200" height="28" rx="6"/>
  <text x="400" y="301" text-anchor="middle">5 隔離 worker 擷取證據</text>
  <path class="ln" d="M400.0,342.0 L240.0,342.0" marker-end="url(#a)"/>
  <rect x="290.9" y="322" width="58.2" height="16" fill="var(--bg)"/>
  <text class="s" x="320.0" y="334" text-anchor="middle">6 證據就緒</text>
  <path class="ln" d="M240.0,388.0 L560.0,388.0" marker-end="url(#a)"/>
  <rect x="366.0" y="368" width="68.0" height="16" fill="var(--bg)"/>
  <text class="s" x="400.0" y="380" text-anchor="middle">7 送精簡證據</text>
  <path class="ln" d="M560.0,434.0 L240.0,434.0" marker-end="url(#a)"/>
  <rect x="357.2" y="414" width="85.6" height="16" fill="var(--bg)"/>
  <text class="s" x="400.0" y="426" text-anchor="middle">8 回傳報告 JSON</text>
  <rect class="good" x="140" y="466" width="200" height="28" rx="6"/>
  <text x="240" y="485" text-anchor="middle">9 驗證 schema、轉 Markdown</text>
  <path class="ln" d="M240.0,526.0 L80.0,526.0" marker-end="url(#a)"/>
  <rect x="97.4" y="506" width="125.2" height="16" fill="var(--bg)"/>
  <text class="s" x="160.0" y="518" text-anchor="middle">10 回寫 comment／label</text>
  <path class="ln" d="M80.0,572.0 L240.0,572.0" marker-end="url(#a)"/>
  <rect x="103.7" y="552" width="112.7" height="16" fill="var(--bg)"/>
  <text class="s" x="160.0" y="564" text-anchor="middle">11 回寫又觸發更新事件</text>
  <rect class="good" x="140" y="604" width="200" height="28" rx="6"/>
  <text x="240" y="623" text-anchor="middle">12 bot 事件 → 略過</text>
  <text class="s" x="320" y="668" text-anchor="middle">去重 key：issue key ＋ attachment id；Jira 的重送與逾時行為我沒查證</text>
</svg>
