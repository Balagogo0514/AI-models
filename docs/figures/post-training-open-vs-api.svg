<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d">
  <title id="t">RAG 的生成模型：開源自架還是商用 API？</title>
  <desc id="d">第一個問題是資料能不能送到外部。不能就用開源或開放權重模型自架，地端或私有雲。可以則問有沒有 GPU 與維運能力：沒有就用商用 API；有則再問是否需要微調或呼叫量極大：是就開源自架，先算清楚總成本；否就先用商用 API 驗證，並把模型做成可替換。另有一條虛線：資料有分級時用混合路由，敏感文件走自架，一般文件走 API。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="518.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">資料能送出去嗎？有沒有維運能力？</text>
  <polygon class="acc" points="320,54.0 420.0,92 320,130.0 220.0,92"/>
  <text class="b" x="320" y="96" text-anchor="middle">資料能送到外部嗎？</text>
  <rect class="good" x="10.0" y="64.0" width="150" height="56" rx="8"/>
  <text x="85" y="88" text-anchor="middle">開源／開放權重自架</text>
  <text x="85" y="104" text-anchor="middle">地端或私有雲</text>
  <path class="ln" d="M220.0,92.0 L160.0,92.0" marker-end="url(#a)"/>
  <text class="s" x="190" y="84" text-anchor="middle">不能</text>
  <rect class="box" x="473.0" y="64.0" width="150" height="56" rx="8"/>
  <text x="548" y="88" text-anchor="middle">混合路由</text>
  <text x="548" y="104" text-anchor="middle">敏感走自架、一般走 API</text>
  <path class="dash" d="M420.0,92.0 L473.0,92.0" marker-end="url(#a)"/>
  <text class="s" x="436" y="112" text-anchor="middle">資料有分級</text>
  <path class="ln" d="M320.0,130.0 L320.0,162.0" marker-end="url(#a)"/>
  <text class="s" x="346" y="150" text-anchor="middle">可以</text>
  <polygon class="acc" points="320,162.0 440.0,200 320,238.0 200.0,200"/>
  <text class="b" x="320" y="204" text-anchor="middle">有 GPU 與維運能力嗎？</text>
  <rect class="acc" x="10.0" y="172.0" width="150" height="56" rx="8"/>
  <text x="85" y="204" text-anchor="middle">商用 API</text>
  <path class="ln" d="M200.0,200.0 L160.0,200.0" marker-end="url(#a)"/>
  <text class="s" x="180" y="192" text-anchor="middle">沒有</text>
  <path class="ln" d="M320.0,238.0 L320.0,268.0" marker-end="url(#a)"/>
  <text class="s" x="334" y="258" text-anchor="middle">有</text>
  <polygon class="acc" points="320,270.0 450.0,308 320,346.0 190.0,308"/>
  <text class="b" x="320" y="312" text-anchor="middle">需要微調，或呼叫量極大？</text>
  <rect class="good" x="10.0" y="390.0" width="180" height="60" rx="8"/>
  <text x="100" y="416" text-anchor="middle">開源自架</text>
  <text x="100" y="432" text-anchor="middle">先算清楚總成本</text>
  <rect class="acc" x="450.0" y="390.0" width="180" height="60" rx="8"/>
  <text x="540" y="416" text-anchor="middle">先用商用 API 驗證</text>
  <text x="540" y="432" text-anchor="middle">模型做成可替換</text>
  <path class="ln" d="M190.0,308.0 L100.0,308.0 L100.0,390.0" marker-end="url(#a)"/>
  <text class="s" x="146" y="300" text-anchor="middle">是</text>
  <path class="ln" d="M450.0,308.0 L540.0,308.0 L540.0,390.0" marker-end="url(#a)"/>
  <text class="s" x="494" y="300" text-anchor="middle">否</text>
  <text class="s" x="320" y="490" text-anchor="middle">沒有維運能力 → 商用 API；需要微調或量極大 → 自架；其餘先驗證再決定</text>
</svg>
