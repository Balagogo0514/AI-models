<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="t d">
  <title id="t">深度研究模型的使用條件，以及 computer use 的新舊路徑</title>
  <desc id="d">上半部：o3-deep-research 與 o4-mini-deep-research 必須搭配至少一個資料來源，可選 Web search、Remote MCP、File search 或向量庫；可再搭配 Code Interpreter 做分析；輸出是長報告；但不支援一般 function calling，更像研究代理而不是通用聊天模型。下半部：computer-use-preview 是舊 preview 路徑，價格 1.5 與 6 美元，新實作應改用 GA 的 gpt-5.5 加 computer tool。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="468.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">深度研究：必須有資料來源，不支援 function calling</text>
  <text class="b" x="100" y="52" text-anchor="middle">至少一個資料來源</text>
  <rect class="acc" x="12" y="62" width="176" height="34" rx="8"/>
  <text x="100" y="84" text-anchor="middle">Web search</text>
  <line class="ln" x1="188" y1="79" x2="232" y2="126" marker-end="url(#a)"/>
  <rect class="acc" x="12" y="104" width="176" height="34" rx="8"/>
  <text x="100" y="126" text-anchor="middle">Remote MCP</text>
  <line class="ln" x1="188" y1="121" x2="232" y2="126" marker-end="url(#a)"/>
  <rect class="acc" x="12" y="146" width="176" height="34" rx="8"/>
  <text x="100" y="168" text-anchor="middle">File search／向量庫</text>
  <line class="ln" x1="188" y1="163" x2="232" y2="126" marker-end="url(#a)"/>
  <rect class="good" x="234" y="96" width="176" height="62" rx="10"/>
  <text class="monob" x="322" y="122" text-anchor="middle">o3-deep-research</text>
  <text class="monob" x="322" y="144" text-anchor="middle">o4-mini-deep-research</text>
  <rect class="box" x="12" y="192" width="176" height="34" rx="8"/>
  <rect class="dash" x="12" y="192" width="176" height="34" rx="8"/>
  <text x="100" y="214" text-anchor="middle">Code Interpreter（可選）</text>
  <line class="dash" x1="188" y1="209" x2="234" y2="150" marker-end="url(#a)"/>
  <line class="ln" x1="410" y1="127" x2="452" y2="127" marker-end="url(#a)"/>
  <rect class="box" x="454" y="96" width="174" height="62" rx="10"/>
  <text class="b" x="541" y="122" text-anchor="middle">長報告</text>
  <text class="s" x="541" y="142" text-anchor="middle">搜尋、瀏覽、分析、整合</text>
  <rect class="bad" x="234" y="176" width="394" height="50" rx="10"/>
  <text class="b" x="246" y="197">不支援一般 function calling</text>
  <text class="s" x="246" y="215">是研究代理模型，不是通用聊天模型</text>
  <text class="t" x="320" y="258" text-anchor="middle">Computer use：舊 preview 路徑 → GA 路徑</text>
  <rect class="bad" x="12" y="272" width="270" height="76" rx="10"/>
  <text class="monob" x="24" y="296">computer-use-preview</text>
  <text class="s" x="24" y="316">$1.50／$6；官方已標為舊 preview</text>
  <text class="s" x="24" y="334">不要再從它開始</text>
  <line class="ln" x1="284" y1="310" x2="346" y2="310" marker-end="url(#a)"/>
  <rect class="good" x="348" y="272" width="280" height="76" rx="10"/>
  <text class="monob" x="360" y="296">gpt-5.5 ＋ computer tool</text>
  <text class="s" x="360" y="316">GA 路徑；新實作走這條</text>
  <text class="s" x="320" y="380" text-anchor="middle">Pricing 頁把 deep research 與 computer-use-preview 放在</text>
  <text class="s" x="320" y="398" text-anchor="middle">Specialized models 的 Batch 區塊；正式報價前應再核對最新 pricing 頁</text>
  <text class="s" x="320" y="424" text-anchor="middle">gpt-5.4-cyber：定價頁列名但未公開完整價格，</text>
  <text class="s" x="320" y="442" text-anchor="middle">公開文件細節很少，未確認權限前不要直接規劃</text>
</svg>
