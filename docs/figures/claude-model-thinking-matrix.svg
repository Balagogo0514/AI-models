<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="t d">
  <title id="t">各模型支援的思考機制：Extended Thinking 與 Adaptive Thinking</title>
  <desc id="d">十一個模型的支援狀況：Fable 5 與 5.1 只有 Adaptive 且永遠開啟；Opus 5.5 只有 Adaptive 且不可關閉，effort 預設 medium；Opus 5 只有 Adaptive，預設開啟；Opus 4.8 與 4.7 只有 Adaptive，4.8 的 effort 預設 high；Opus 4.6 兩者並存，Extended 已 deprecated；Sonnet 5.5 與 5 只有 Adaptive；Sonnet 4.6 兩者並存；Haiku 5.5 只有 Adaptive，預設開啟，effort 預設 medium；Haiku 4.5 只支援 Extended。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="498.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">思考機制：誰支援哪一種</text>
  <rect class="hd" x="12" y="44" width="616" height="26" rx="6"/>
  <text class="b" x="20" y="62">模型</text>
  <text class="b" x="150" y="62" text-anchor="middle">Extended</text>
  <text class="b" x="228" y="62" text-anchor="middle">Adaptive</text>
  <text class="b" x="262" y="62">備註</text>
  <rect class="box" x="12" y="76" width="616" height="26" rx="6"/>
  <text class="b" x="20" y="94">Fable 5／5.1</text>
  <circle class="dote" cx="150" cy="89" r="6"/>
  <circle class="dotf" cx="228" cy="89" r="6"/>
  <text x="262" y="94">永遠開啟；disabled、enabled 皆回 400</text>
  <rect class="good" x="12" y="106" width="616" height="26" rx="6"/>
  <text class="b" x="20" y="124">Opus 5.5</text>
  <circle class="dote" cx="150" cy="119" r="6"/>
  <circle class="dotf" cx="228" cy="119" r="6"/>
  <text x="262" y="124">不可關閉；effort 預設 medium</text>
  <rect class="box" x="12" y="136" width="616" height="26" rx="6"/>
  <text class="b" x="20" y="154">Opus 5</text>
  <circle class="dote" cx="150" cy="149" r="6"/>
  <circle class="dotf" cx="228" cy="149" r="6"/>
  <text x="262" y="154">預設開啟；disabled 僅 effort high 以下</text>
  <rect class="box" x="12" y="166" width="616" height="26" rx="6"/>
  <text class="b" x="20" y="184">Opus 4.8</text>
  <circle class="dote" cx="150" cy="179" r="6"/>
  <circle class="dotf" cx="228" cy="179" r="6"/>
  <text x="262" y="184">effort 預設 high</text>
  <rect class="box" x="12" y="196" width="616" height="26" rx="6"/>
  <text class="b" x="20" y="214">Opus 4.7</text>
  <circle class="dote" cx="150" cy="209" r="6"/>
  <circle class="dotf" cx="228" cy="209" r="6"/>
  <rect class="box" x="12" y="226" width="616" height="26" rx="6"/>
  <text class="b" x="20" y="244">Opus 4.6</text>
  <circle class="dotf" cx="150" cy="239" r="6"/>
  <circle class="dotf" cx="228" cy="239" r="6"/>
  <text x="262" y="244">兩者並存；Extended 已 deprecated</text>
  <rect class="box" x="12" y="256" width="616" height="26" rx="6"/>
  <text class="b" x="20" y="274">Sonnet 5.5</text>
  <circle class="dote" cx="150" cy="269" r="6"/>
  <circle class="dotf" cx="228" cy="269" r="6"/>
  <text x="262" y="274">effort 預設 high；disabled 回 400</text>
  <rect class="box" x="12" y="286" width="616" height="26" rx="6"/>
  <text class="b" x="20" y="304">Sonnet 5</text>
  <circle class="dote" cx="150" cy="299" r="6"/>
  <circle class="dotf" cx="228" cy="299" r="6"/>
  <text x="262" y="304">effort 預設 high</text>
  <rect class="box" x="12" y="316" width="616" height="26" rx="6"/>
  <text class="b" x="20" y="334">Sonnet 4.6</text>
  <circle class="dotf" cx="150" cy="329" r="6"/>
  <circle class="dotf" cx="228" cy="329" r="6"/>
  <text x="262" y="334">兩者並存；Extended 已 deprecated</text>
  <rect class="box" x="12" y="346" width="616" height="26" rx="6"/>
  <text class="b" x="20" y="364">Haiku 5.5</text>
  <circle class="dote" cx="150" cy="359" r="6"/>
  <circle class="dotf" cx="228" cy="359" r="6"/>
  <text x="262" y="364">預設開啟；effort 預設 medium</text>
  <rect class="bad" x="12" y="376" width="616" height="26" rx="6"/>
  <text class="b" x="20" y="394">Haiku 4.5</text>
  <circle class="dotf" cx="150" cy="389" r="6"/>
  <circle class="dote" cx="228" cy="389" r="6"/>
  <text x="262" y="394">現行模型中唯一僅靠 Extended</text>
  <circle class="dotf" cx="24" cy="424" r="6"/>
  <text class="s" x="36" y="429">支援</text>
  <circle class="dote" cx="84" cy="424" r="6"/>
  <text class="s" x="96" y="429">不支援</text>
  <text class="s" x="320" y="458" text-anchor="middle">新一代（Opus 5.5／5／4.8／4.7、Sonnet 5.5／5、Haiku 5.5）都拿掉 budget_tokens，只留 Adaptive</text>
  <text class="s" x="320" y="478" text-anchor="middle">4.6 世代新舊並存，Haiku 4.5 仍停在舊機制</text>
</svg>
