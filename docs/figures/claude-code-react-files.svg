<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="t d">
  <title id="t">React 專案裡 Claude Code 相關檔案放哪裡：哪些該 commit、哪些是個人的</title>
  <desc id="d">專案根目錄有五個與 Claude Code 相關的檔案。CLAUDE.md 放專案慣例，可 commit。.claude/settings.json 放 permissions 與 hooks，可 commit 共享。.claude/settings.local.json 是這個專案的個人設定，不共享。.mcp.json 是 project scope 的 MCP 設定，可 commit，例如 Playwright MCP。.worktreeinclude 指定要複製進 worktree 的 gitignore 檔案，例如 .env。家目錄的 ~/.claude/settings.json 是所有專案的個人設定。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="498.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">檔案放哪裡</text>
  <rect class="hd" x="12" y="44" width="616" height="28" rx="6"/>
  <text class="b" x="20" y="63">檔案</text>
  <text class="b" x="250" y="63">放什麼</text>
  <text class="b" x="520" y="63">共享？</text>
  <rect class="good" x="12" y="80" width="616" height="56" rx="8"/>
  <text class="mono" x="20" y="112">CLAUDE.md</text>
  <text x="250" y="112">專案慣例：指令、目錄結構、規範、禁止事項</text>
  <text class="b" x="520" y="112">可 commit</text>
  <rect class="good" x="12" y="142" width="616" height="56" rx="8"/>
  <text class="mono" x="20" y="174">.claude/settings.json</text>
  <text x="250" y="174">permissions（allow／deny）、hooks</text>
  <text class="b" x="520" y="174">可 commit</text>
  <rect class="box" x="12" y="204" width="616" height="56" rx="8"/>
  <text class="mono" x="20" y="236">.claude/settings.local.json</text>
  <text x="250" y="236">這個專案的個人設定</text>
  <text class="b" x="520" y="236">不共享</text>
  <rect class="good" x="12" y="266" width="616" height="56" rx="8"/>
  <text class="mono" x="20" y="298">.mcp.json</text>
  <text x="250" y="298">project scope 的 MCP（如 Playwright）</text>
  <text class="b" x="520" y="298">可 commit</text>
  <rect class="good" x="12" y="328" width="616" height="56" rx="8"/>
  <text class="mono" x="20" y="360">.worktreeinclude</text>
  <text x="250" y="360">要複製進 worktree 的 gitignore 檔（如 .env）</text>
  <text class="b" x="520" y="360">可 commit</text>
  <rect class="box" x="12" y="390" width="616" height="56" rx="8"/>
  <text class="mono" x="20" y="422">~/.claude/settings.json</text>
  <text x="250" y="422">所有專案共用的個人設定</text>
  <text class="b" x="520" y="422">個人</text>
  <text class="s" x="320" y="484" text-anchor="middle">路徑相對於專案根目錄（~ 開頭除外）；hooks 與 MCP 的位置見 Claude-Code-CLI 第 17、18 節</text>
</svg>
