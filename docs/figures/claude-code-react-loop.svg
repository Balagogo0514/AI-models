<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 616" role="img" aria-labelledby="t d">
  <title id="t">Claude Code 在本機 React 開發循環中的位置：誰負責哪一步</title>
  <desc id="d">循環共七步。第一步你下指令，大改動先用 plan 模式規劃。第二步 Claude 編輯檔案，權限用 acceptEdits。第三步 hooks 自動執行 lint 或格式化，由 PostToolUse hook 觸發。第四步 dev server 熱更新，建議由你在另一個終端機啟動。第五步驗證：跑測試，並用 Chrome 整合或 Playwright MCP 在瀏覽器確認畫面。第六步 Stop hook 在測試未過時擋住結束。驗證失敗就回到第二步修；第七步通過後你審查 diff 再 commit。這是依官方功能整理的建議工作流程，不是官方指定流程。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="614.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">本機 React 開發循環</text>
  <rect class="box" x="60.0" y="44.0" width="460" height="58" rx="8"/>
  <text class="b" x="290" y="69" text-anchor="middle">1 你：下指令</text>
  <text x="290" y="85" text-anchor="middle">大改動先用 plan 模式（Shift+Tab）探索與規劃</text>
  <path class="ln" d="M290.0,102.0 L290.0,122.0" marker-end="url(#a)"/>
  <rect class="acc" x="60.0" y="122.0" width="460" height="58" rx="8"/>
  <text class="b" x="290" y="147" text-anchor="middle">2 Claude：改檔</text>
  <text x="290" y="163" text-anchor="middle">Edit／Write；權限常用 acceptEdits，事後審 diff</text>
  <path class="ln" d="M290.0,180.0 L290.0,200.0" marker-end="url(#a)"/>
  <rect class="good" x="60.0" y="200.0" width="460" height="58" rx="8"/>
  <text class="b" x="290" y="225" text-anchor="middle">3 hook：自動檢查</text>
  <text x="290" y="241" text-anchor="middle">PostToolUse（Edit｜Write）跑 lint 或 format</text>
  <path class="ln" d="M290.0,258.0 L290.0,278.0" marker-end="url(#a)"/>
  <rect class="box" x="60.0" y="278.0" width="460" height="58" rx="8"/>
  <text class="b" x="290" y="303" text-anchor="middle">4 dev server：熱更新</text>
  <text x="290" y="319" text-anchor="middle">建議你在另一個終端機跑 npm run dev</text>
  <path class="ln" d="M290.0,336.0 L290.0,356.0" marker-end="url(#a)"/>
  <rect class="acc" x="60.0" y="356.0" width="460" height="58" rx="8"/>
  <text class="b" x="290" y="381" text-anchor="middle">5 驗證：測試與瀏覽器</text>
  <text x="290" y="397" text-anchor="middle">npm test；Chrome 整合或 Playwright MCP 看畫面</text>
  <path class="ln" d="M290.0,414.0 L290.0,434.0" marker-end="url(#a)"/>
  <rect class="good" x="60.0" y="434.0" width="460" height="58" rx="8"/>
  <text class="b" x="290" y="459" text-anchor="middle">6 hook：Stop 把關</text>
  <text x="290" y="475" text-anchor="middle">測試沒過就 block，要求 Claude 繼續修</text>
  <path class="ln" d="M520.0,385.0 L590.0,385.0 L590.0,151.0 L520.0,151.0" marker-end="url(#a)"/>
  <text class="s" x="590" y="267" text-anchor="middle">失敗就回去修</text>
  <rect class="box" x="140.0" y="512.0" width="300" height="44" rx="8"/>
  <text class="b" x="290" y="538" text-anchor="middle">7 你：審查 diff（/review）→ commit</text>
  <path class="ln" d="M290.0,492.0 L290.0,512.0" marker-end="url(#a)"/>
  <text class="s" x="320" y="578" text-anchor="middle">建議流程，不是官方指定；工具與步驟可依專案增減</text>
</svg>
