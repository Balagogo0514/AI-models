<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d">
  <title id="t">知識型態 → 建議機制</title>
  <desc id="d">五種知識型態對應的機制。穩定的規格與設計：RAG，hybrid 檢索、依權限過濾、附引用。排查經驗與案例：LLM Wiki 加案件資料庫，會累積，人工核准，精確比對用資料庫。即時系統資料與動作：MCP 或 API 工具，現在的值或要寫入，先唯讀再逐級放寬。程式碼：程式碼搜尋與 repo 工具，隨時在變，不適合當成文件索引，這是推論。編號、簽章、錯誤碼的精確比對：資料庫或關鍵字搜尋，不需要 RAG 或 wiki。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="438.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">知識型態 → 建議機制</text>
  <rect class="acc" x="12" y="44" width="220" height="64" rx="10"/>
  <text x="24" y="81.0">穩定的規格與設計</text>
  <line class="ln" x1="232" y1="76.0" x2="256" y2="76.0" marker-end="url(#a)"/>
  <rect class="good" x="258" y="44" width="370" height="64" rx="10"/>
  <text class="b" x="270" y="70.0">RAG</text>
  <text class="s" x="270" y="92.0">hybrid 檢索、依權限過濾、附引用</text>
  <rect class="acc" x="12" y="116" width="220" height="64" rx="10"/>
  <text x="24" y="153.0">排查經驗與案例</text>
  <line class="ln" x1="232" y1="148.0" x2="256" y2="148.0" marker-end="url(#a)"/>
  <rect class="good" x="258" y="116" width="370" height="64" rx="10"/>
  <text class="b" x="270" y="142.0">LLM Wiki ＋ 案件資料庫</text>
  <text class="s" x="270" y="164.0">會累積；人工核准；精確比對用資料庫</text>
  <rect class="acc" x="12" y="188" width="220" height="64" rx="10"/>
  <text x="24" y="225.0">即時系統資料與動作</text>
  <line class="ln" x1="232" y1="220.0" x2="256" y2="220.0" marker-end="url(#a)"/>
  <rect class="acc" x="258" y="188" width="370" height="64" rx="10"/>
  <text class="b" x="270" y="214.0">MCP／API 工具</text>
  <text class="s" x="270" y="236.0">現在的值、要寫入；先唯讀再逐級放寬</text>
  <rect class="acc" x="12" y="260" width="220" height="64" rx="10"/>
  <text x="24" y="297.0">程式碼</text>
  <line class="ln" x1="232" y1="292.0" x2="256" y2="292.0" marker-end="url(#a)"/>
  <rect class="acc" x="258" y="260" width="370" height="64" rx="10"/>
  <text class="b" x="270" y="286.0">程式碼搜尋與 repo 工具</text>
  <text class="s" x="270" y="308.0">隨時在變，不適合當成文件索引（推論）</text>
  <rect class="acc" x="12" y="332" width="220" height="64" rx="10"/>
  <text x="24" y="369.0">編號、簽章、錯誤碼</text>
  <line class="ln" x1="232" y1="364.0" x2="256" y2="364.0" marker-end="url(#a)"/>
  <rect class="box" x="258" y="332" width="370" height="64" rx="10"/>
  <text class="b" x="270" y="358.0">資料庫或關鍵字搜尋</text>
  <text class="s" x="270" y="380.0">精確比對，不需要 RAG 或 wiki</text>
  <text class="s" x="320" y="428" text-anchor="middle">依本庫 Enterprise-AI-Integration 與 LLM-Wiki 整理；不依部門分，依型態分</text>
</svg>
