<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-labelledby="t d">
  <title id="t">每份 markdown 該放哪：依它的功能分類</title>
  <desc id="d">每週都必須遵守的規則放 CLAUDE.md、rules 或 managed CLAUDE.md，不放 plugin。某個任務的流程步驟放 SKILL.md。查閱用的參考資料放該 skill 的輔助檔。範例與模板放 skill 的 examples 或 templates。量大或常改的文件庫不打包，用 MCP 檢索服務。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="538.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">每份 markdown 該放哪？</text>
  <rect class="acc" x="12" y="44" width="276" height="64" rx="10"/>
  <text x="24" y="82">每個 session 都必須遵守的規則</text>
  <line class="ln" x1="288" y1="76" x2="322" y2="76" marker-end="url(#a)"/>
  <rect class="bad" x="324" y="44" width="304" height="64" rx="10"/>
  <text class="b" x="336" y="70">CLAUDE.md／rules（不放 plugin）</text>
  <text class="s" x="336" y="92">全公司：managed CLAUDE.md；專案：該 repo</text>
  <rect class="acc" x="12" y="120" width="276" height="64" rx="10"/>
  <text x="24" y="158">某個任務的流程步驟</text>
  <line class="ln" x1="288" y1="152" x2="322" y2="152" marker-end="url(#a)"/>
  <rect class="good" x="324" y="120" width="304" height="64" rx="10"/>
  <text class="b" x="336" y="146">SKILL.md</text>
  <text class="s" x="336" y="168">流程簡短，細節指向輔助檔</text>
  <rect class="acc" x="12" y="196" width="276" height="64" rx="10"/>
  <text x="24" y="234">查閱用的參考資料</text>
  <line class="ln" x1="288" y1="228" x2="322" y2="228" marker-end="url(#a)"/>
  <rect class="good" x="324" y="196" width="304" height="64" rx="10"/>
  <text class="b" x="336" y="222">skill 的輔助檔</text>
  <text class="s" x="336" y="244">reference.md、api-reference.md 等</text>
  <rect class="acc" x="12" y="272" width="276" height="64" rx="10"/>
  <text x="24" y="310">範例與模板</text>
  <line class="ln" x1="288" y1="304" x2="322" y2="304" marker-end="url(#a)"/>
  <rect class="good" x="324" y="272" width="304" height="64" rx="10"/>
  <text class="b" x="336" y="298">skill 的 examples／templates</text>
  <text class="s" x="336" y="320">和任務放在一起</text>
  <rect class="acc" x="12" y="348" width="276" height="64" rx="10"/>
  <text x="24" y="386">量大或常改的文件庫</text>
  <line class="ln" x1="288" y1="380" x2="322" y2="380" marker-end="url(#a)"/>
  <rect class="good" x="324" y="348" width="304" height="64" rx="10"/>
  <text class="b" x="336" y="374">MCP 檢索服務</text>
  <text class="s" x="336" y="396">不打包；來源只留一份</text>
  <rect class="box" x="12" y="432" width="616" height="96" rx="10"/>
  <text class="b" x="24" y="456">怎麼切 skill：依「任務」，不依「檔案」</text>
  <text x="24" y="478">・總是一起用於同一任務 → 同一個 skill，當輔助檔</text>
  <text x="24" y="496">・有獨立的觸發情境 → 拆成獨立 skill</text>
  <text x="24" y="514">・不要一份 markdown 一個 skill（描述每輪都佔 context）</text>
</svg>
