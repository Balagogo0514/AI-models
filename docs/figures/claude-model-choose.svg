<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 426" role="img" aria-labelledby="t d">
  <title id="t">選型流程：先看使用者有沒有明確指定，沒有就用 Opus 5.5</title>
  <desc id="d">起點是使用者有沒有明確指定模型。說要 Fable 或最強模型，用 claude-fable-5-1，要處理 refusal 與強制 tool_choice 回 400，且資料保留 30 天、不相容 ZDR。說要 Sonnet 或有明確成本考量，用 claude-sonnet-5-5。要 Haiku 或高吞吐低複雜度任務，用 claude-haiku-5-5，Haiku 4.5 只在需要舊機制時使用。沒有指定就用預設的 claude-opus-5-5，effort 預設 medium 且不能關閉 thinking。不應自行為了省錢降級。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="424.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">選型：誰決定模型？</text>
  <rect class="acc" x="170" y="40" width="300" height="34" rx="10"/>
  <text class="b" x="320" y="62" text-anchor="middle">使用者有明確指定模型嗎？</text>
  <line class="ln" x1="320" y1="75" x2="320" y2="90"/>
  <line class="ln" x1="24" y1="90" x2="320" y2="90"/>
  <line class="ln" x1="24" y1="90" x2="24" y2="135.0"/>
  <line class="ln" x1="24" y1="135.0" x2="36" y2="135.0"/>
  <rect class="acc" x="36" y="100" width="250" height="70" rx="10"/>
  <text x="48" y="140.0">說「Fable」或「最強模型」</text>
  <line class="ln" x1="286" y1="135.0" x2="316" y2="135.0" marker-end="url(#a)"/>
  <rect class="box" x="318" y="100" width="310" height="70" rx="10"/>
  <text class="monob" x="330" y="124">claude-fable-5-1</text>
  <text class="s" x="330" y="143">處理 refusal、強制 tool_choice 回 400</text>
  <text class="s" x="330" y="158">資料保留 30 天，不相容 ZDR</text>
  <line class="ln" x1="24" y1="90" x2="24" y2="215.0"/>
  <line class="ln" x1="24" y1="215.0" x2="36" y2="215.0"/>
  <rect class="acc" x="36" y="180" width="250" height="70" rx="10"/>
  <text x="48" y="220.0">說「Sonnet」或有明確成本考量</text>
  <line class="ln" x1="286" y1="215.0" x2="316" y2="215.0" marker-end="url(#a)"/>
  <rect class="box" x="318" y="180" width="310" height="70" rx="10"/>
  <text class="monob" x="330" y="204">claude-sonnet-5-5</text>
  <text class="s" x="330" y="223">降級是使用者的決定，不自行為省錢降級</text>
  <line class="ln" x1="24" y1="90" x2="24" y2="295.0"/>
  <line class="ln" x1="24" y1="295.0" x2="36" y2="295.0"/>
  <rect class="acc" x="36" y="260" width="250" height="70" rx="10"/>
  <text x="48" y="300.0">說「Haiku」，或高吞吐、低複雜度</text>
  <line class="ln" x1="286" y1="295.0" x2="316" y2="295.0" marker-end="url(#a)"/>
  <rect class="box" x="318" y="260" width="310" height="70" rx="10"/>
  <text class="monob" x="330" y="284">claude-haiku-5-5</text>
  <text class="s" x="330" y="303">1M 情境、$0.10／$0.50</text>
  <text class="s" x="330" y="318">Haiku 4.5 僅在需要舊機制時才用</text>
  <line class="ln" x1="24" y1="90" x2="24" y2="375.0"/>
  <line class="ln" x1="24" y1="375.0" x2="36" y2="375.0"/>
  <rect class="acc" x="36" y="340" width="250" height="70" rx="10"/>
  <text x="48" y="380.0">沒有指定（預設）</text>
  <line class="ln" x1="286" y1="375.0" x2="316" y2="375.0" marker-end="url(#a)"/>
  <rect class="good" x="318" y="340" width="310" height="70" rx="10"/>
  <text class="monob" x="330" y="364">claude-opus-5-5</text>
  <text class="s" x="330" y="383">effort 預設 medium、thinking 不能關閉</text>
  <text class="s" x="330" y="398">適合絕大多數程式開發與推理任務</text>
</svg>
