<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="t d">
  <title id="t">多個 codex exec 平行審查：腳本編排、唯讀、落地成檔、彙整與獨立驗證</title>
  <desc id="d">由你的腳本列出審查範圍，用 xargs 平行啟動多個 codex exec，每個 --sandbox read-only 加 -a never，用 -o 把最後訊息寫成各自的檔案，可用 --output-schema 固定格式。腳本檢查各程序的 exit code，失敗的重跑，再把輸出檔彙整成帳本，最後開一個全新的 codex exec 做獨立驗證，不要 resume。Codex 不會幫你協調，編排完全由你負責。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="498.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">多個 codex exec：編排由你負責</text>
  <rect class="box" x="12" y="44" width="616" height="54" rx="10"/>
  <text class="b" x="24" y="68">你的腳本：列出範圍 → xargs -P 3 平行啟動</text>
  <text class="mono" x="24" y="88">src/fib　src/neighbour　src/route</text>
  <line class="ln" x1="320" y1="99" x2="114" y2="126" marker-end="url(#a)"/>
  <rect class="good" x="24" y="128" width="180" height="96" rx="10"/>
  <text class="monob" x="114" y="152" text-anchor="middle">codex exec</text>
  <text class="mono" x="114" y="172" text-anchor="middle">--sandbox read-only</text>
  <text class="mono" x="114" y="190" text-anchor="middle">-a never</text>
  <text class="mono" x="114" y="210" text-anchor="middle">-o out/fib.md</text>
  <line class="ln" x1="114" y1="225" x2="320" y2="250" marker-end="url(#a)"/>
  <line class="ln" x1="320" y1="99" x2="318" y2="126" marker-end="url(#a)"/>
  <rect class="good" x="228" y="128" width="180" height="96" rx="10"/>
  <text class="monob" x="318" y="152" text-anchor="middle">codex exec</text>
  <text class="mono" x="318" y="172" text-anchor="middle">--sandbox read-only</text>
  <text class="mono" x="318" y="190" text-anchor="middle">-a never</text>
  <text class="mono" x="318" y="210" text-anchor="middle">-o out/neighbour.md</text>
  <line class="ln" x1="318" y1="225" x2="320" y2="250" marker-end="url(#a)"/>
  <line class="ln" x1="320" y1="99" x2="522" y2="126" marker-end="url(#a)"/>
  <rect class="good" x="432" y="128" width="180" height="96" rx="10"/>
  <text class="monob" x="522" y="152" text-anchor="middle">codex exec</text>
  <text class="mono" x="522" y="172" text-anchor="middle">--sandbox read-only</text>
  <text class="mono" x="522" y="190" text-anchor="middle">-a never</text>
  <text class="mono" x="522" y="210" text-anchor="middle">-o out/route.md</text>
  <line class="ln" x1="522" y1="225" x2="320" y2="250" marker-end="url(#a)"/>
  <rect class="acc" x="190" y="252" width="260" height="52" rx="10"/>
  <text class="b" x="320" y="276" text-anchor="middle">腳本檢查 exit code，失敗重跑</text>
  <text class="s" x="320" y="294" text-anchor="middle">輸出檔彙整成帳本</text>
  <line class="ln" x1="320" y1="305" x2="320" y2="324" marker-end="url(#a)"/>
  <rect class="bad" x="190" y="326" width="260" height="56" rx="10"/>
  <text class="b" x="320" y="350" text-anchor="middle">全新的 codex exec 獨立驗證</text>
  <text class="s" x="320" y="370" text-anchor="middle">不要 resume；只看主張與程式碼</text>
  <rect class="dash" x="12" y="398" width="616" height="90" rx="8"/>
  <text class="mono" x="24" y="420">要固定格式：--output-schema；要事件流：--json；不存 session：--ephemeral</text>
  <text class="s" x="24" y="444">平行跑時別讓它們共用同一個會被寫入的目錄</text>
  <text class="s" x="24" y="464">示意流程，未在實際環境執行；請依你的目錄與需求調整</text>
</svg>
