<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 648" role="img" aria-labelledby="t d">
  <title id="t">Jira 收到 coredump ticket 之後：要串的九個環節與工具</title>
  <desc id="d">九個環節由上到下。一，觸發：Jira webhook 或 Automation 的 Send web request。二，接收端：驗證、去重、回 2xx，可用 n8n 或自寫小 API。三，佇列與 worker：你們現有的 job queue 或 jobs 表。四，取證據：用 Jira REST API 取附件，或 artifact storage 的連結。五，擷取與去重：gdb 或 lldb、symbols、對應 commit 的 source、案件資料庫。六，分析：Claude API 加受控工具，或 claude -p。七，驗證：JSON schema，再轉成 Markdown。八，回寫：Jira REST API 加 comment、label、issue link。九，通知與人工核准：n8n、Slack 或 Teams，選用。一到八是必要，九是選用。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="646.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">Jira → parser → Jira：要串的環節</text>
  <rect class="acc" x="12" y="44" width="616" height="52" rx="10"/>
  <text class="b" x="26" y="75">1 觸發</text>
  <text x="176" y="75">Jira webhook，或 Automation「Send web request」</text>
  <text class="b" x="616" y="75" text-anchor="end">必要</text>
  <path class="ln" d="M320.0,96.0 L320.0,108.0" marker-end="url(#a)"/>
  <rect class="acc" x="12" y="108" width="616" height="52" rx="10"/>
  <text class="b" x="26" y="139">2 接收端</text>
  <text x="176" y="139">驗證、去重、立刻回 2xx（n8n 或自寫小 API）</text>
  <text class="b" x="616" y="139" text-anchor="end">必要</text>
  <path class="ln" d="M320.0,160.0 L320.0,172.0" marker-end="url(#a)"/>
  <rect class="acc" x="12" y="172" width="616" height="52" rx="10"/>
  <text class="b" x="26" y="203">3 佇列＋worker</text>
  <text x="176" y="203">你們現有的 job queue，或一張 jobs 表</text>
  <text class="b" x="616" y="203" text-anchor="end">必要</text>
  <path class="ln" d="M320.0,224.0 L320.0,236.0" marker-end="url(#a)"/>
  <rect class="acc" x="12" y="236" width="616" height="52" rx="10"/>
  <text class="b" x="26" y="267">4 取證據</text>
  <text x="176" y="267">Jira REST 取附件，或 artifact storage 的連結</text>
  <text class="b" x="616" y="267" text-anchor="end">必要</text>
  <path class="ln" d="M320.0,288.0 L320.0,300.0" marker-end="url(#a)"/>
  <rect class="acc" x="12" y="300" width="616" height="52" rx="10"/>
  <text class="b" x="26" y="331">5 擷取與去重</text>
  <text x="176" y="331">gdb／lldb、symbols、對應 commit 的 source、案件資料庫</text>
  <text class="b" x="616" y="331" text-anchor="end">必要</text>
  <path class="ln" d="M320.0,352.0 L320.0,364.0" marker-end="url(#a)"/>
  <rect class="acc" x="12" y="364" width="616" height="52" rx="10"/>
  <text class="b" x="26" y="395">6 分析</text>
  <text x="176" y="395">Claude API ＋ 受控工具（或 claude -p）</text>
  <text class="b" x="616" y="395" text-anchor="end">必要</text>
  <path class="ln" d="M320.0,416.0 L320.0,428.0" marker-end="url(#a)"/>
  <rect class="acc" x="12" y="428" width="616" height="52" rx="10"/>
  <text class="b" x="26" y="459">7 驗證</text>
  <text x="176" y="459">JSON schema → 轉成 Markdown</text>
  <text class="b" x="616" y="459" text-anchor="end">必要</text>
  <path class="ln" d="M320.0,480.0 L320.0,492.0" marker-end="url(#a)"/>
  <rect class="acc" x="12" y="492" width="616" height="52" rx="10"/>
  <text class="b" x="26" y="523">8 回寫</text>
  <text x="176" y="523">Jira REST：comment、label、issue link</text>
  <text class="b" x="616" y="523" text-anchor="end">必要</text>
  <path class="ln" d="M320.0,544.0 L320.0,556.0" marker-end="url(#a)"/>
  <rect class="box" x="12" y="556" width="616" height="52" rx="10"/>
  <text class="b" x="26" y="587">9 通知與核准</text>
  <text x="176" y="587">n8n、Slack、Teams</text>
  <text class="m" x="616" y="587" text-anchor="end">選用</text>
  <text class="s" x="320" y="632" text-anchor="middle">藍：必要；白：選用。一到八缺一不可，九可以晚點再加</text>
</svg>
