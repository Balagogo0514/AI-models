<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 556" role="img" aria-labelledby="t d">
  <title id="t">OpenAI 場景選型：九種需求對應的建議模型</title>
  <desc id="d">最強通用推理與複雜 coding 用 gpt-5.6-sol，alias 為 gpt-5.6；智能與成本平衡用 gpt-5.6-terra；大量請求與成本敏感 agent 用 gpt-5.6-luna；深度研究用 o3-deep-research，便宜版 o4-mini-deep-research；即時語音 agent 用 gpt-realtime-2.1，低成本版為 mini；圖像生成用 gpt-image-2，成本優先為 gpt-image-1-mini；影片用 sora-2-pro，迭代速度優先用 sora-2；向量檢索預設 text-embedding-3-small，高品質用 large；內容審查用 omni-moderation-latest。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="554.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">場景 → 建議模型</text>
  <rect class="acc" x="12" y="44" width="270" height="48" rx="10"/>
  <text x="24" y="73.0">最強通用推理、複雜 coding、代理工作流</text>
  <line class="ln" x1="282" y1="68.0" x2="316" y2="68.0" marker-end="url(#a)"/>
  <rect class="good" x="318" y="44" width="310" height="48" rx="10"/>
  <text class="b" x="330" y="62.0">gpt-5.6-sol（alias gpt-5.6）</text>
  <text class="s" x="330" y="84.0">1.05M 情境／128K 輸出，完整工具能力</text>
  <rect class="acc" x="12" y="98" width="270" height="48" rx="10"/>
  <text x="24" y="127.0">智能與成本平衡（多數正式產品）</text>
  <line class="ln" x1="282" y1="122.0" x2="316" y2="122.0" marker-end="url(#a)"/>
  <rect class="good" x="318" y="98" width="310" height="48" rx="10"/>
  <text class="b" x="330" y="116.0">gpt-5.6-terra</text>
  <text class="s" x="330" y="138.0">價格約為 Sol 的一半</text>
  <rect class="acc" x="12" y="152" width="270" height="48" rx="10"/>
  <text x="24" y="181.0">大量請求、成本敏感 agent</text>
  <line class="ln" x1="282" y1="176.0" x2="316" y2="176.0" marker-end="url(#a)"/>
  <rect class="box" x="318" y="152" width="310" height="48" rx="10"/>
  <text class="b" x="330" y="170.0">gpt-5.6-luna</text>
  <text class="s" x="330" y="192.0">最新便宜版，適合高吞吐量</text>
  <rect class="acc" x="12" y="206" width="270" height="48" rx="10"/>
  <text x="24" y="235.0">深度研究報告</text>
  <line class="ln" x1="282" y1="230.0" x2="316" y2="230.0" marker-end="url(#a)"/>
  <rect class="box" x="318" y="206" width="310" height="48" rx="10"/>
  <text class="b" x="330" y="224.0">o3-deep-research</text>
  <text class="s" x="330" y="246.0">便宜版：o4-mini-deep-research</text>
  <rect class="acc" x="12" y="260" width="270" height="48" rx="10"/>
  <text x="24" y="289.0">即時語音 agent</text>
  <line class="ln" x1="282" y1="284.0" x2="316" y2="284.0" marker-end="url(#a)"/>
  <rect class="box" x="318" y="260" width="310" height="48" rx="10"/>
  <text class="b" x="330" y="278.0">gpt-realtime-2.1</text>
  <text class="s" x="330" y="300.0">低成本版：gpt-realtime-2.1-mini</text>
  <rect class="acc" x="12" y="314" width="270" height="48" rx="10"/>
  <text x="24" y="343.0">圖像生成／編修</text>
  <line class="ln" x1="282" y1="338.0" x2="316" y2="338.0" marker-end="url(#a)"/>
  <rect class="box" x="318" y="314" width="310" height="48" rx="10"/>
  <text class="b" x="330" y="332.0">gpt-image-2</text>
  <text class="s" x="330" y="354.0">成本優先：gpt-image-1-mini</text>
  <rect class="acc" x="12" y="368" width="270" height="48" rx="10"/>
  <text x="24" y="397.0">影片生成</text>
  <line class="ln" x1="282" y1="392.0" x2="316" y2="392.0" marker-end="url(#a)"/>
  <rect class="box" x="318" y="368" width="310" height="48" rx="10"/>
  <text class="b" x="330" y="386.0">sora-2-pro</text>
  <text class="s" x="330" y="408.0">迭代速度優先：sora-2</text>
  <rect class="acc" x="12" y="422" width="270" height="48" rx="10"/>
  <text x="24" y="451.0">向量檢索</text>
  <line class="ln" x1="282" y1="446.0" x2="316" y2="446.0" marker-end="url(#a)"/>
  <rect class="box" x="318" y="422" width="310" height="48" rx="10"/>
  <text class="b" x="330" y="440.0">text-embedding-3-small</text>
  <text class="s" x="330" y="462.0">高品質：text-embedding-3-large</text>
  <rect class="acc" x="12" y="476" width="270" height="48" rx="10"/>
  <text x="24" y="505.0">內容審查</text>
  <line class="ln" x1="282" y1="500.0" x2="316" y2="500.0" marker-end="url(#a)"/>
  <rect class="box" x="318" y="476" width="310" height="48" rx="10"/>
  <text class="b" x="330" y="494.0">omni-moderation-latest</text>
  <text class="s" x="330" y="516.0">文字與圖片；pricing 頁未單列費率</text>
  <text class="s" x="320" y="546" text-anchor="middle">新專案先從 gpt-5.6 家族開始；除非有相容性需求，不要一開始選 gpt-5.5／5.4</text>
</svg>
