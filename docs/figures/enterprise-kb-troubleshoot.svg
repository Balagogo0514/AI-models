<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img" aria-labelledby="t d">
  <title id="t">issue 排查：一個問題如何用到多種機制（設計構想）</title>
  <desc id="d">工程師問：這個 crash 以前出現過嗎。經閘道層驗證身分並稽核後，同時查四路：案件資料庫與 LLM Wiki 以簽章查已知根因；MCP 工具查 ticket 與 build 的目前狀態；RAG 查設計文件與 runbook；程式碼搜尋查相關 commit。彙整成附引用與來源連結的答案。若是已知問題，答案連到根因頁；若不是，就進入分析，人工核准後才寫入 wiki，供下次使用。這是設計構想，沒有實作過整合。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="698.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">issue 排查的查詢流程</text>
  <rect class="box" x="110.0" y="48.0" width="420" height="44" rx="8"/>
  <text class="b" x="320" y="74" text-anchor="middle">工程師提問：「這個 crash 以前出現過嗎？」</text>
  <path class="ln" d="M320.0,92.0 L320.0,120.0" marker-end="url(#a)"/>
  <rect class="acc" x="110.0" y="124.0" width="420" height="44" rx="8"/>
  <text class="b" x="320" y="150" text-anchor="middle">閘道層：驗證身分、依權限、稽核</text>
  <path class="ln" d="M320.0,168.0 L320.0,220.0" marker-end="url(#a)"/>
  <text class="s" x="368" y="200" text-anchor="middle">並行查詢</text>
  <rect class="good" x="35.0" y="220.0" width="270" height="64" rx="8"/>
  <text class="b" x="170" y="248" text-anchor="middle">案件資料庫 ＋ wiki</text>
  <text x="170" y="264" text-anchor="middle">用簽章查已知根因與修復版本</text>
  <rect class="acc" x="335.0" y="220.0" width="270" height="64" rx="8"/>
  <text class="b" x="470" y="248" text-anchor="middle">MCP／API 工具</text>
  <text x="470" y="264" text-anchor="middle">ticket、build 的目前狀態</text>
  <rect class="good" x="35.0" y="304.0" width="270" height="64" rx="8"/>
  <text class="b" x="170" y="332" text-anchor="middle">RAG</text>
  <text x="170" y="348" text-anchor="middle">設計文件、runbook</text>
  <rect class="acc" x="335.0" y="304.0" width="270" height="64" rx="8"/>
  <text class="b" x="470" y="332" text-anchor="middle">程式碼搜尋</text>
  <text x="470" y="348" text-anchor="middle">相關 commit、blame</text>
  <path class="ln" d="M320.0,392.0 L320.0,416.0" marker-end="url(#a)"/>
  <rect class="box" x="110.0" y="420.0" width="420" height="44" rx="8"/>
  <text class="b" x="320" y="446" text-anchor="middle">彙整答案：附引用與來源連結</text>
  <path class="ln" d="M320.0,464.0 L320.0,490.0" marker-end="url(#a)"/>
  <polygon class="acc" points="320,492.0 470.0,530 320,568.0 170.0,530"/>
  <text class="b" x="320" y="534" text-anchor="middle">是已知問題？</text>
  <rect class="good" x="500.0" y="502.0" width="132" height="56" rx="8"/>
  <text class="b" x="566" y="526" text-anchor="middle">答案連到根因頁</text>
  <text x="566" y="542" text-anchor="middle">結束</text>
  <path class="ln" d="M470.0,530.0 L498.0,530.0" marker-end="url(#a)"/>
  <text class="s" x="484" y="520" text-anchor="middle">是</text>
  <path class="ln" d="M320.0,568.0 L320.0,592.0" marker-end="url(#a)"/>
  <text class="s" x="332" y="584" text-anchor="middle">否</text>
  <rect class="bad" x="100.0" y="600.0" width="440" height="52" rx="8"/>
  <text class="b" x="320" y="622" text-anchor="middle">分析 → 人工核准 → 寫入 wiki 與案件資料庫</text>
  <text x="320" y="638" text-anchor="middle">（下次就是已知問題）</text>
  <text class="s" x="320" y="690" text-anchor="middle">設計構想；整合沒有實作過</text>
</svg>
