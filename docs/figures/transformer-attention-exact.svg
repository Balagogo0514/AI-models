<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d">
  <title id="t">哪些機制仍是 exact softmax attention</title>
  <desc id="d">分四類：第一類是 exact softmax 全域 attention，包含標準 MHA、FlashAttention、MQA 與 GQA、MLA，只改效率，不改數學定義；第二類是在允許的連線上 exact，包含 sliding-window 與 block sparse，但相對全域是稀疏的；第三類不是 exact softmax，包含 Performer 與 kernel linear attention、Gated DeltaNet 與 Kimi Delta Attention，以近似或固定大小 recurrent state 換取近線性成本；第四類是 hybrid，部分層是 exact、部分層不是，例如 Qwen3-Next 與 Kimi K3。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="518.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">exact softmax attention 的邊界</text>
  <rect class="good" x="12" y="44" width="616" height="112" rx="10"/>
  <text class="b" x="24" y="68">exact softmax（全域）</text>
  <text class="s" x="24" y="88">輸出與原始 Transformer 公式相同，只改效率或 KV 儲存</text>
  <rect class="box" x="24" y="100" width="65" height="24" rx="6"/>
  <text class="mono" x="33" y="116">標準 MHA</text>
  <rect class="box" x="95" y="100" width="110" height="24" rx="6"/>
  <text class="mono" x="104" y="116">FlashAttention</text>
  <rect class="box" x="211" y="100" width="68" height="24" rx="6"/>
  <text class="mono" x="220" y="116">MQA／GQA</text>
  <rect class="box" x="285" y="100" width="164" height="24" rx="6"/>
  <text class="mono" x="294" y="116">MLA（KV 以 latent 壓縮）</text>
  <rect class="acc" x="12" y="164" width="616" height="98" rx="10"/>
  <text class="b" x="24" y="188">僅在允許的連線上 exact</text>
  <text class="s" x="24" y="208">對保留的 key 做 exact softmax；相對全域則是稀疏</text>
  <rect class="box" x="24" y="220" width="110" height="24" rx="6"/>
  <text class="mono" x="33" y="236">Sliding-window</text>
  <rect class="box" x="140" y="220" width="242" height="24" rx="6"/>
  <text class="mono" x="149" y="236">Block-sparse（Longformer／BigBird）</text>
  <rect class="bad" x="12" y="270" width="616" height="98" rx="10"/>
  <text class="b" x="24" y="294">非 exact softmax</text>
  <text class="s" x="24" y="314">以近似或固定大小 recurrent state 換近線性成本</text>
  <rect class="box" x="24" y="326" width="161" height="24" rx="6"/>
  <text class="mono" x="33" y="342">Performer／linear attn</text>
  <rect class="box" x="191" y="326" width="110" height="24" rx="6"/>
  <text class="mono" x="200" y="342">Gated DeltaNet</text>
  <rect class="box" x="307" y="326" width="192" height="24" rx="6"/>
  <text class="mono" x="316" y="342">Kimi Delta Attention（KDA）</text>
  <rect class="box" x="12" y="376" width="616" height="98" rx="10"/>
  <text class="b" x="24" y="400">hybrid（部分層是、部分層否）</text>
  <text class="s" x="24" y="420">多數線性層 ＋ 少數全域 attention 層，折衷效率與精確檢索</text>
  <rect class="box" x="24" y="432" width="84" height="24" rx="6"/>
  <text class="mono" x="33" y="448">Qwen3-Next</text>
  <rect class="box" x="114" y="432" width="64" height="24" rx="6"/>
  <text class="mono" x="123" y="448">Kimi K3</text>
  <text class="s" x="320" y="494" text-anchor="middle">「exact」不代表一定會顯式儲存完整 n×n 矩陣（FlashAttention 就不會）</text>
</svg>
