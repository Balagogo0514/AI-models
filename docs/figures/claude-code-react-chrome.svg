<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="t d">
  <title id="t">Claude Code 如何直接檢查 Chrome 的輸出：從 prompt 到讀回 console 與 DOM</title>
  <desc id="d">你先自己啟動 React 的 dev server，再用 claude --chrome 啟動 Claude Code，並下指令例如開啟 localhost 並檢查 console 錯誤。Claude Code 呼叫 claude-in-chrome 的瀏覽器工具，可用 /mcp 查看工具清單。Claude in Chrome 擴充功能在你的 Chrome 開新分頁，共用你的登入狀態，動作在可見的視窗進行；遇到登入頁或 CAPTCHA 會暫停請你處理。Claude 讀取 console 錯誤與 DOM 狀態，也可以截圖存到磁碟或錄 GIF。結果回到 Claude Code，據此修改程式並重新驗證。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="558.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">Chrome 整合：Claude 怎麼看到輸出</text>
  <rect class="box" x="20.0" y="44.0" width="440" height="58" rx="8"/>
  <text class="b" x="240" y="69" text-anchor="middle">1 你：先跑起 dev server</text>
  <text x="240" y="85" text-anchor="middle">建議在另一個終端機執行 yarn start</text>
  <path class="ln" d="M240.0,102.0 L240.0,122.0" marker-end="url(#a)"/>
  <rect class="acc" x="20.0" y="122.0" width="440" height="58" rx="8"/>
  <text class="b" x="240" y="147" text-anchor="middle">2 你：claude --chrome ＋ 下指令</text>
  <text x="240" y="163" text-anchor="middle">例：開啟 localhost，檢查載入時 console 有沒有錯誤</text>
  <path class="ln" d="M240.0,180.0 L240.0,200.0" marker-end="url(#a)"/>
  <rect class="acc" x="20.0" y="200.0" width="440" height="58" rx="8"/>
  <text class="b" x="240" y="225" text-anchor="middle">3 Claude Code：呼叫瀏覽器工具</text>
  <text x="240" y="241" text-anchor="middle">claude-in-chrome 的工具；/mcp 可看完整清單</text>
  <path class="ln" d="M240.0,258.0 L240.0,278.0" marker-end="url(#a)"/>
  <rect class="good" x="20.0" y="278.0" width="440" height="58" rx="8"/>
  <text class="b" x="240" y="303" text-anchor="middle">4 擴充功能：在 Chrome 開新分頁</text>
  <text x="240" y="319" text-anchor="middle">共用你的登入狀態；可見視窗即時操作</text>
  <path class="ln" d="M240.0,336.0 L240.0,356.0" marker-end="url(#a)"/>
  <rect class="good" x="20.0" y="356.0" width="440" height="58" rx="8"/>
  <text class="b" x="240" y="381" text-anchor="middle">5 讀回輸出</text>
  <text x="240" y="397" text-anchor="middle">console 錯誤、DOM 狀態；可截圖存檔、錄 GIF</text>
  <path class="ln" d="M240.0,414.0 L240.0,434.0" marker-end="url(#a)"/>
  <rect class="box" x="20.0" y="434.0" width="440" height="58" rx="8"/>
  <text class="b" x="240" y="459" text-anchor="middle">6 回到 Claude Code：修程式、重新驗證</text>
  <text x="240" y="475" text-anchor="middle">你審查 diff 再 commit</text>
  <rect class="bad" x="491.0" y="278.0" width="130" height="58" rx="8"/>
  <text x="556" y="295" text-anchor="middle">遇到登入頁或</text>
  <text x="556" y="311" text-anchor="middle">CAPTCHA：暫停</text>
  <text x="556" y="327" text-anchor="middle">請你處理</text>
  <path class="dash" d="M460.0,307.0 L491.0,307.0" marker-end="url(#a)"/>
  <text class="s" x="320" y="532" text-anchor="middle">依官方 Chrome 整合頁面整理；Network 請求官方頁面沒有列出</text>
</svg>
