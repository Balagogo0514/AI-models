<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="t d">
  <title id="t">Attention 相關技術落在哪一層：模型架構、位置、kernel、分散式與 serving</title>
  <desc id="d">由上到下五層：模型架構層包含 MQA、GQA、MLA、sparse、linear 與 hybrid，是 checkpoint 的架構特徵；位置表示層包含 RoPE、YaRN、ALiBi，改變 score 如何編碼距離；GPU kernel 層是 FlashAttention，不改變結果；分散式層是 Ring Attention，通常為 exact；Serving 層包含 PagedAttention、continuous batching、prefix caching 與 KV cache quantization，前三者不改結果，KV quantization 屬近似或資料表示改動。FlashAttention 管一次計算如何讀寫 GPU memory，PagedAttention 管多個 request 的 KV cache 配置，兩者可同時使用。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="498.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">技術落在哪一層</text>
  <rect class="hd" x="12" y="44" width="616" height="26" rx="6"/>
  <text class="b" x="20" y="62">層次</text>
  <text class="b" x="138" y="62">代表技術</text>
  <text class="b" x="468" y="62">是否改變結果</text>
  <rect class="acc" x="12" y="78" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="107.0">模型架構</text>
  <rect class="box" x="138" y="91.0" width="95" height="24" rx="6"/>
  <text class="mono" x="147" y="107.0">MQA／GQA／MLA</text>
  <rect class="box" x="239" y="91.0" width="55" height="24" rx="6"/>
  <text class="mono" x="248" y="107.0">sparse</text>
  <rect class="box" x="300" y="91.0" width="104" height="24" rx="6"/>
  <text class="mono" x="309" y="107.0">linear／hybrid</text>
  <text class="s" x="468" y="107.0">是：checkpoint 的架構特徵</text>
  <rect class="box" x="12" y="134" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="163.0">位置表示</text>
  <rect class="box" x="138" y="147.0" width="43" height="24" rx="6"/>
  <text class="mono" x="147" y="163.0">RoPE</text>
  <rect class="box" x="187" y="147.0" width="43" height="24" rx="6"/>
  <text class="mono" x="196" y="163.0">YaRN</text>
  <rect class="box" x="236" y="147.0" width="49" height="24" rx="6"/>
  <text class="mono" x="245" y="163.0">ALiBi</text>
  <text class="s" x="468" y="163.0">改變 score 如何編碼距離</text>
  <rect class="good" x="12" y="190" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="219.0">GPU kernel</text>
  <rect class="box" x="138" y="203.0" width="152" height="24" rx="6"/>
  <text class="mono" x="147" y="219.0">FlashAttention 1／2／3</text>
  <text class="s" x="468" y="219.0">否：exact attention</text>
  <rect class="good" x="12" y="246" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="275.0">分散式</text>
  <rect class="box" x="138" y="259.0" width="106" height="24" rx="6"/>
  <text class="mono" x="147" y="275.0">Ring Attention</text>
  <text class="s" x="468" y="275.0">否：通常為 exact</text>
  <rect class="good" x="12" y="302" width="616" height="82" rx="8"/>
  <text class="b" x="20" y="347.0">Serving／runtime</text>
  <rect class="box" x="138" y="312" width="106" height="24" rx="6"/>
  <text class="mono" x="147" y="328">PagedAttention</text>
  <rect class="box" x="250" y="312" width="138" height="24" rx="6"/>
  <text class="mono" x="259" y="328">continuous batching</text>
  <rect class="box" x="138" y="342" width="106" height="24" rx="6"/>
  <text class="mono" x="147" y="358">prefix caching</text>
  <rect class="box" x="250" y="342" width="167" height="24" rx="6"/>
  <text class="mono" x="259" y="358">KV quantization／offload</text>
  <text class="s" x="468" y="339.0">否；KV quantization 屬近似</text>
  <text class="s" x="468" y="355.0">或資料表示改動</text>
  <rect class="acc" x="12" y="394" width="616" height="52" rx="10"/>
  <text x="24" y="416">FlashAttention：一次 attention 計算如何讀寫 GPU memory</text>
  <text x="24" y="436">PagedAttention：多個 request 的歷史 K/V cache 如何配置與回收；兩者可同時使用</text>
  <text class="s" x="320" y="468" text-anchor="middle">MoE 是 FFN 的 routing 稀疏化、Mamba／SSM 是 attention 替代架構，都不屬於 attention 強化</text>
</svg>
