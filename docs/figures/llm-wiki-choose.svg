<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="t d">
  <title id="t">什麼情況適合用 LLM Wiki</title>
  <desc id="d">五種情況。資料量約一百份、數百頁：適合，gist 說用 index 即可，不需要 embedding 式 RAG。資料量遠大於此：要搭配搜尋或 RAG，我沒有資料，需要評估。需要即時反映來源最新狀態：要承擔重新匯入的落差。答案要可追溯、可稽核：保留原始資料與 log，頁面引用來源。沒有人審閱、錯誤會累積：不建議，LLM 的錯誤會被寫進頁面並被後續引用，這是我的推論。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="428.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">什麼情況適合？</text>
  <rect class="acc" x="12" y="44" width="230" height="62" rx="10"/>
  <text x="24" y="80.0">資料約 100 份、數百頁</text>
  <line class="ln" x1="242" y1="75.0" x2="266" y2="75.0" marker-end="url(#a)"/>
  <rect class="good" x="268" y="44" width="360" height="62" rx="10"/>
  <text class="b" x="280" y="69.0">適合</text>
  <text class="s" x="280" y="91.0">gist：用 index 即可，不需要 embedding 式 RAG</text>
  <rect class="acc" x="12" y="114" width="230" height="62" rx="10"/>
  <text x="24" y="150.0">資料量遠大於此</text>
  <line class="ln" x1="242" y1="145.0" x2="266" y2="145.0" marker-end="url(#a)"/>
  <rect class="box" x="268" y="114" width="360" height="62" rx="10"/>
  <text class="b" x="280" y="139.0">要評估</text>
  <text class="s" x="280" y="161.0">要搭配搜尋或 RAG；我沒有資料</text>
  <rect class="acc" x="12" y="184" width="230" height="62" rx="10"/>
  <text x="24" y="220.0">要即時反映來源最新狀態</text>
  <line class="ln" x1="242" y1="215.0" x2="266" y2="215.0" marker-end="url(#a)"/>
  <rect class="box" x="268" y="184" width="360" height="62" rx="10"/>
  <text class="b" x="280" y="209.0">要承擔落差</text>
  <text class="s" x="280" y="231.0">來源更新後要重新匯入（二手說法）</text>
  <rect class="acc" x="12" y="254" width="230" height="62" rx="10"/>
  <text x="24" y="290.0">答案要可追溯、可稽核</text>
  <line class="ln" x1="242" y1="285.0" x2="266" y2="285.0" marker-end="url(#a)"/>
  <rect class="good" x="268" y="254" width="360" height="62" rx="10"/>
  <text class="b" x="280" y="279.0">適合</text>
  <text class="s" x="280" y="301.0">保留原始資料與 log，頁面引用來源</text>
  <rect class="acc" x="12" y="324" width="230" height="62" rx="10"/>
  <text x="24" y="360.0">沒有人審閱、錯誤會累積</text>
  <line class="ln" x1="242" y1="355.0" x2="266" y2="355.0" marker-end="url(#a)"/>
  <rect class="bad" x="268" y="324" width="360" height="62" rx="10"/>
  <text class="b" x="280" y="349.0">不建議</text>
  <text class="s" x="280" y="371.0">LLM 的錯誤會被寫進頁面並被引用（推論）</text>
  <text class="s" x="320" y="416" text-anchor="middle">判斷是我的歸納；gist 本身沒有列出限制</text>
</svg>
