<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d">
  <title id="t">coredump 分析的成本由哪些部分組成</title>
  <desc id="d">成本分五塊。模型 token：本庫有價格，可以估算。基礎設施：sandbox 運算、core 與 artifact 儲存、symbol 下載、佇列與資料庫，沒有數據。開發與維運人力：Messages API 最高、Claude Code 最低，是推論，沒有數據。平台與授權：n8n、Claude Code 訂閱或用量、LangSmith 等，沒有查證。誤判成本：高信心卻錯的結論造成的人力與延誤，沒有數據。綠色表示本庫有價格資料，橘色表示沒有數據，需要你們自己的數字。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="438.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">成本由哪些部分組成</text>
  <rect class="acc" x="12" y="44" width="200" height="62" rx="10"/>
  <text x="24" y="80.0">模型 token</text>
  <line class="ln" x1="212" y1="75.0" x2="242" y2="75.0" marker-end="url(#a)"/>
  <rect class="good" x="244" y="44" width="384" height="62" rx="10"/>
  <text class="b" x="256" y="69.0">有價格，可以估算</text>
  <text class="s" x="256" y="91.0">取自 Claude-Model（2026-10-06）</text>
  <rect class="acc" x="12" y="114" width="200" height="62" rx="10"/>
  <text x="24" y="150.0">基礎設施</text>
  <line class="ln" x1="212" y1="145.0" x2="242" y2="145.0" marker-end="url(#a)"/>
  <rect class="bad" x="244" y="114" width="384" height="62" rx="10"/>
  <text class="b" x="256" y="139.0">沒有數據</text>
  <text class="s" x="256" y="161.0">sandbox 運算、core／artifact 儲存、symbol 下載</text>
  <rect class="acc" x="12" y="184" width="200" height="62" rx="10"/>
  <text x="24" y="220.0">開發與維運人力</text>
  <line class="ln" x1="212" y1="215.0" x2="242" y2="215.0" marker-end="url(#a)"/>
  <rect class="bad" x="244" y="184" width="384" height="62" rx="10"/>
  <text class="b" x="256" y="209.0">沒有數據</text>
  <text class="s" x="256" y="231.0">Messages API 最高、Claude Code 最低（推論）</text>
  <rect class="acc" x="12" y="254" width="200" height="62" rx="10"/>
  <text x="24" y="290.0">平台與授權</text>
  <line class="ln" x1="212" y1="285.0" x2="242" y2="285.0" marker-end="url(#a)"/>
  <rect class="bad" x="244" y="254" width="384" height="62" rx="10"/>
  <text class="b" x="256" y="279.0">沒有數據</text>
  <text class="s" x="256" y="301.0">n8n、Claude Code 方案、LangSmith 等；沒查證</text>
  <rect class="acc" x="12" y="324" width="200" height="62" rx="10"/>
  <text x="24" y="360.0">誤判成本</text>
  <line class="ln" x1="212" y1="355.0" x2="242" y2="355.0" marker-end="url(#a)"/>
  <rect class="bad" x="244" y="324" width="384" height="62" rx="10"/>
  <text class="b" x="256" y="349.0">沒有數據</text>
  <text class="s" x="256" y="371.0">高信心卻錯的結論造成的人力與延誤</text>
  <text class="s" x="320" y="426" text-anchor="middle">綠：本庫有價格資料；橘：沒有數據，需要你們自己的數字</text>
</svg>
