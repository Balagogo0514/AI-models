<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="t d">
  <title id="t">驗證狀態：哪些用真實環境測過，哪些只用 mock，哪些沒測</title>
  <desc id="d">八個元件的驗證狀態。gdb、readelf、file、git 工具：用真實 gdb 15.1 與真實 core 測過。SQLite jobs、去重與重啟復原：用真實 SQLite 測過。webhook 接收：用 FastAPI TestClient 與真實 uvicorn 加 curl 測過。Jira 客戶端：用 MockTransport 驗證我寫的 URL、標頭與 body，只驗證我寫的格式。Claude 迴圈：用 anthropic SDK 加 MockTransport 驗證請求與回應處理，只驗證格式與流程。真實 Jira Cloud、真實 Claude API 呼叫、docker 沙箱前綴：沒有測。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="558.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">驗證狀態</text>
  <rect class="good" x="12" y="44" width="616" height="54" rx="8"/>
  <text class="b" x="24" y="68">gdb／readelf／file／git 工具</text>
  <text class="s" x="24" y="87">真實 gdb 15.1 ＋ 真實 core</text>
  <text class="b" x="620" y="77" text-anchor="end">已測</text>
  <rect class="good" x="12" y="106" width="616" height="54" rx="8"/>
  <text class="b" x="24" y="130">SQLite jobs、去重、重啟復原</text>
  <text class="s" x="24" y="149">真實 SQLite</text>
  <text class="b" x="620" y="139" text-anchor="end">已測</text>
  <rect class="good" x="12" y="168" width="616" height="54" rx="8"/>
  <text class="b" x="24" y="192">webhook 接收（FastAPI）</text>
  <text class="s" x="24" y="211">TestClient ＋ 真實 uvicorn ＋ curl</text>
  <text class="b" x="620" y="201" text-anchor="end">已測</text>
  <rect class="acc" x="12" y="230" width="616" height="54" rx="8"/>
  <text class="b" x="24" y="254">Jira 客戶端的請求格式</text>
  <text class="s" x="24" y="273">MockTransport：驗證 URL、標頭、body</text>
  <text class="b" x="620" y="263" text-anchor="end">只驗證我寫的格式</text>
  <rect class="acc" x="12" y="292" width="616" height="54" rx="8"/>
  <text class="b" x="24" y="316">Claude 迴圈的請求與回應處理</text>
  <text class="s" x="24" y="335">anthropic SDK ＋ MockTransport</text>
  <text class="b" x="620" y="325" text-anchor="end">只驗證格式與流程</text>
  <rect class="bad" x="12" y="354" width="616" height="54" rx="8"/>
  <text class="b" x="24" y="378">真實 Jira Cloud</text>
  <text class="s" x="24" y="397">—</text>
  <text class="b" x="620" y="387" text-anchor="end">沒測</text>
  <rect class="bad" x="12" y="416" width="616" height="54" rx="8"/>
  <text class="b" x="24" y="440">真實 Claude API 呼叫</text>
  <text class="s" x="24" y="459">—</text>
  <text class="b" x="620" y="449" text-anchor="end">沒測（含思考區塊的真實回傳）</text>
  <rect class="bad" x="12" y="478" width="616" height="54" rx="8"/>
  <text class="b" x="24" y="502">docker 沙箱前綴</text>
  <text class="s" x="24" y="521">—</text>
  <text class="b" x="620" y="511" text-anchor="end">沒測（只測了前綴會被加上）</text>
  <text class="s" x="320" y="552" text-anchor="middle">綠：真實環境測過　藍：只用 mock　橘：沒測</text>
</svg>
