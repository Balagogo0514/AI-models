<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="t d">
  <title id="t">Graph Engineering 流程圖：Plan、Guard、Act、Observe、Validate 與重試／升級迴圈</title>
  <desc id="d">從接收任務開始，載入或建立 State，Plan 判斷下一個最小工作單位，再經 Guard 檢查權限、預算、風險與迭代次數。不通過則暫停、請求人工核准或結束；通過則 Act 呼叫受控工具或子 Agent，Observe 收集工具結果，Validate 做 schema、證據與品質檢查。若已完成，產出可稽核結果；否則判斷是否需要升級或重試：重試回到 Plan，升級則切換專家、請求人工或增加核准預算後再回到 Plan。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="758.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">Graph Engineering：Agent 的狀態圖</text>
  <rect class="box" x="190.0" y="44.0" width="220" height="40" rx="8"/>
  <text x="300" y="68" text-anchor="middle">接收任務</text>
  <rect class="box" x="190.0" y="110.0" width="220" height="40" rx="8"/>
  <text x="300" y="134" text-anchor="middle">載入／建立 State</text>
  <rect class="acc" x="190.0" y="176.0" width="220" height="40" rx="8"/>
  <text x="300" y="192" text-anchor="middle">Plan：判斷下一個</text>
  <text x="300" y="208" text-anchor="middle">最小工作單位</text>
  <polygon class="acc" points="300,239.0 420.0,277 300,315.0 180.0,277"/>
  <text class="b" x="300" y="273" text-anchor="middle">Guard 檢查</text>
  <text x="300" y="289" text-anchor="middle">權限、預算、風險、迭代次數</text>
  <rect class="good" x="190.0" y="338.0" width="220" height="40" rx="8"/>
  <text x="300" y="362" text-anchor="middle">Act：呼叫受控工具或子 Agent</text>
  <rect class="box" x="190.0" y="404.0" width="220" height="40" rx="8"/>
  <text x="300" y="428" text-anchor="middle">Observe：收集工具結果</text>
  <rect class="box" x="190.0" y="470.0" width="220" height="40" rx="8"/>
  <text x="300" y="494" text-anchor="middle">Validate：schema、證據與品質檢查</text>
  <polygon class="acc" points="300,533.0 410.0,571 300,609.0 190.0,571"/>
  <text class="b" x="300" y="575" text-anchor="middle">是否完成？</text>
  <polygon class="acc" points="300,637.0 420.0,675 300,713.0 180.0,675"/>
  <text class="b" x="300" y="679" text-anchor="middle">是否需要升級或重試？</text>
  <rect class="bad" x="455.0" y="250.0" width="170" height="54" rx="8"/>
  <text x="540" y="273" text-anchor="middle">暫停／請求人工核准</text>
  <text x="540" y="289" text-anchor="middle">／結束</text>
  <rect class="good" x="455.0" y="544.0" width="170" height="54" rx="8"/>
  <text x="540" y="575" text-anchor="middle">產出可稽核結果</text>
  <rect class="box" x="455.0" y="648.0" width="170" height="54" rx="8"/>
  <text x="540" y="671" text-anchor="middle">切換專家／請求人工</text>
  <text x="540" y="687" text-anchor="middle">／增加核准預算</text>
  <path class="ln" d="M300.0,84.0 L300.0,110.0" marker-end="url(#a)"/>
  <path class="ln" d="M300.0,150.0 L300.0,176.0" marker-end="url(#a)"/>
  <path class="ln" d="M300.0,216.0 L300.0,239.0" marker-end="url(#a)"/>
  <path class="ln" d="M300.0,378.0 L300.0,404.0" marker-end="url(#a)"/>
  <path class="ln" d="M300.0,444.0 L300.0,470.0" marker-end="url(#a)"/>
  <path class="ln" d="M300.0,510.0 L300.0,533.0" marker-end="url(#a)"/>
  <path class="ln" d="M420.0,277.0 L455.0,277.0" marker-end="url(#a)"/>
  <text class="s" x="437" y="268" text-anchor="middle">不通過</text>
  <path class="ln" d="M300.0,315.0 L300.0,338.0" marker-end="url(#a)"/>
  <text class="s" x="322" y="330" text-anchor="middle">通過</text>
  <path class="ln" d="M410.0,571.0 L455.0,571.0" marker-end="url(#a)"/>
  <text class="s" x="432" y="564" text-anchor="middle">是</text>
  <path class="ln" d="M300.0,609.0 L300.0,637.0" marker-end="url(#a)"/>
  <text class="s" x="314" y="626" text-anchor="middle">否</text>
  <path class="ln" d="M420.0,675.0 L455.0,675.0" marker-end="url(#a)"/>
  <text class="s" x="437" y="666" text-anchor="middle">升級</text>
  <path class="ln" d="M180.0,675.0 L36.0,675.0 L36.0,190.0 L190.0,190.0" marker-end="url(#a)"/>
  <text class="s" x="80" y="668" text-anchor="middle">重試</text>
  <path class="ln" d="M540.0,702.0 L540.0,728.0 L36.0,728.0 L36.0,675.0"/>
  <text class="s" x="320" y="746" text-anchor="middle">升級後回到 Plan，與重試共用左側迴圈</text>
</svg>
