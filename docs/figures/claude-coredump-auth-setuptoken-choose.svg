<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 650" role="img" aria-labelledby="t d">
  <title id="t">該不該用 setup-token：三個問題</title>
  <desc id="d">三個問題。一，需要在沒有瀏覽器的環境，也就是 CI 或腳本，使用訂閱嗎？不需要就互動用 login，或改用 API key。二，是你自己一個人的 CI 或腳本嗎？不是，也就是多人共用或團隊服務，屬灰色地帶，建議用 Console API key，並先問 Sales。三，需要 Remote Control、claude.ai connectors、Chrome 整合或 bare 嗎？需要就不能用 setup-token，改用 login 或 API key，bare 必須用 API key。都不需要，才可用 setup-token，並放進 secrets 管理、一年到期要輪替、確認環境沒有 ANTHROPIC_API_KEY。這是依官方頁面整理的建議。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="648.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">該不該用 setup-token？</text>
  <polygon class="acc" points="200,68.0 350.0,112 200,156.0 50.0,112"/>
  <text class="b" x="200" y="108" text-anchor="middle">需要在沒有瀏覽器的環境</text>
  <text x="200" y="124" text-anchor="middle">（CI、腳本）用訂閱？</text>
  <rect class="good" x="410.0" y="80.0" width="220" height="64" rx="8"/>
  <text class="b" x="520" y="108" text-anchor="middle">互動用 /login</text>
  <text x="520" y="124" text-anchor="middle">或改用 API key</text>
  <path class="ln" d="M350.0,112.0 L410.0,112.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="102" text-anchor="middle">否</text>
  <path class="ln" d="M200.0,156.0 L200.0,196.0" marker-end="url(#a)"/>
  <text class="s" x="212" y="182" text-anchor="middle">是</text>
  <polygon class="acc" points="200,196.0 350.0,240 200,284.0 50.0,240"/>
  <text class="b" x="200" y="236" text-anchor="middle">是你自己一個人的</text>
  <text x="200" y="252" text-anchor="middle">CI 或腳本嗎？</text>
  <rect class="bad" x="410.0" y="196.0" width="220" height="88" rx="8"/>
  <text class="b" x="520" y="220" text-anchor="middle">多人共用或團隊服務</text>
  <text x="520" y="236" text-anchor="middle">屬灰色地帶</text>
  <text x="520" y="252" text-anchor="middle">建議 Console API key</text>
  <text x="520" y="268" text-anchor="middle">先問 Sales</text>
  <path class="ln" d="M350.0,240.0 L410.0,240.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="230" text-anchor="middle">否</text>
  <path class="ln" d="M200.0,284.0 L200.0,324.0" marker-end="url(#a)"/>
  <text class="s" x="212" y="310" text-anchor="middle">是</text>
  <polygon class="acc" points="200,320.0 350.0,370 200,420.0 50.0,370"/>
  <text class="b" x="200" y="358" text-anchor="middle">需要 Remote Control、</text>
  <text x="200" y="374" text-anchor="middle">claude.ai connectors、</text>
  <text x="200" y="390" text-anchor="middle">Chrome 整合或 --bare？</text>
  <rect class="bad" x="410.0" y="326.0" width="220" height="88" rx="8"/>
  <text class="b" x="520" y="358" text-anchor="middle">不能用 setup-token</text>
  <text x="520" y="374" text-anchor="middle">改用 /login 或 API key</text>
  <text x="520" y="390" text-anchor="middle">（--bare 必須用 API key）</text>
  <path class="ln" d="M350.0,370.0 L410.0,370.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="360" text-anchor="middle">是</text>
  <path class="ln" d="M200.0,420.0 L200.0,466.0" marker-end="url(#a)"/>
  <text class="s" x="212" y="448" text-anchor="middle">否</text>
  <rect class="good" x="30.0" y="476.0" width="340" height="88" rx="8"/>
  <text class="b" x="200" y="500" text-anchor="middle">可用 setup-token</text>
  <text x="200" y="516" text-anchor="middle">放進 secrets 管理；一年到期要輪替</text>
  <text x="200" y="532" text-anchor="middle">確認環境沒有 ANTHROPIC_API_KEY</text>
  <text x="200" y="548" text-anchor="middle">用 /status 確認實際身分</text>
  <text class="s" x="320" y="600" text-anchor="middle">頁面沒說：usage limit 怎麼算、撤銷、能否共用、搭配 claude -p 與 Agent SDK</text>
  <text class="s" x="320" y="622" text-anchor="middle">依官方頁面整理的建議；條款會變，上線前重讀</text>
</svg>
