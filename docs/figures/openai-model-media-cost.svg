<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="t d">
  <title id="t">圖像與影片生成的成本比較</title>
  <desc id="d">上半部是 1024x1024 圖像每張成本，Low、Medium、High 三檔：gpt-image-2 為 0.006、0.053、0.211；gpt-image-1.5 為 0.009、0.034、0.133；gpt-image-1 為 0.011、0.042、0.167；gpt-image-1-mini 為 0.005、0.011、0.036。gpt-image-2 最高邊長可到 3840px 但不支援透明背景。下半部是影片每秒價格：sora-2 720p 約 0.10；sora-2-pro 720p 0.30、1024p 0.50、1080p 0.70。Batch 約為標準價一半。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="558.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">圖像（1024×1024 每張）與影片（每秒）成本</text>
  <text class="b" x="20" y="56">圖像：Low／Medium／High 三檔</text>
  <rect class="good" x="12" y="66" width="616" height="56" rx="8"/>
  <text class="monob" x="20" y="90">gpt-image-2</text>
  <text class="s" x="20" y="108">現行主力</text>
  <text class="s" x="172" y="83">Low</text>
  <rect class="bout" x="206" y="74" width="9.0" height="10" rx="2" fill-opacity="0.45"/>
  <text class="s" x="221.0" y="83">$0.006</text>
  <text class="s" x="172" y="98">Med</text>
  <rect class="bout" x="206" y="89" width="79.5" height="10" rx="2" fill-opacity="0.72"/>
  <text class="s" x="291.5" y="98">$0.053</text>
  <text class="s" x="172" y="113">High</text>
  <rect class="bout" x="206" y="104" width="316.5" height="10" rx="2" fill-opacity="0.99"/>
  <text class="s" x="528.5" y="113">$0.211</text>
  <rect class="box" x="12" y="128" width="616" height="56" rx="8"/>
  <text class="monob" x="20" y="152">gpt-image-1.5</text>
  <text class="s" x="20" y="170">較舊仍列價</text>
  <text class="s" x="172" y="145">Low</text>
  <rect class="bout" x="206" y="136" width="13.5" height="10" rx="2" fill-opacity="0.45"/>
  <text class="s" x="225.5" y="145">$0.009</text>
  <text class="s" x="172" y="160">Med</text>
  <rect class="bout" x="206" y="151" width="51.0" height="10" rx="2" fill-opacity="0.72"/>
  <text class="s" x="263.0" y="160">$0.034</text>
  <text class="s" x="172" y="175">High</text>
  <rect class="bout" x="206" y="166" width="199.5" height="10" rx="2" fill-opacity="0.99"/>
  <text class="s" x="411.5" y="175">$0.133</text>
  <rect class="box" x="12" y="190" width="616" height="56" rx="8"/>
  <text class="monob" x="20" y="214">gpt-image-1</text>
  <text class="s" x="20" y="232">舊代</text>
  <text class="s" x="172" y="207">Low</text>
  <rect class="bout" x="206" y="198" width="16.5" height="10" rx="2" fill-opacity="0.45"/>
  <text class="s" x="228.5" y="207">$0.011</text>
  <text class="s" x="172" y="222">Med</text>
  <rect class="bout" x="206" y="213" width="63.0" height="10" rx="2" fill-opacity="0.72"/>
  <text class="s" x="275.0" y="222">$0.042</text>
  <text class="s" x="172" y="237">High</text>
  <rect class="bout" x="206" y="228" width="250.5" height="10" rx="2" fill-opacity="0.99"/>
  <text class="s" x="462.5" y="237">$0.167</text>
  <rect class="box" x="12" y="252" width="616" height="56" rx="8"/>
  <text class="monob" x="20" y="276">gpt-image-1-mini</text>
  <text class="s" x="20" y="294">便宜版</text>
  <text class="s" x="172" y="269">Low</text>
  <rect class="bout" x="206" y="260" width="7.5" height="10" rx="2" fill-opacity="0.45"/>
  <text class="s" x="219.5" y="269">$0.005</text>
  <text class="s" x="172" y="284">Med</text>
  <rect class="bout" x="206" y="275" width="16.5" height="10" rx="2" fill-opacity="0.72"/>
  <text class="s" x="228.5" y="284">$0.011</text>
  <text class="s" x="172" y="299">High</text>
  <rect class="bout" x="206" y="290" width="54.0" height="10" rx="2" fill-opacity="0.99"/>
  <text class="s" x="266.0" y="299">$0.036</text>
  <text class="s" x="320" y="322" text-anchor="middle">gpt-image-2：最高邊長 3840px、不支援透明背景；帶 reference image 編修時圖片輸入 token 成本可能上升</text>
  <text class="b" x="20" y="352">影片：每秒價格</text>
  <rect class="box" x="12" y="362" width="616" height="30" rx="8"/>
  <text class="monob" x="20" y="382">sora-2</text>
  <text class="s" x="130" y="382">720p</text>
  <rect class="bout" x="190" y="371" width="42.9" height="12" rx="2"/>
  <text class="s" x="238.85714285714286" y="382">$0.10</text>
  <rect class="box" x="12" y="396" width="616" height="30" rx="8"/>
  <text class="monob" x="20" y="416">sora-2-pro</text>
  <text class="s" x="130" y="416">720p</text>
  <rect class="bout" x="190" y="405" width="128.6" height="12" rx="2"/>
  <text class="s" x="324.57142857142856" y="416">$0.30</text>
  <rect class="box" x="12" y="430" width="616" height="30" rx="8"/>
  <text class="monob" x="20" y="450">sora-2-pro</text>
  <text class="s" x="130" y="450">1024p</text>
  <rect class="bout" x="190" y="439" width="214.3" height="12" rx="2"/>
  <text class="s" x="410.28571428571433" y="450">$0.50</text>
  <rect class="box" x="12" y="464" width="616" height="30" rx="8"/>
  <text class="monob" x="20" y="484">sora-2-pro</text>
  <text class="s" x="130" y="484">1080p</text>
  <rect class="bout" x="190" y="473" width="300.0" height="12" rx="2"/>
  <text class="s" x="496.0" y="484">$0.70</text>
  <text class="s" x="320" y="516" text-anchor="middle">sora-2：速度與靈活性優先；sora-2-pro：品質優先，1080p 輸出更適合</text>
  <text class="s" x="320" y="536" text-anchor="middle">Batch 價格約為標準價的一半</text>
</svg>
