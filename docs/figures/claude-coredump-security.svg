<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="t d">
  <title id="t">安全邊界與資料流：不信任的 dump 留在隔離環境，只有裁切後的證據送給模型</title>
  <desc id="d">左邊是隔離環境，不信任：coredump、binary 與 symbols 以唯讀掛載，gdb 或 lldb batch 工具無網路、有 timeout，並限制 CPU、記憶體與磁碟。中間由 Python orchestrator 裁切並正規化成 case_facts 與 evidence ID。右邊是 Claude Messages API，只看到裁切後的證據。下方兩個提醒：不給模型完整 dump、任意 shell 與寫入權限；建立 Issue、修改程式、push、重新部署要人工核准。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="498.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">資料流與安全邊界</text>
  <rect class="zone" x="12" y="44" width="200" height="300" rx="10"/>
  <text class="b" x="112" y="66" text-anchor="middle">隔離環境（不信任）</text>
  <rect class="box" x="22.0" y="96.0" width="180" height="56" rx="8"/>
  <text class="b" x="112" y="120" text-anchor="middle">coredump／binary</text>
  <text x="112" y="136" text-anchor="middle">symbols（唯讀掛載）</text>
  <rect class="box" x="22.0" y="186.0" width="180" height="56" rx="8"/>
  <text class="b" x="112" y="210" text-anchor="middle">gdb／lldb batch 工具</text>
  <text x="112" y="226" text-anchor="middle">無網路、有 timeout</text>
  <rect class="box" x="22.0" y="276.0" width="180" height="40" rx="8"/>
  <text x="112" y="300" text-anchor="middle">限制 CPU、記憶體、磁碟</text>
  <path class="ln" d="M112.0,152.0 L112.0,186.0" marker-end="url(#a)"/>
  <rect class="good" x="255.0" y="142.0" width="130" height="96" rx="8"/>
  <text class="b" x="320" y="170" text-anchor="middle">orchestrator</text>
  <text x="320" y="186" text-anchor="middle">裁切＋正規化</text>
  <text x="320" y="202" text-anchor="middle">case_facts</text>
  <text x="320" y="218" text-anchor="middle">evidence ID</text>
  <path class="ln" d="M212.0,214.0 L255.0,214.0" marker-end="url(#a)"/>
  <rect class="zone" x="428" y="44" width="200" height="300" rx="10"/>
  <text class="b" x="528" y="66" text-anchor="middle">外部 API</text>
  <rect class="acc" x="440.0" y="142.0" width="176" height="96" rx="8"/>
  <text class="b" x="528" y="178" text-anchor="middle">Claude Messages API</text>
  <text x="528" y="194" text-anchor="middle">只看到裁切後的證據</text>
  <text x="528" y="210" text-anchor="middle">不是整份 dump</text>
  <path class="ln" d="M385.0,190.0 L440.0,190.0" marker-end="url(#a)"/>
  <path class="ln" d="M440,226 L385,226" marker-end="url(#a)"/>
  <text class="s" x="412" y="244" text-anchor="middle">工具請求</text>
  <rect class="bad" x="12.0" y="363.0" width="300" height="70" rx="8"/>
  <text class="b" x="162" y="394" text-anchor="middle">不給模型</text>
  <text x="162" y="410" text-anchor="middle">完整 dump、任意 shell、寫入權限</text>
  <rect class="bad" x="328.0" y="363.0" width="300" height="70" rx="8"/>
  <text class="b" x="478" y="394" text-anchor="middle">需人工核准</text>
  <text x="478" y="410" text-anchor="middle">建立 Issue、修改程式、push、重新部署</text>
  <text class="s" x="320" y="488" text-anchor="middle">原則取自本庫 OpenAI-Python-Agent；資料外送政策請依你們公司規定</text>
</svg>
