<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d">
  <title id="t">Subagents 審查流程：明確要求才 spawn，唯讀並行，回報後由主 Codex 彙整</title>
  <desc id="d">你在 prompt 明確要求 Codex spawn 三個 subagent 分別審不同目錄，每個只讀不改檔。如果不明講，Codex 就單 agent 做完。主 Codex 啟動多個 agent thread，同時最多 max_threads 個，預設 6，max_depth 預設 1。各 subagent 回報 findings，主 Codex 收攏、去重、排序成一份整體結論。可用 /agent 切換 thread，並要求 steer、stop、close。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="478.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">Subagents：明確要求才會展開</text>
  <rect class="bad" x="120" y="44" width="400" height="58" rx="10"/>
  <text class="b" x="320" y="68" text-anchor="middle">你：「請 spawn 三個 subagent，分別審…，只讀不改」</text>
  <text class="s" x="320" y="90" text-anchor="middle">不明講，Codex 就單 agent 做完 🔎</text>
  <line class="ln" x1="320" y1="103" x2="320" y2="124" marker-end="url(#a)"/>
  <rect class="acc" x="190" y="126" width="260" height="52" rx="10"/>
  <text class="b" x="320" y="150" text-anchor="middle">主 Codex 啟動多個 agent thread</text>
  <text class="s" x="320" y="168" text-anchor="middle">max_threads 預設 6；max_depth 預設 1</text>
  <line class="ln" x1="320" y1="179" x2="114" y2="208" marker-end="url(#a)"/>
  <rect class="good" x="24" y="210" width="180" height="80" rx="10"/>
  <text class="b" x="114" y="236" text-anchor="middle">subagent A</text>
  <text class="mono" x="114" y="258" text-anchor="middle">src/fib/</text>
  <text class="s" x="114" y="278" text-anchor="middle">唯讀（read-only）</text>
  <line class="ln" x1="114" y1="291" x2="320" y2="322" marker-end="url(#a)"/>
  <line class="ln" x1="320" y1="179" x2="318" y2="208" marker-end="url(#a)"/>
  <rect class="good" x="228" y="210" width="180" height="80" rx="10"/>
  <text class="b" x="318" y="236" text-anchor="middle">subagent B</text>
  <text class="mono" x="318" y="258" text-anchor="middle">src/neighbour/</text>
  <text class="s" x="318" y="278" text-anchor="middle">唯讀（read-only）</text>
  <line class="ln" x1="318" y1="291" x2="320" y2="322" marker-end="url(#a)"/>
  <line class="ln" x1="320" y1="179" x2="522" y2="208" marker-end="url(#a)"/>
  <rect class="good" x="432" y="210" width="180" height="80" rx="10"/>
  <text class="b" x="522" y="236" text-anchor="middle">subagent C</text>
  <text class="mono" x="522" y="258" text-anchor="middle">src/route/</text>
  <text class="s" x="522" y="278" text-anchor="middle">唯讀（read-only）</text>
  <line class="ln" x1="522" y1="291" x2="320" y2="322" marker-end="url(#a)"/>
  <rect class="acc" x="190" y="324" width="260" height="52" rx="10"/>
  <text class="b" x="320" y="348" text-anchor="middle">主 Codex 彙整</text>
  <text class="s" x="320" y="366" text-anchor="middle">收攏、去重、排序</text>
  <rect class="dash" x="12" y="392" width="616" height="76" rx="8"/>
  <text x="24" y="414">管理：/agent 切換 thread；可要求 steer（改方向）、stop、close</text>
  <text class="s" x="24" y="436">subagent 關掉主 session 就看不到；要長期追蹤改走 Cloud 或自己的 codex exec</text>
  <text class="s" x="24" y="456">啟用是實驗性功能：/experimental；旗標名稱各來源不一致 ⚠️</text>
</svg>
