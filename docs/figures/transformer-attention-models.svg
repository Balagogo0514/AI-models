<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="t d">
  <title id="t">公開架構的 attention 路線：開放權重模型與閉源模型的可確認程度</title>
  <desc id="d">已公開架構：DeepSeek-V2、V3、R1 使用 MLA，exact softmax，全域檢索是；Qwen3 使用 GQA；Qwen3-Next 使用 Gated DeltaNet 加全域 gated attention 約 3 比 1，混合式；GLM-4.5 使用 Partial-RoPE GQA 加 QK-Norm；Kimi Linear 與 K3 使用 KDA 加 gated MLA 與 AttnRes，混合式；OpenAI gpt-oss 使用 GQA、local banded sparse 與 dense 交替，加 RoPE 與 YaRN；Gemini 1.0 技術報告明示 MQA。Claude 與 GPT 現行旗艦的 attention 架構未公開；未公開不代表沒有，也不代表採用某項技術。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="558.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">各家公開的 attention 路線</text>
  <rect class="hd" x="12" y="44" width="616" height="26" rx="6"/>
  <text class="b" x="20" y="62">模型</text>
  <text class="b" x="158" y="62">Attention 核心</text>
  <text class="b" x="410" y="62">exact softmax</text>
  <text class="b" x="528" y="62">全域檢索</text>
  <rect class="good" x="12" y="78" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="99.5">DeepSeek</text>
  <text class="b" x="20" y="114.5">V2／V3／R1</text>
  <text x="158" y="104.0">MLA：K/V 壓成低維 latent</text>
  <text x="410" y="107">是</text>
  <text x="528" y="107">是</text>
  <rect class="good" x="12" y="134" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="163.0">Qwen3</text>
  <text x="158" y="160.0">GQA：多個 Q heads 共用較少 K/V</text>
  <text x="410" y="163">是</text>
  <text x="528" y="163">是</text>
  <rect class="acc" x="12" y="190" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="219.0">Qwen3-Next</text>
  <text x="158" y="208.5">Gated DeltaNet ＋ 全域 gated</text>
  <text x="158" y="223.5">attention（約 3:1）</text>
  <text x="410" y="219">部分</text>
  <text x="528" y="219">混合</text>
  <rect class="good" x="12" y="246" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="275.0">GLM-4.5</text>
  <text x="158" y="272.0">Partial-RoPE GQA ＋ QK-Norm</text>
  <text x="410" y="275">是</text>
  <text x="528" y="275">是</text>
  <rect class="acc" x="12" y="302" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="331.0">Kimi Linear／K3</text>
  <text x="158" y="328.0">KDA ＋ gated MLA（約 3:1）＋ AttnRes</text>
  <text x="410" y="331">部分</text>
  <text x="528" y="331">混合</text>
  <rect class="box" x="12" y="358" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="387.0">OpenAI gpt-oss</text>
  <text x="158" y="376.5">GQA ＋ 局部 banded sparse／dense 交替</text>
  <text x="158" y="391.5">＋ RoPE／YaRN</text>
  <text x="410" y="387">文件未列</text>
  <text x="528" y="387">dense 層有</text>
  <rect class="box" x="12" y="414" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="443.0">Gemini 1.0</text>
  <text x="158" y="440.0">MQA（技術報告明示）；後續旗艦細節有限</text>
  <text x="410" y="443">是（1.0）</text>
  <text x="528" y="443">是（1.0）</text>
  <rect class="bad" x="12" y="470" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="491.5">Claude、GPT</text>
  <text class="b" x="20" y="506.5">現行旗艦</text>
  <text x="158" y="496.0">attention 架構未公開</text>
  <text x="410" y="499">未公開</text>
  <text x="528" y="499">未公開</text>
  <text class="s" x="320" y="540" text-anchor="middle">⚠️ 未公開不代表沒有某項技術，也不代表採用了某項技術；不要憑傳聞宣稱</text>
</svg>
