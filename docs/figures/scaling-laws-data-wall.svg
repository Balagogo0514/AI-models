<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="t d">
  <title id="t">資料見頂（Data Wall）：五種因應策略與各自的風險</title>
  <desc id="d">高品質公開文字資料見頂，有效存量約 300 兆 token，估計在 2026 到 2032 年間用盡（Epoch AI，2024）。五種因應策略與風險：多輪 epoch，超過約 4 epoch 後報酬急遽遞減；合成資料，可能導致 model collapse；多模態資料，資料類型間的 transfer 效果仍在研究；提升資料品質，品質評估缺乏統一標準；轉向推論期 scaling，需要額外的 RL 與 verifier 訓練成本。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="498.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">Data Wall：策略與風險</text>
  <rect class="bad" x="120" y="40" width="400" height="42" rx="10"/>
  <text class="b" x="320" y="60" text-anchor="middle">高品質公開文字資料見頂</text>
  <text class="s" x="320" y="76" text-anchor="middle">有效存量約 300 兆 token；估計 2026–2032 年間用盡（Epoch AI，2024）</text>
  <line class="ln" x1="320" y1="83" x2="320" y2="96"/>
  <line class="ln" x1="110" y1="96" x2="530" y2="96"/>
  <text class="b" x="20" y="112">策略</text>
  <text class="b" x="236" y="112">風險</text>
  <text class="b" x="470" y="112">對應案例</text>
  <rect class="acc" x="12" y="120" width="204" height="62" rx="8"/>
  <text class="b" x="24" y="146">多輪 epoch</text>
  <text class="s" x="24" y="166">同一資料重複訓練</text>
  <line class="ln" x1="216" y1="151" x2="226" y2="151" marker-end="url(#a)"/>
  <rect class="bad" x="228" y="120" width="226" height="62" rx="8"/>
  <text x="240" y="156">超過約 4 epoch 後報酬急遽遞減</text>
  <rect class="box" x="462" y="120" width="166" height="62" rx="8"/>
  <text class="s" x="472" y="156">Muennighoff 2023</text>
  <rect class="acc" x="12" y="190" width="204" height="62" rx="8"/>
  <text class="b" x="24" y="216">合成資料</text>
  <text class="s" x="24" y="236">強模型生成訓練資料</text>
  <line class="ln" x1="216" y1="221" x2="226" y2="221" marker-end="url(#a)"/>
  <rect class="bad" x="228" y="190" width="226" height="62" rx="8"/>
  <text x="240" y="226">可能 model collapse（分布坍縮）</text>
  <rect class="box" x="462" y="190" width="166" height="62" rx="8"/>
  <text class="s" x="472" y="226">Phi 系列；Shumailov 2024</text>
  <rect class="acc" x="12" y="260" width="204" height="62" rx="8"/>
  <text class="b" x="24" y="286">多模態資料</text>
  <text class="s" x="24" y="306">納入圖片、影片、程式碼、音訊</text>
  <line class="ln" x1="216" y1="291" x2="226" y2="291" marker-end="url(#a)"/>
  <rect class="bad" x="228" y="260" width="226" height="62" rx="8"/>
  <text x="240" y="296">跨資料類型的 transfer 仍在研究</text>
  <rect class="box" x="462" y="260" width="166" height="62" rx="8"/>
  <text class="s" x="472" y="296">影片語音轉文字（媒體報導）</text>
  <rect class="acc" x="12" y="330" width="204" height="62" rx="8"/>
  <text class="b" x="24" y="356">提升資料品質</text>
  <text class="s" x="24" y="376">精煉、過濾而非加量</text>
  <line class="ln" x1="216" y1="361" x2="226" y2="361" marker-end="url(#a)"/>
  <rect class="bad" x="228" y="330" width="226" height="62" rx="8"/>
  <text x="240" y="366">品質評估缺乏統一標準</text>
  <rect class="box" x="462" y="330" width="166" height="62" rx="8"/>
  <text class="s" x="472" y="366">FineWeb／FineWeb-Edu</text>
  <rect class="acc" x="12" y="400" width="204" height="62" rx="8"/>
  <text class="b" x="24" y="426">轉向推論期 scaling</text>
  <text class="s" x="24" y="446">訓練完後多花推論運算</text>
  <line class="ln" x1="216" y1="431" x2="226" y2="431" marker-end="url(#a)"/>
  <rect class="bad" x="228" y="400" width="226" height="62" rx="8"/>
  <text x="240" y="436">需額外的 RL／verifier 訓練成本</text>
  <rect class="box" x="462" y="400" width="166" height="62" rx="8"/>
  <text class="s" x="472" y="436">見推論期 scaling 一節</text>
  <text class="s" x="320" y="486" text-anchor="middle">存量為品質與重複訓練調整後的估計，90% 信賴區間約 100–1000 兆（Epoch AI，2024）</text>
</svg>
