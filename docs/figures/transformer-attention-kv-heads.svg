  <rect class="box" x="12" y="392" width="616" height="108" rx="10"/>
  <text class="b" x="24" y="420">MLA</text>
  <text class="s" x="24" y="442">壓縮 latent KV cache</text>
  <text class="s" x="24" y="460">以投影換更高壓縮率</text>
  <rect class="acc" x="198" y="404" width="40" height="18" rx="4"/>
