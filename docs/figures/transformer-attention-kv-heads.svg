  <rect class="good" x="259.0" y="234" width="80" height="20" rx="4"/>
  <text class="s" x="299.0" y="248" text-anchor="middle">KV 組 1</text>
  <line class="ln" x1="218" y1="191" x2="299.0" y2="233"/>
  <line class="ln" x1="272" y1="191" x2="299.0" y2="233"/>
