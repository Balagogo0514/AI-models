  <line class="ln" x1="596" y1="75" x2="596" y2="117"/>
  <rect class="box" x="12" y="160" width="616" height="108" rx="10"/>
  <text class="b" x="24" y="188">GQA</text>
  <text class="s" x="24" y="210">g 個 K/V heads（g &lt; h）</text>
  <text class="s" x="24" y="228">常見折衷；成熟低風險預設</text>
  <rect class="acc" x="198" y="172" width="40" height="18" rx="4"/>
