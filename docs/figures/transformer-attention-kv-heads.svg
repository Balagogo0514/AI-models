  <line class="ln" x1="326" y1="75" x2="326" y2="117"/>
  <rect class="good" x="360" y="118" width="40" height="20" rx="4"/>
  <text class="s" x="380" y="132" text-anchor="middle">KV</text>
  <line class="ln" x1="380" y1="75" x2="380" y2="117"/>
  <rect class="good" x="414" y="118" width="40" height="20" rx="4"/>
  <text class="s" x="434" y="132" text-anchor="middle">KV</text>
