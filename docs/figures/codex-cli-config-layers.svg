<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d">
  <title id="t">Codex 設定的疊加：基礎 config.toml、profile 疊加、CLI -c 覆寫，以及其他來源</title>
  <desc id="d">基礎是使用者層的 config.toml，位置受 CODEX_HOME 影響。profile 用 --profile 名稱把 CODEX_HOME 下的 名稱.config.toml 疊加在基礎設定之上。最上層是 CLI 的 -c key=value，用 dotted path 動態覆寫，值先以 TOML 解析。另有專案內規則與 AGENTS.md，以及環境變數，是設定面的其他來源。完整欄位與優先序以官方 config-reference 為準。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="438.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">設定怎麼疊加</text>
  <rect class="bad" x="12" y="44" width="380" height="90" rx="10"/>
  <text class="b wt" x="24" y="68">③ CLI 動態覆寫：-c key=value</text>
  <text x="24" y="90">dotted path 覆寫巢狀欄位</text>
  <text class="s" x="24" y="112">值先以 TOML 解析，失敗則當作字串</text>
  <line class="ln" x1="202" y1="135" x2="202" y2="150" marker-end="url(#a)"/>
  <rect class="acc" x="12" y="152" width="380" height="90" rx="10"/>
  <text class="b at" x="24" y="176">② profile：--profile work</text>
  <text class="mono" x="24" y="198">$CODEX_HOME/work.config.toml</text>
  <text class="s" x="24" y="220">疊加在基礎設定之上</text>
  <line class="ln" x1="202" y1="243" x2="202" y2="258" marker-end="url(#a)"/>
  <rect class="good" x="12" y="260" width="380" height="90" rx="10"/>
  <text class="b gt" x="24" y="284">① 基礎：使用者層 config.toml</text>
  <text class="mono" x="24" y="306">model、sandbox_mode、approval_policy、[features] …</text>
  <text class="s" x="24" y="328">CODEX_HOME 影響 config 與 profile 的查找位置</text>
  <rect class="dash" x="408" y="44" width="220" height="306" rx="10"/>
  <text class="b m" x="420" y="68">設定面的其他來源</text>
  <text x="420" y="96">・專案內規則與 AGENTS.md</text>
  <text x="420" y="120">・環境變數</text>
  <text class="s" x="420" y="150">常用：CODEX_HOME、</text>
  <text class="s" x="420" y="168">CODEX_API_KEY（僅 exec）、</text>
  <text class="s" x="420" y="186">CODEX_ACCESS_TOKEN</text>
  <text class="b" x="420" y="220">未知欄位：</text>
  <text class="s" x="420" y="240">--strict-config 會報錯</text>
  <rect class="box" x="12" y="366" width="616" height="62" rx="8"/>
  <text x="24" y="390">完整欄位與優先序請以你版本的 config-reference 與 codex --help 為準</text>
  <text class="s" x="24" y="412">圖只畫文件寫明的疊加關係，不推斷其他來源之間的優先序</text>
</svg>
