<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d">
  <title id="t">三個 skill 誰會自動執行：hook、依描述挑、手動才動</title>
  <desc id="d">superpowers：hook 會（SessionStart）、依描述挑會（被 using-superpowers 強制）、手動為可選。planning-with-files：hook 視安裝方式（以 plugin 安裝才有）、依描述挑視情況、手動指令 /plan。grill-me：hook 不會、依描述挑不會（但它轉呼叫的 grilling 視情況）、手動 /grill-me。hook 是合併的，superpowers 與 planning-with-files 的 hook 會同時在背景執行。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="438.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">誰會自動執行？</text>
  <rect class="hd" x="12" y="44" width="616" height="36" rx="6"/>
  <text class="b" x="20" y="67">skill</text>
  <text class="b" x="272" y="67" text-anchor="middle">Hook 背景執行</text>
  <text class="b" x="412" y="67" text-anchor="middle">Claude 依描述挑</text>
  <text class="b" x="552" y="67" text-anchor="middle">只有你手動叫</text>
  <rect class="acc" x="12" y="88" width="616" height="84" rx="8"/>
  <text class="b" x="22" y="136">superpowers</text>
  <circle class="dotf" cx="272" cy="118" r="9"/>
  <text class="s" x="272" y="150" text-anchor="middle">SessionStart</text>
  <circle class="dotf" cx="412" cy="118" r="9"/>
  <text class="s" x="412" y="150" text-anchor="middle">被 1% 規則推著</text>
  <circle class="dote" cx="552" cy="118" r="9"/>
  <circle class="dotf" cx="552" cy="118" r="3.5"/>
  <text class="s" x="552" y="150" text-anchor="middle">可選</text>
  <rect class="good" x="12" y="180" width="616" height="84" rx="8"/>
  <text class="b" x="22" y="228">planning-with-files</text>
  <circle class="dote" cx="272" cy="210" r="9"/>
  <circle class="dotf" cx="272" cy="210" r="3.5"/>
  <text class="s" x="272" y="242" text-anchor="middle">plugin 才有 6 種 hook</text>
  <circle class="dote" cx="412" cy="210" r="9"/>
  <circle class="dotf" cx="412" cy="210" r="3.5"/>
  <text class="s" x="412" y="242" text-anchor="middle">描述符合才會</text>
  <circle class="dotf" cx="552" cy="210" r="9"/>
  <text class="s" x="552" y="242" text-anchor="middle">/plan 等指令</text>
  <rect class="bad" x="12" y="272" width="616" height="84" rx="8"/>
  <text class="b" x="22" y="320">grill-me</text>
  <circle class="dote" cx="272" cy="302" r="9"/>
  <text class="s" x="272" y="334" text-anchor="middle">未見 ⚠️</text>
  <circle class="dote" cx="412" cy="302" r="9"/>
  <circle class="dotf" cx="412" cy="302" r="3.5"/>
  <text class="s" x="412" y="334" text-anchor="middle">僅 grilling 可被挑</text>
  <circle class="dotf" cx="552" cy="302" r="9"/>
  <text class="s" x="552" y="334" text-anchor="middle">/grill-me</text>
  <rect class="dash" x="12" y="372" width="616" height="58" rx="8"/>
  <circle class="dotf" cx="34" cy="390" r="7"/>
  <text x="46" y="395">會</text>
  <circle class="dote" cx="90" cy="390" r="7"/>
  <circle class="dotf" cx="90" cy="390" r="3.5"/>
  <text x="102" y="395">視情況</text>
  <circle class="dote" cx="170" cy="390" r="7"/>
  <text x="182" y="395">不會</text>
  <text x="226" y="395">hook 是合併的：兩個 plugin 的 hook 會同時跑</text>
  <text class="s" x="24" y="414">你打 /grill-me 時，另外兩個仍在背景（⚠️ 未實測）</text>
</svg>
