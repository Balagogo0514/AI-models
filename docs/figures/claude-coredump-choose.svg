<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img" aria-labelledby="t d">
  <title id="t">選型決策：依需求決定用哪個工具</title>
  <desc id="d">五個問題依序判斷。一，每案要硬性成本上限、去重、佇列與稽核嗎？是就用 Messages API 加 Python orchestrator 當正式核心。二，只是工程師人工調查或開發 parser 與工具嗎？是就用 Claude Code 互動模式。三，是 CI 一次性、少量分析嗎？是就用 claude -p 加限制旗標。四，已有多個職責明確的子流程，且不需要逐步硬性控制嗎？是就用 Agent SDK。五，只需要觸發、通知、核准嗎？是就用 n8n，可與前面的並用。以上都不是，就先重新確認需求。這是依本庫資料整理的建議。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="698.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">我該用哪個工具？</text>
  <polygon class="acc" points="200,66.0 350.0,108 200,150.0 50.0,108"/>
  <text class="b" x="200" y="104" text-anchor="middle">每案要硬性成本上限、</text>
  <text x="200" y="120" text-anchor="middle">去重、佇列、稽核？</text>
  <rect class="good" x="410.0" y="78.0" width="220" height="60" rx="8"/>
  <text class="b" x="520" y="104" text-anchor="middle">Messages API ＋ orchestrator</text>
  <text x="520" y="120" text-anchor="middle">正式核心</text>
  <path class="ln" d="M350.0,108.0 L410.0,108.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="98" text-anchor="middle">是</text>
  <path class="ln" d="M200.0,150.0 L200.0,178.0" marker-end="url(#a)"/>
  <text class="s" x="214" y="166" text-anchor="middle">否</text>
  <polygon class="acc" points="200,178.0 350.0,220 200,262.0 50.0,220"/>
  <text class="b" x="200" y="216" text-anchor="middle">只是工程師人工調查</text>
  <text x="200" y="232" text-anchor="middle">或開發 parser、工具？</text>
  <rect class="acc" x="410.0" y="190.0" width="220" height="60" rx="8"/>
  <text class="b" x="520" y="224" text-anchor="middle">Claude Code 互動模式</text>
  <path class="ln" d="M350.0,220.0 L410.0,220.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="210" text-anchor="middle">是</text>
  <path class="ln" d="M200.0,262.0 L200.0,290.0" marker-end="url(#a)"/>
  <text class="s" x="214" y="278" text-anchor="middle">否</text>
  <polygon class="acc" points="200,290.0 350.0,332 200,374.0 50.0,332"/>
  <text class="b" x="200" y="336" text-anchor="middle">CI 一次性、少量分析？</text>
  <rect class="acc" x="410.0" y="302.0" width="220" height="60" rx="8"/>
  <text class="b" x="520" y="336" text-anchor="middle">claude -p ＋ 限制旗標</text>
  <path class="ln" d="M350.0,332.0 L410.0,332.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="322" text-anchor="middle">是</text>
  <path class="ln" d="M200.0,374.0 L200.0,402.0" marker-end="url(#a)"/>
  <text class="s" x="214" y="390" text-anchor="middle">否</text>
  <polygon class="acc" points="200,402.0 350.0,444 200,486.0 50.0,444"/>
  <text class="b" x="200" y="440" text-anchor="middle">已有多個職責明確的子流程，</text>
  <text x="200" y="456" text-anchor="middle">且不需逐步硬性控制？</text>
  <rect class="acc" x="410.0" y="414.0" width="220" height="60" rx="8"/>
  <text class="b" x="520" y="448" text-anchor="middle">Claude Agent SDK</text>
  <path class="ln" d="M350.0,444.0 L410.0,444.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="434" text-anchor="middle">是</text>
  <path class="ln" d="M200.0,486.0 L200.0,514.0" marker-end="url(#a)"/>
  <text class="s" x="214" y="502" text-anchor="middle">否</text>
  <polygon class="acc" points="200,514.0 350.0,556 200,598.0 50.0,556"/>
  <text class="b" x="200" y="560" text-anchor="middle">只需觸發、通知、核准？</text>
  <rect class="acc" x="410.0" y="526.0" width="220" height="60" rx="8"/>
  <text class="b" x="520" y="560" text-anchor="middle">n8n（可與以上並用）</text>
  <path class="ln" d="M350.0,556.0 L410.0,556.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="546" text-anchor="middle">是</text>
  <path class="ln" d="M200.0,598.0 L200.0,626.0" marker-end="url(#a)"/>
  <text class="s" x="214" y="614" text-anchor="middle">否</text>
  <rect class="bad" x="50.0" y="626.0" width="300" height="44" rx="8"/>
  <text class="b" x="200" y="652" text-anchor="middle">以上都不是 → 先重新確認需求</text>
  <text class="s" x="320" y="690" text-anchor="middle">依本庫資料整理的建議；可多個並用，但不要讓兩個框架同時當同一案件的主迴圈</text>
</svg>
