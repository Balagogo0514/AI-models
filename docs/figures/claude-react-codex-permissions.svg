<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" role="img" aria-labelledby="t d">
  <title id="t">Codex 權限：sandbox 與 approval 兩個維度，以及常用組合</title>
  <desc id="d">sandbox 用 -s 設定，決定技術上能做什麼，有 read-only、workspace-write、danger-full-access 三種。approval 用 -a 設定，決定什麼時候問你：untrusted 只有 trusted commands 免批准，on-request 由模型決定何時請求，never 永不詢問、失敗直接回傳給模型。本庫整理的常用組合：一般本機開發用 workspace-write 加 on-request；嚴格安全模式用 read-only 加 untrusted；CI 非互動用 codex exec 加 a never 與 json；不要用 dangerously-bypass-approvals-and-sandbox，極危險。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="488.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">Codex 權限：兩個維度</text>
  <rect class="acc" x="12" y="44" width="300" height="148" rx="10"/>
  <text class="b" x="24" y="68">sandbox（-s）：能做什麼</text>
  <text class="mono" x="30" y="96">read-only</text>
  <text class="mono" x="30" y="120">workspace-write</text>
  <text class="mono" x="30" y="144">danger-full-access</text>
  <text class="s" x="24" y="176">名稱帶 danger，請謹慎使用</text>
  <rect class="acc" x="328" y="44" width="300" height="148" rx="10"/>
  <text class="b" x="340" y="68">approval（-a）：什麼時候問你</text>
  <text class="mono" x="346" y="96">untrusted</text>
  <text class="s" x="430" y="96">僅 trusted commands 免批准</text>
  <text class="mono" x="346" y="120">on-request</text>
  <text class="s" x="430" y="120">由模型決定何時請求批准</text>
  <text class="mono" x="346" y="144">never</text>
  <text class="s" x="430" y="144">永不詢問，失敗回傳給模型</text>
  <text class="t" x="320" y="216" text-anchor="middle">常用組合（本庫整理）</text>
  <rect class="good" x="12" y="230" width="616" height="50" rx="8"/>
  <text class="b" x="24" y="260">一般本機開發</text>
  <text class="mono" x="170" y="260">-s workspace-write -a on-request</text>
  <rect class="box" x="12" y="288" width="616" height="50" rx="8"/>
  <text class="b" x="24" y="318">嚴格安全模式</text>
  <text class="mono" x="170" y="318">-s read-only -a untrusted</text>
  <rect class="box" x="12" y="346" width="616" height="50" rx="8"/>
  <text class="b" x="24" y="376">CI 非互動</text>
  <text class="mono" x="170" y="376">codex exec -a never --json（搭配 --sandbox）</text>
  <rect class="bad" x="12" y="404" width="616" height="50" rx="8"/>
  <text class="b" x="24" y="434">不要這樣用</text>
  <text class="mono" x="170" y="434">--dangerously-bypass-approvals-and-sandbox</text>
  <text class="s" x="320" y="478" text-anchor="middle">sandbox 決定「技術上能不能」，approval 決定「要不要先問你」</text>
</svg>
