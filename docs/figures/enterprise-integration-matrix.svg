<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="t d">
  <title id="t">整合模型的六個層次，各自需要多少人力、資料、運算與承擔多少風險</title>
  <desc id="d">由輕到重六個層次：提示詞與工作流、RAG、工具與 MCP 整合、Agent 編排、微調、自建模型服務。以一到三個點表示相對需求：提示詞與工作流各項都低；RAG 的資料準備最重；工具整合風險偏高；Agent 編排人力與風險高；微調的人力與資料準備高；自建模型服務的人力、運算與維運風險都高。這是相對等級，不是精確數字。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="468.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">由輕到重：每一層需要的資源</text>
  <rect class="hd" x="12" y="44" width="616" height="30" rx="6"/>
  <text class="b" x="20" y="64">層次（由輕到重）</text>
  <text class="b" x="322" y="64" text-anchor="middle">人力</text>
  <text class="b" x="400" y="64" text-anchor="middle">資料準備</text>
  <text class="b" x="484" y="64" text-anchor="middle">運算與成本</text>
  <text class="b" x="580" y="64" text-anchor="middle">風險</text>
  <rect class="box" x="12" y="80" width="616" height="50" rx="6"/>
  <text class="b" x="20" y="102">1  提示詞與工作流</text>
  <text class="s" x="20" y="120">解決：格式、流程固定</text>
  <circle class="dotf" cx="302" cy="106" r="6"/>
  <circle class="dote" cx="322" cy="106" r="6"/>
  <circle class="dote" cx="342" cy="106" r="6"/>
  <circle class="dotf" cx="380" cy="106" r="6"/>
  <circle class="dote" cx="400" cy="106" r="6"/>
  <circle class="dote" cx="420" cy="106" r="6"/>
  <circle class="dotf" cx="464" cy="106" r="6"/>
  <circle class="dote" cx="484" cy="106" r="6"/>
  <circle class="dote" cx="504" cy="106" r="6"/>
  <circle class="dotf" cx="560" cy="106" r="6"/>
  <circle class="dote" cx="580" cy="106" r="6"/>
  <circle class="dote" cx="600" cy="106" r="6"/>
  <rect class="acc" x="12" y="136" width="616" height="50" rx="6"/>
  <text class="b" x="20" y="158">2  RAG</text>
  <text class="s" x="20" y="176">解決：模型不知道內部事實</text>
  <circle class="dotf" cx="302" cy="162" r="6"/>
  <circle class="dotf" cx="322" cy="162" r="6"/>
  <circle class="dote" cx="342" cy="162" r="6"/>
  <circle class="dotf" cx="380" cy="162" r="6"/>
  <circle class="dotf" cx="400" cy="162" r="6"/>
  <circle class="dotf" cx="420" cy="162" r="6"/>
  <circle class="dotf" cx="464" cy="162" r="6"/>
  <circle class="dote" cx="484" cy="162" r="6"/>
  <circle class="dote" cx="504" cy="162" r="6"/>
  <circle class="dotf" cx="560" cy="162" r="6"/>
  <circle class="dotf" cx="580" cy="162" r="6"/>
  <circle class="dote" cx="600" cy="162" r="6"/>
  <rect class="box" x="12" y="192" width="616" height="50" rx="6"/>
  <text class="b" x="20" y="214">3  工具／MCP 整合</text>
  <text class="s" x="20" y="232">解決：要即時資料、要做動作</text>
  <circle class="dotf" cx="302" cy="218" r="6"/>
  <circle class="dotf" cx="322" cy="218" r="6"/>
  <circle class="dote" cx="342" cy="218" r="6"/>
  <circle class="dotf" cx="380" cy="218" r="6"/>
  <circle class="dote" cx="400" cy="218" r="6"/>
  <circle class="dote" cx="420" cy="218" r="6"/>
  <circle class="dotf" cx="464" cy="218" r="6"/>
  <circle class="dote" cx="484" cy="218" r="6"/>
  <circle class="dote" cx="504" cy="218" r="6"/>
  <circle class="dotf" cx="560" cy="218" r="6"/>
  <circle class="dotf" cx="580" cy="218" r="6"/>
  <circle class="dotf" cx="600" cy="218" r="6"/>
  <rect class="acc" x="12" y="248" width="616" height="50" rx="6"/>
  <text class="b" x="20" y="270">4  Agent 編排</text>
  <text class="s" x="20" y="288">解決：多步驟、需自己決策</text>
  <circle class="dotf" cx="302" cy="274" r="6"/>
  <circle class="dotf" cx="322" cy="274" r="6"/>
  <circle class="dotf" cx="342" cy="274" r="6"/>
  <circle class="dotf" cx="380" cy="274" r="6"/>
  <circle class="dotf" cx="400" cy="274" r="6"/>
  <circle class="dote" cx="420" cy="274" r="6"/>
  <circle class="dotf" cx="464" cy="274" r="6"/>
  <circle class="dotf" cx="484" cy="274" r="6"/>
  <circle class="dote" cx="504" cy="274" r="6"/>
  <circle class="dotf" cx="560" cy="274" r="6"/>
  <circle class="dotf" cx="580" cy="274" r="6"/>
  <circle class="dotf" cx="600" cy="274" r="6"/>
  <rect class="box" x="12" y="304" width="616" height="50" rx="6"/>
  <text class="b" x="20" y="326">5  微調（SFT／LoRA）</text>
  <text class="s" x="20" y="344">解決：行為、格式、術語</text>
  <circle class="dotf" cx="302" cy="330" r="6"/>
  <circle class="dotf" cx="322" cy="330" r="6"/>
  <circle class="dotf" cx="342" cy="330" r="6"/>
  <circle class="dotf" cx="380" cy="330" r="6"/>
  <circle class="dotf" cx="400" cy="330" r="6"/>
  <circle class="dotf" cx="420" cy="330" r="6"/>
  <circle class="dotf" cx="464" cy="330" r="6"/>
  <circle class="dotf" cx="484" cy="330" r="6"/>
  <circle class="dote" cx="504" cy="330" r="6"/>
  <circle class="dotf" cx="560" cy="330" r="6"/>
  <circle class="dotf" cx="580" cy="330" r="6"/>
  <circle class="dote" cx="600" cy="330" r="6"/>
  <rect class="acc" x="12" y="360" width="616" height="50" rx="6"/>
  <text class="b" x="20" y="382">6  自建模型服務</text>
  <text class="s" x="20" y="400">解決：資料不能出境、規模化</text>
  <circle class="dotf" cx="302" cy="386" r="6"/>
  <circle class="dotf" cx="322" cy="386" r="6"/>
  <circle class="dotf" cx="342" cy="386" r="6"/>
  <circle class="dotf" cx="380" cy="386" r="6"/>
  <circle class="dotf" cx="400" cy="386" r="6"/>
  <circle class="dote" cx="420" cy="386" r="6"/>
  <circle class="dotf" cx="464" cy="386" r="6"/>
  <circle class="dotf" cx="484" cy="386" r="6"/>
  <circle class="dotf" cx="504" cy="386" r="6"/>
  <circle class="dotf" cx="560" cy="386" r="6"/>
  <circle class="dotf" cx="580" cy="386" r="6"/>
  <circle class="dotf" cx="600" cy="386" r="6"/>
  <text class="s" x="320" y="432" text-anchor="middle">●●● 高　●●○ 中　●○○ 低（相對等級，非精確數字）</text>
  <text x="320" y="452" text-anchor="middle">建議從上往下試：上一層解決不了，才往下一層</text>
</svg>
