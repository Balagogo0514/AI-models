<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-labelledby="t d">
  <title id="t">Codex 的 sandbox 模式與 approval policy 組合，及文件建議的搭配</title>
  <desc id="d">sandbox 決定能寫哪裡：read-only 只能讀、workspace-write 可寫工作區、danger-full-access 近乎完全存取。approval 決定何時問人：untrusted 僅 trusted commands 免批准、on-request 由模型決定何時請求、never 永不詢問且失敗直接回傳、on-failure 已標示為 deprecated。文件建議的組合：一般本機開發用 workspace-write 加 on-request；嚴格審查用 read-only 加 untrusted；CI 非互動用 codex exec 加 never，非互動預設為 read-only。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="538.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">sandbox × approval：文件建議的搭配</text>
  <text class="s" x="100.0" y="58" text-anchor="middle">approval ↓　sandbox →</text>
  <rect class="hd" x="188" y="44" width="144" height="36" rx="6"/>
  <text class="monob" x="260.0" y="60" text-anchor="middle">read-only</text>
  <text class="s" x="260.0" y="75" text-anchor="middle">只能讀，不可寫</text>
  <rect class="hd" x="334" y="44" width="144" height="36" rx="6"/>
  <text class="monob" x="406.0" y="60" text-anchor="middle">workspace-write</text>
  <text class="s" x="406.0" y="75" text-anchor="middle">可寫工作區</text>
  <rect class="hd" x="480" y="44" width="144" height="36" rx="6"/>
  <text class="monob" x="552.0" y="60" text-anchor="middle">danger-full-access</text>
  <text class="s" x="552.0" y="75" text-anchor="middle">近乎完全存取</text>
  <rect class="box" x="12" y="84" width="176" height="66" rx="6"/>
  <text class="monob" x="22" y="112">untrusted</text>
  <text class="s" x="22" y="132">僅 trusted commands 免批准</text>
  <rect class="bad" x="188" y="84" width="144" height="66" rx="6"/>
  <text class="b" x="260.0" y="118" text-anchor="middle">★ 嚴格審查</text>
  <rect class="box" x="334" y="84" width="144" height="66" rx="6"/>
  <text class="m" x="406.0" y="122" text-anchor="middle">—</text>
  <rect class="box" x="480" y="84" width="144" height="66" rx="6"/>
  <text class="m" x="552.0" y="122" text-anchor="middle">—</text>
  <rect class="box" x="12" y="152" width="176" height="66" rx="6"/>
  <text class="monob" x="22" y="180">on-request</text>
  <text class="s" x="22" y="200">由模型決定何時請求</text>
  <rect class="box" x="188" y="152" width="144" height="66" rx="6"/>
  <text class="m" x="260.0" y="190" text-anchor="middle">—</text>
  <rect class="good" x="334" y="152" width="144" height="66" rx="6"/>
  <text class="b" x="406.0" y="186" text-anchor="middle">★ 一般本機開發</text>
  <rect class="box" x="480" y="152" width="144" height="66" rx="6"/>
  <text class="m" x="552.0" y="190" text-anchor="middle">—</text>
  <rect class="box" x="12" y="220" width="176" height="66" rx="6"/>
  <text class="monob" x="22" y="248">never</text>
  <text class="s" x="22" y="268">永不詢問，失敗直接回傳</text>
  <rect class="acc" x="188" y="220" width="144" height="66" rx="6"/>
  <text class="b" x="260.0" y="254" text-anchor="middle">★ CI 非互動</text>
  <rect class="box" x="334" y="220" width="144" height="66" rx="6"/>
  <text class="m" x="406.0" y="258" text-anchor="middle">—</text>
  <rect class="box" x="480" y="220" width="144" height="66" rx="6"/>
  <text class="m" x="552.0" y="258" text-anchor="middle">—</text>
  <rect class="box" x="12" y="288" width="176" height="66" rx="6"/>
  <text class="monob" x="22" y="316">on-failure</text>
  <text class="s" x="22" y="336">deprecated</text>
  <rect class="box" x="188" y="288" width="144" height="66" rx="6"/>
  <text class="m" x="260.0" y="326" text-anchor="middle">—</text>
  <rect class="box" x="334" y="288" width="144" height="66" rx="6"/>
  <text class="m" x="406.0" y="326" text-anchor="middle">—</text>
  <rect class="box" x="480" y="288" width="144" height="66" rx="6"/>
  <text class="m" x="552.0" y="326" text-anchor="middle">—</text>
  <rect class="box" x="12" y="372" width="616" height="56" rx="8"/>
  <text x="24" y="394">CI 非互動：codex exec 預設 read-only sandbox；範例 codex exec -a never --json</text>
  <text class="s" x="24" y="414">要寫檔才改 --sandbox workspace-write，並只在隔離的 worktree 使用</text>
  <rect class="dash" x="12" y="440" width="616" height="88" rx="8"/>
  <text x="24" y="462">還有一種控制面：permission profiles（codex sandbox --permissions-profile）</text>
  <text class="wt" x="24" y="484">--dangerously-bypass-approvals-and-sandbox：跳過 approval 與 sandbox，極危險</text>
  <text class="s" x="24" y="504">僅在外部已 sandbox 的自動化環境視情況使用；避免在未隔離的 runner 用 danger-full-access</text>
</svg>
