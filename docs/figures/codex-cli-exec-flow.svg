<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d">
  <title id="t">codex exec 的執行模型：外部觸發、準備、執行、輸出與回寫</title>
  <desc id="d">Webhook、CI 或排程觸發後，由呼叫端準備工作目錄、輸入檔與權限；再執行 codex exec，Codex 自行多輪推理與工具操作；輸出到 stdout 為最終訊息或 JSONL，並有退出碼；最後由呼叫端檢查退出碼、保存結果、更新外部系統。timeout、重試、併發、成本預算與回寫都由外部服務負責，codex exec 不是常駐的事件監聽器。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="518.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">codex exec：一次執行的模型</text>
  <rect class="box" x="12" y="44" width="420" height="60" rx="8"/>
  <text class="b" x="24" y="70">1 外部觸發</text>
  <text class="s" x="24" y="90">Webhook／CI 失敗／排程</text>
  <rect class="box" x="440" y="58" width="60" height="30" rx="15"/>
  <text x="470" y="78" text-anchor="middle">呼叫端</text>
  <line class="ln" x1="222" y1="105" x2="222" y2="113" marker-end="url(#a)"/>
  <rect class="box" x="12" y="114" width="420" height="60" rx="8"/>
  <text class="b" x="24" y="140">2 準備</text>
  <text class="s" x="24" y="160">工作目錄、輸入檔、權限；需在 Git repo（或 --skip-git-repo-check）</text>
  <rect class="box" x="440" y="128" width="60" height="30" rx="15"/>
  <text x="470" y="148" text-anchor="middle">呼叫端</text>
  <line class="ln" x1="222" y1="175" x2="222" y2="183" marker-end="url(#a)"/>
  <rect class="acc" x="12" y="184" width="420" height="60" rx="8"/>
  <text class="b" x="24" y="210">3 codex exec</text>
  <text class="s" x="24" y="230">Codex 自行多輪推理與工具操作；預設 read-only sandbox</text>
  <rect class="box" x="440" y="198" width="60" height="30" rx="15"/>
  <text x="470" y="218" text-anchor="middle">Codex</text>
  <line class="ln" x1="222" y1="245" x2="222" y2="253" marker-end="url(#a)"/>
  <rect class="acc" x="12" y="254" width="420" height="60" rx="8"/>
  <text class="b" x="24" y="280">4 輸出</text>
  <text class="s" x="24" y="300">stdout：最終訊息或 JSONL；另有退出碼</text>
  <rect class="box" x="440" y="268" width="60" height="30" rx="15"/>
  <text x="470" y="288" text-anchor="middle">Codex</text>
  <line class="ln" x1="222" y1="315" x2="222" y2="323" marker-end="url(#a)"/>
  <rect class="box" x="12" y="324" width="420" height="60" rx="8"/>
  <text class="b" x="24" y="350">5 檢查與回寫</text>
  <text class="s" x="24" y="370">檢查退出碼、保存結果、更新外部系統</text>
  <rect class="box" x="440" y="338" width="60" height="30" rx="15"/>
  <text x="470" y="358" text-anchor="middle">呼叫端</text>
  <rect class="dash" x="512" y="44" width="116" height="346" rx="10"/>
  <text class="b m" x="570" y="68" text-anchor="middle">外部服務</text>
  <text x="570" y="98" text-anchor="middle">timeout</text>
  <text x="570" y="124" text-anchor="middle">重試</text>
  <text x="570" y="150" text-anchor="middle">併發</text>
  <text x="570" y="176" text-anchor="middle">成本預算</text>
  <text x="570" y="202" text-anchor="middle">回寫 Jira</text>
  <text x="570" y="254" text-anchor="middle">codex exec</text>
  <text x="570" y="280" text-anchor="middle">不是常駐</text>
  <text x="570" y="306" text-anchor="middle">事件監聽器</text>
  <rect class="box" x="12" y="400" width="616" height="108" rx="8"/>
  <text class="b" x="24" y="422">常用選項</text>
  <text class="mono" x="24" y="444">-C 工作目錄　·　--sandbox read-only／workspace-write　·　--json（JSONL）</text>
  <text class="mono" x="24" y="464">--output-schema 結構化結果　·　-o 寫出最終訊息　·　--ephemeral 不存 session</text>
  <text class="s" x="24" y="488">每個 ticket 通常用獨立的 codex exec；要延續才用 codex exec resume</text>
</svg>
