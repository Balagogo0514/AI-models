<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img" aria-labelledby="t d">
  <title id="t">選 RAG 還是 LLM Wiki：四個問題</title>
  <desc id="d">四個問題依序判斷。一，只需要精確比對，例如簽章或錯誤碼嗎？是就用資料庫或關鍵字搜尋，不需要 RAG 也不需要 wiki。二，資料量遠大於數百頁，或更新很頻繁嗎？是就偏向 RAG，或 RAG 加 wiki。三，需要依使用者權限過濾嗎？是就偏向 RAG，在檢索時過濾；wiki 要另外設計頁面權限。四，需要知識累積、人可以直接讀、而且有人審閱嗎？是就用 LLM Wiki；否就先從簡單做法開始，小量資料甚至可直接放進 context。這是依本庫資料與 gist 整理的建議。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="698.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">RAG 還是 LLM Wiki？</text>
  <polygon class="acc" points="200,66.0 350.0,112 200,158.0 50.0,112"/>
  <text class="b" x="200" y="108" text-anchor="middle">只需要精確比對？</text>
  <text x="200" y="124" text-anchor="middle">（簽章、錯誤碼、編號）</text>
  <rect class="good" x="410.0" y="78.0" width="220" height="68" rx="8"/>
  <text class="b" x="520" y="108" text-anchor="middle">資料庫或關鍵字搜尋</text>
  <text x="520" y="124" text-anchor="middle">不需要 RAG 或 wiki</text>
  <path class="ln" d="M350.0,112.0 L410.0,112.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="102" text-anchor="middle">是</text>
  <path class="ln" d="M200.0,158.0 L200.0,192.0" marker-end="url(#a)"/>
  <text class="s" x="214" y="180" text-anchor="middle">否</text>
  <polygon class="acc" points="200,192.0 350.0,238 200,284.0 50.0,238"/>
  <text class="b" x="200" y="234" text-anchor="middle">資料量遠大於數百頁，</text>
  <text x="200" y="250" text-anchor="middle">或更新很頻繁？</text>
  <rect class="acc" x="410.0" y="204.0" width="220" height="68" rx="8"/>
  <text class="b" x="520" y="234" text-anchor="middle">偏向 RAG</text>
  <text x="520" y="250" text-anchor="middle">或 RAG ＋ wiki</text>
  <path class="ln" d="M350.0,238.0 L410.0,238.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="228" text-anchor="middle">是</text>
  <path class="ln" d="M200.0,284.0 L200.0,318.0" marker-end="url(#a)"/>
  <text class="s" x="214" y="306" text-anchor="middle">否</text>
  <polygon class="acc" points="200,318.0 350.0,364 200,410.0 50.0,364"/>
  <text class="b" x="200" y="360" text-anchor="middle">需要依使用者權限</text>
  <text x="200" y="376" text-anchor="middle">過濾檢索結果？</text>
  <rect class="acc" x="410.0" y="330.0" width="220" height="68" rx="8"/>
  <text class="b" x="520" y="360" text-anchor="middle">偏向 RAG（檢索時過濾）</text>
  <text x="520" y="376" text-anchor="middle">wiki 要另外設計頁面權限</text>
  <path class="ln" d="M350.0,364.0 L410.0,364.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="354" text-anchor="middle">是</text>
  <path class="ln" d="M200.0,410.0 L200.0,444.0" marker-end="url(#a)"/>
  <text class="s" x="214" y="432" text-anchor="middle">否</text>
  <polygon class="acc" points="200,444.0 350.0,490 200,536.0 50.0,490"/>
  <text class="b" x="200" y="486" text-anchor="middle">需要知識累積、人可直接讀，</text>
  <text x="200" y="502" text-anchor="middle">而且有人審閱？</text>
  <rect class="good" x="410.0" y="456.0" width="220" height="68" rx="8"/>
  <text class="b" x="520" y="494" text-anchor="middle">LLM Wiki</text>
  <path class="ln" d="M350.0,490.0 L410.0,490.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="480" text-anchor="middle">是</text>
  <path class="ln" d="M200.0,536.0 L200.0,570.0" marker-end="url(#a)"/>
  <text class="s" x="214" y="558" text-anchor="middle">否</text>
  <rect class="box" x="40.0" y="572.0" width="320" height="60" rx="8"/>
  <text class="b" x="200" y="598" text-anchor="middle">先從簡單做法開始</text>
  <text x="200" y="614" text-anchor="middle">小量資料可直接放進 context；再用案例比較</text>
  <text class="s" x="320" y="692" text-anchor="middle">依本庫資料與 gist 整理的建議；沒有實測比較</text>
</svg>
