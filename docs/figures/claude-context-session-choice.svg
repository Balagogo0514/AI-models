<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="t d">
  <title id="t">依情況選 session 模式：受規範資料、程式碼不離網路、個人帳號、一般公司開發</title>
  <desc id="d">受規範資料需要零資料保留或 HIPAA 時只用 local。要雲端體驗但程式碼不離開公司網路時用自架環境，對話仍送 Anthropic。個人帳號時雲端 session 的分享預設較鬆，公司程式碼不要放個人帳號。一般公司開發可用雲端 session，但要限制網路、金鑰改用 network secret、關閉不需要的分享。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="498.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">怎麼選？</text>
  <rect class="acc" x="12" y="44" width="290" height="74" rx="10"/>
  <text x="24" y="88">受規範資料，需要 ZDR 或 HIPAA</text>
  <line class="ln" x1="302" y1="81" x2="336" y2="81" marker-end="url(#a)"/>
  <rect class="good" x="338" y="44" width="290" height="74" rx="10"/>
  <text class="b" x="350" y="76">只用 Local</text>
  <text class="s" x="350" y="100">雲端與 Remote Control 本來就不可用</text>
  <rect class="acc" x="12" y="130" width="290" height="74" rx="10"/>
  <text x="24" y="174">要雲端體驗，但程式碼不離開公司網路</text>
  <line class="ln" x1="302" y1="167" x2="336" y2="167" marker-end="url(#a)"/>
  <rect class="acc" x="338" y="130" width="290" height="74" rx="10"/>
  <text class="b" x="350" y="162">自架環境</text>
  <text class="s" x="350" y="186">對話仍送 Anthropic；ZDR／HIPAA 不可用</text>
  <rect class="acc" x="12" y="216" width="290" height="74" rx="10"/>
  <text x="24" y="260">個人帳號（Pro、Max、Ultra）</text>
  <line class="ln" x1="302" y1="253" x2="336" y2="253" marker-end="url(#a)"/>
  <rect class="bad" x="338" y="216" width="290" height="74" rx="10"/>
  <text class="b" x="350" y="248">公司程式碼別放</text>
  <text class="s" x="350" y="272">分享預設較鬆；訓練設定另有影響</text>
  <rect class="acc" x="12" y="302" width="290" height="74" rx="10"/>
  <text x="24" y="346">一般公司開發</text>
  <line class="ln" x1="302" y1="339" x2="336" y2="339" marker-end="url(#a)"/>
  <rect class="box" x="338" y="302" width="290" height="74" rx="10"/>
  <text class="b" x="350" y="334">雲端可用，但要收緊</text>
  <text class="s" x="350" y="358">限制網路；金鑰用 network secret；關閉分享</text>
  <rect class="dash" x="12" y="396" width="616" height="92" rx="8"/>
  <text class="b" x="24" y="420">雲端 session 的三個收緊動作</text>
  <text x="24" y="442">・環境變數不是秘密：使用該環境的任何人都能讀到；金鑰改用 network secret</text>
  <text x="24" y="460">・網路預設有限制；即使關閉，仍可與 Anthropic API 通訊</text>
  <text x="24" y="478">・Pro／Max／Ultra 的「公開」分享：任何登入 claude.ai 的人都看得到</text>
</svg>
