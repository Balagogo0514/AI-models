<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 612" role="img" aria-labelledby="t d">
  <title id="t">月度 API credits 的流程：從領取到用完</title>
  <desc id="d">六個步驟。一，在 claude.ai 的帳單設定選擇 Console 組織並接受條款。二，credits 出現在 Console 的 Promotional credits。三，在該組織建立一般 API key，同組織所有 key 與 workspace 共用餘額。四，呼叫 API 或 Agent SDK，先花 credits，再花購買的額度。五，計費週期結束，未用完的失效，不累積。六，餘額用完：有購買額度就用，沒有就 API 停止，錯誤是 credit balance is too low，且不會向訂閱收費。需要的角色：Max 或 Ultra 訂閱者，或 Team 的 Owner，加上 Console 的 Admin 或 Billing。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="610.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">月度 API credits：從領取到用完</text>
  <rect class="acc" x="90.0" y="46.0" width="460" height="56" rx="8"/>
  <text class="b" x="320" y="70" text-anchor="middle">1 claude.ai 帳單設定</text>
  <text x="320" y="86" text-anchor="middle">選 Console 組織、接受條款</text>
  <path class="ln" d="M320.0,102.0 L320.0,120.0" marker-end="url(#a)"/>
  <rect class="acc" x="90.0" y="120.0" width="460" height="56" rx="8"/>
  <text class="b" x="320" y="144" text-anchor="middle">2 Console 的 Promotional credits</text>
  <text x="320" y="160" text-anchor="middle">出現月度金額</text>
  <path class="ln" d="M320.0,176.0 L320.0,194.0" marker-end="url(#a)"/>
  <rect class="good" x="90.0" y="194.0" width="460" height="56" rx="8"/>
  <text class="b" x="320" y="218" text-anchor="middle">3 在該組織建立一般 API key</text>
  <text x="320" y="234" text-anchor="middle">同組織所有 key 與 workspace 共用餘額</text>
  <path class="ln" d="M320.0,250.0 L320.0,268.0" marker-end="url(#a)"/>
  <rect class="good" x="90.0" y="268.0" width="460" height="56" rx="8"/>
  <text class="b" x="320" y="292" text-anchor="middle">4 呼叫 API／Agent SDK</text>
  <text x="320" y="308" text-anchor="middle">先花 credits，再花購買的額度</text>
  <path class="ln" d="M320.0,324.0 L320.0,342.0" marker-end="url(#a)"/>
  <rect class="bad" x="90.0" y="342.0" width="460" height="56" rx="8"/>
  <text class="b" x="320" y="366" text-anchor="middle">5 計費週期結束</text>
  <text x="320" y="382" text-anchor="middle">未用完的失效，不累積</text>
  <path class="ln" d="M320.0,398.0 L320.0,416.0" marker-end="url(#a)"/>
  <rect class="bad" x="90.0" y="416.0" width="460" height="56" rx="8"/>
  <text class="b" x="320" y="440" text-anchor="middle">6 餘額用完</text>
  <text x="320" y="456" text-anchor="middle">有購買額度就用；沒有 → API 停止；不扣訂閱</text>
  <text class="s" x="320" y="540" text-anchor="middle">需要的角色：Max／Ultra 訂閱者，或 Team 的 Owner；加上 Console 的 Admin 或 Billing</text>
  <text class="s" x="320" y="560" text-anchor="middle">每個方案只能連一個 Console 組織；要換，得聯絡客服</text>
  <text class="s" x="320" y="580" text-anchor="middle">金額：Max $100、Ultra $200；Team 每 Standard 席位 $20、Premium $100，上限 $500（每月）</text>
</svg>
