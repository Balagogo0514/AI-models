<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
  <title id="t">以 Sonnet 5.5 為例的月成本與三個降成本槓桿</title>
  <desc id="d">假設每月 10 萬次請求，每次輸入 6,000 tokens、輸出 500 tokens，以 Sonnet 5.5 的官方單價輸入 2 美元、輸出 10 美元每百萬 tokens 計算：基線約 1,700 美元；其中 4,000 tokens 為固定前綴並命中快取時約 940 美元；全部改用批次約 850 美元；若全部改用 Haiku 5.5 約 85 美元但品質需另行評估。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="398.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">月成本示例與降成本槓桿（單價依官方定價頁，2026-11-07）</text>
  <text class="s" x="24" y="56">假設：每月 10 萬次請求，每次輸入 6,000、輸出 500 tokens；Sonnet 5.5 輸入 $2、輸出 $10 / 百萬 tokens</text>
  <text x="24" y="102">基線</text>
  <rect class="box" x="150" y="82" width="357.0" height="30" rx="4"/>
  <text class="b" x="515.0" y="102">$1,700</text>
  <text x="24" y="152">提示詞快取</text>
  <rect class="acc" x="150" y="132" width="197.4" height="30" rx="4"/>
  <text class="b" x="355.4" y="152">$940</text>
  <text x="24" y="202">批次處理</text>
  <rect class="acc" x="150" y="182" width="178.5" height="30" rx="4"/>
  <text class="b" x="336.5" y="202">$850</text>
  <text x="24" y="252">全改 Haiku 5.5</text>
  <rect class="bad" x="150" y="232" width="17.849999999999998" height="30" rx="4"/>
  <text class="b" x="175.85" y="252">$85</text>
  <rect class="box" x="12" y="284" width="616" height="100" rx="8"/>
  <text class="b at" x="24" y="308">快取</text>
  <text x="72" y="308">固定前綴命中時，讀取價為輸入單價的 0.05 倍（Sonnet 5.5）；寫入另計 1.25 倍（5 分鐘）</text>
  <text class="b at" x="24" y="334">批次</text>
  <text x="72" y="334">Batch API 輸入與輸出都 5 折，但非即時；不適合互動式問答</text>
  <text class="b at" x="24" y="360">分級</text>
  <text x="72" y="360">簡單請求用小模型；品質要另做評估，不能只看價格</text>
</svg>
