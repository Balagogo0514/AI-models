<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 446" role="img" aria-labelledby="t d">
  <title id="t">整頓多部門 skill 的六個步驟</title>
  <desc id="d">六個步驟依序是：盤點、分類、指定 owner 與唯一入口、發佈成 plugin 並用 managed settings 強制啟用、鎖定來源、用評測驗證。鎖定來源要等前面做完再開，否則現有專案 skill 會全部失效。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="444.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">整頓步驟（先盤點，最後才鎖定）</text>
  <rect class="box" x="12" y="48" width="616" height="54" rx="8"/>
  <text class="b" x="26" y="81">1 盤點</text>
  <text x="170" y="81">列出名稱、描述、擁有者、allowed-tools；/skill-doctor 看成本</text>
  <line class="ln" x1="320" y1="103" x2="320" y2="109" marker-end="url(#a)"/>
  <rect class="box" x="12" y="110" width="616" height="54" rx="8"/>
  <text class="b" x="26" y="143">2 分類</text>
  <text x="170" y="143">重複的合併、部門專屬的改成規則、過期的刪除</text>
  <line class="ln" x1="320" y1="165" x2="320" y2="171" marker-end="url(#a)"/>
  <rect class="box" x="12" y="172" width="616" height="54" rx="8"/>
  <text class="b" x="26" y="205">3 指定 owner</text>
  <text x="170" y="205">一個唯一入口；其他部門以 PR 提需求</text>
  <line class="ln" x1="320" y1="227" x2="320" y2="233" marker-end="url(#a)"/>
  <rect class="box" x="12" y="234" width="616" height="54" rx="8"/>
  <text class="b" x="26" y="267">4 發佈成 plugin</text>
  <text x="170" y="267">公司 marketplace；managed settings 強制啟用</text>
  <line class="ln" x1="320" y1="289" x2="320" y2="295" marker-end="url(#a)"/>
  <rect class="bad" x="12" y="296" width="616" height="54" rx="8"/>
  <text class="b" x="26" y="329">5 鎖定來源</text>
  <text x="170" y="329">strictPluginOnlyCustomization 等前面做完再開</text>
  <line class="ln" x1="320" y1="351" x2="320" y2="357" marker-end="url(#a)"/>
  <rect class="good" x="12" y="358" width="616" height="54" rx="8"/>
  <text class="b" x="26" y="391">6 評測驗證</text>
  <text x="170" y="391">用真實 PR 比較整頓前後的審查與觸發</text>
  <text class="s" x="320" y="434" text-anchor="middle">這是建議流程，不是官方流程</text>
</svg>
