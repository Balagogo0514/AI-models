<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 462" role="img" aria-labelledby="t d">
  <title id="t">六個常見陷阱與對策</title>
  <desc id="d">六個陷阱與對策。只看測試不看畫面：重要頁面用瀏覽器看一次。規則只寫在 CLAUDE.md：要擋的用 deny 或 hook。隨意 yarn add 或 install：依賴變更由你確認。一次要求太大：一次一個元件或功能，大改動先用 plan 模式。不看 diff：acceptEdits 是事後審查，每次都審 diff 再 commit。.mcp.json 用 @latest：固定版本。以上都是建議。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="460.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">六個陷阱 → 對策（建議）</text>
  <rect class="acc" x="12" y="44" width="270" height="58" rx="10"/>
  <text x="24" y="78.0">只看測試、不看畫面</text>
  <line class="ln" x1="282" y1="73.0" x2="316" y2="73.0" marker-end="url(#a)"/>
  <rect class="box" x="318" y="44" width="310" height="58" rx="10"/>
  <text class="b" x="330" y="67.0">重要頁面用瀏覽器看一次</text>
  <text class="s" x="330" y="89.0">樣式與版面測試抓不到（第 4 節）</text>
  <rect class="acc" x="12" y="110" width="270" height="58" rx="10"/>
  <text x="24" y="144.0">規則只寫在 CLAUDE.md</text>
  <line class="ln" x1="282" y1="139.0" x2="316" y2="139.0" marker-end="url(#a)"/>
  <rect class="box" x="318" y="110" width="310" height="58" rx="10"/>
  <text class="b" x="330" y="133.0">要擋的用 deny 或 hook</text>
  <text class="s" x="330" y="155.0">文字指示不保證被遵守</text>
  <rect class="acc" x="12" y="176" width="270" height="58" rx="10"/>
  <text x="24" y="210.0">隨意 yarn add／install</text>
  <line class="ln" x1="282" y1="205.0" x2="316" y2="205.0" marker-end="url(#a)"/>
  <rect class="box" x="318" y="176" width="310" height="58" rx="10"/>
  <text class="b" x="330" y="199.0">依賴變更由你確認</text>
  <text class="s" x="330" y="221.0">會改 package.json 與 lockfile</text>
  <rect class="acc" x="12" y="242" width="270" height="58" rx="10"/>
  <text x="24" y="276.0">一次要求太大</text>
  <line class="ln" x1="282" y1="271.0" x2="316" y2="271.0" marker-end="url(#a)"/>
  <rect class="box" x="318" y="242" width="310" height="58" rx="10"/>
  <text class="b" x="330" y="265.0">一次一個元件或功能</text>
  <text class="s" x="330" y="287.0">大改動先用 plan 模式看計畫</text>
  <rect class="acc" x="12" y="308" width="270" height="58" rx="10"/>
  <text x="24" y="342.0">不看 diff</text>
  <line class="ln" x1="282" y1="337.0" x2="316" y2="337.0" marker-end="url(#a)"/>
  <rect class="box" x="318" y="308" width="310" height="58" rx="10"/>
  <text class="b" x="330" y="331.0">每次都審 diff 再 commit</text>
  <text class="s" x="330" y="353.0">acceptEdits 是事後審查</text>
  <rect class="acc" x="12" y="374" width="270" height="58" rx="10"/>
  <text x="24" y="408.0">.mcp.json 用 @latest</text>
  <line class="ln" x1="282" y1="403.0" x2="316" y2="403.0" marker-end="url(#a)"/>
  <rect class="box" x="318" y="374" width="310" height="58" rx="10"/>
  <text class="b" x="330" y="397.0">固定版本</text>
  <text class="s" x="330" y="419.0">避免不同人拿到不同行為</text>
</svg>
