<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 960" role="img" aria-labelledby="t d">
  <title id="t">已有 backtrace 時的精簡流程：fingerprint 命中就不呼叫模型，未命中才進入預算控管的分析</title>
  <desc id="d">coredump 先取得既有程式輸出的 full backtrace、registers、threads，經 Python 前處理與正規化，產出 case_facts.json 與 crash fingerprint。若 signature 已知，查詢既有 root cause 與 fix version，直接輸出既有分析報告，不呼叫模型；若未知，建立 CaseBudget（token、呼叫次數、時間上限），與最小證據集一起，用 openai SDK 加 Responses API 做第一次模型判讀。證據足夠就產出結構化報告；不足則用受控工具查 source、Git、artifact excerpt，再判斷是否值得深度分析：否則標記 needs_human_or_deep_analysis，是則做第二次深度分析（額外預算或人工核准）後產出報告。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="958.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">fingerprint 先擋，模型只在必要時才呼叫</text>
  <rect class="box" x="170.0" y="44.0" width="300" height="40" rx="8"/>
  <text x="320" y="68" text-anchor="middle">coredump</text>
  <rect class="box" x="110.0" y="98.0" width="420" height="44" rx="8"/>
  <text x="320" y="116" text-anchor="middle">既有程式</text>
  <text x="320" y="132" text-anchor="middle">full backtrace／info registers／info threads</text>
  <rect class="box" x="170.0" y="158.0" width="300" height="40" rx="8"/>
  <text x="320" y="182" text-anchor="middle">Python 前處理與正規化</text>
  <rect class="box" x="35.0" y="224.0" width="190" height="40" rx="8"/>
  <text x="130" y="248" text-anchor="middle">case_facts.json</text>
  <rect class="box" x="410.0" y="224.0" width="190" height="40" rx="8"/>
  <text x="505" y="248" text-anchor="middle">crash fingerprint</text>
  <path class="ln" d="M320.0,84.0 L320.0,98.0" marker-end="url(#a)"/>
  <path class="ln" d="M320.0,142.0 L320.0,158.0" marker-end="url(#a)"/>
  <path class="ln" d="M250.0,198.0 L130.0,224.0" marker-end="url(#a)"/>
  <path class="ln" d="M390.0,198.0 L505.0,224.0" marker-end="url(#a)"/>
  <polygon class="acc" points="505,292.0 605.0,330 505,368.0 405.0,330"/>
  <text class="b" x="505" y="334" text-anchor="middle">已知 signature？</text>
  <path class="ln" d="M505.0,264.0 L505.0,292.0" marker-end="url(#a)"/>
  <rect class="good" x="410.0" y="396.0" width="190" height="56" rx="8"/>
  <text x="505" y="420" text-anchor="middle">查詢既有 root cause</text>
  <text x="505" y="436" text-anchor="middle">Issue／fix version</text>
  <rect class="good" x="410.0" y="478.0" width="190" height="56" rx="8"/>
  <text x="505" y="502" text-anchor="middle">輸出既有分析報告</text>
  <text x="505" y="518" text-anchor="middle">不呼叫模型</text>
  <path class="ln" d="M505.0,368.0 L505.0,396.0" marker-end="url(#a)"/>
  <text class="s" x="520" y="384" text-anchor="middle">是</text>
  <path class="ln" d="M505.0,452.0 L505.0,478.0" marker-end="url(#a)"/>
  <rect class="acc" x="205.0" y="302.0" width="170" height="56" rx="8"/>
  <text x="290" y="326" text-anchor="middle">建立 CaseBudget</text>
  <text x="290" y="342" text-anchor="middle">token／呼叫次數／時間</text>
  <path class="ln" d="M405.0,330.0 L375.0,330.0" marker-end="url(#a)"/>
  <text class="s" x="391" y="322" text-anchor="middle">否</text>
  <rect class="box" x="180.0" y="416.0" width="220" height="52" rx="8"/>
  <text x="290" y="438" text-anchor="middle">最小證據集</text>
  <text x="290" y="454" text-anchor="middle">facts + top frames</text>
  <path class="ln" d="M290.0,358.0 L290.0,416.0" marker-end="url(#a)"/>
  <path class="ln" d="M130.0,264.0 L130.0,442.0 L180.0,442.0" marker-end="url(#a)"/>
  <rect class="acc" x="170.0" y="508.0" width="230" height="52" rx="8"/>
  <text x="285" y="530" text-anchor="middle">openai SDK + Responses API</text>
  <text x="285" y="546" text-anchor="middle">第一次模型判讀</text>
  <path class="ln" d="M290.0,468.0 L290.0,508.0" marker-end="url(#a)"/>
  <polygon class="acc" points="290,588.0 395.0,626 290,664.0 185.0,626"/>
  <text class="b" x="290" y="630" text-anchor="middle">證據足夠？</text>
  <path class="ln" d="M290.0,560.0 L290.0,588.0" marker-end="url(#a)"/>
  <rect class="good" x="425.0" y="595.0" width="190" height="62" rx="8"/>
  <text x="520" y="614" text-anchor="middle">結構化報告</text>
  <text x="520" y="630" text-anchor="middle">facts／hypotheses／</text>
  <text x="520" y="646" text-anchor="middle">evidence IDs</text>
  <path class="ln" d="M395.0,626.0 L425.0,626.0" marker-end="url(#a)"/>
  <text class="s" x="410" y="618" text-anchor="middle">是</text>
  <rect class="box" x="160.0" y="698.0" width="260" height="52" rx="8"/>
  <text x="290" y="720" text-anchor="middle">受控工具</text>
  <text x="290" y="736" text-anchor="middle">source／Git／artifact excerpt</text>
  <path class="ln" d="M290.0,664.0 L290.0,698.0" marker-end="url(#a)"/>
  <text class="s" x="304" y="684" text-anchor="middle">否</text>
  <polygon class="acc" points="290,770.0 400.0,808 290,846.0 180.0,808"/>
  <text class="b" x="290" y="812" text-anchor="middle">值得深度分析？</text>
  <path class="ln" d="M290.0,750.0 L290.0,770.0" marker-end="url(#a)"/>
  <rect class="acc" x="425.0" y="778.0" width="190" height="60" rx="8"/>
  <text x="520" y="804" text-anchor="middle">第二次深度分析</text>
  <text x="520" y="820" text-anchor="middle">額外預算或人工核准</text>
  <path class="ln" d="M400.0,808.0 L425.0,808.0" marker-end="url(#a)"/>
  <text class="s" x="412" y="800" text-anchor="middle">是</text>
  <path class="ln" d="M520.0,778.0 L520.0,654.0" marker-end="url(#a)"/>
  <rect class="bad" x="140.0" y="866.0" width="300" height="48" rx="8"/>
  <text x="290" y="894" text-anchor="middle">needs_human_or_deep_analysis</text>
  <path class="ln" d="M290.0,846.0 L290.0,866.0" marker-end="url(#a)"/>
  <text class="s" x="304" y="858" text-anchor="middle">否</text>
  <text class="s" x="320" y="944" text-anchor="middle">多數新案件只需一次模型呼叫；只有未知、高優先或證據不足才進入第二次深度分析</text>
</svg>
