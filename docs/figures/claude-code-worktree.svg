<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376" role="img" aria-labelledby="t d">
  <title id="t">Worktree：共用 .git 的多個工作目錄，與離開時的清理規則</title>
  <desc id="d">同一個 repo 的 .git 歷史被主 checkout 與多個 worktree 共用。claude --worktree 會在 .claude/worktrees/名稱/ 建立獨立工作目錄與 worktree-名稱 分支。離開時：沒有變更就自動刪除，有變更或新 commit 則詢問是否保留，非互動模式不會自動清理。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 12px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { stroke-dasharray: 5 4; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .chip { fill: var(--warn); fill-opacity: .16; stroke: var(--warn); stroke-width: 1; }
    .chipg { fill: var(--muted); fill-opacity: .12; stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="374.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">Worktree：共用 .git，各自一份工作目錄</text>
  <rect class="acc" x="110" y="46" width="160" height="44" rx="8"/>
  <text class="b at" x="190" y="66" text-anchor="middle">.git（共用歷史）</text>
  <text class="s" x="190" y="82" text-anchor="middle">同一份 repo 與 remote</text>
  <rect class="box" x="12" y="140" width="96" height="78" rx="8"/>
  <text class="b" x="60" y="162" text-anchor="middle">主 checkout</text>
  <text class="s" x="60" y="181" text-anchor="middle">你的工作目錄</text>
  <text class="s" x="60" y="199" text-anchor="middle">你的 branch</text>
  <rect class="box" x="112" y="140" width="96" height="78" rx="8"/>
  <text class="b" x="160" y="162" text-anchor="middle">worktree A</text>
  <text class="s" x="160" y="181" text-anchor="middle">獨立工作目錄</text>
  <text class="s" x="160" y="199" text-anchor="middle">worktree-&lt;名稱&gt;</text>
  <rect class="box" x="212" y="140" width="96" height="78" rx="8"/>
  <text class="b" x="260" y="162" text-anchor="middle">worktree B</text>
  <text class="s" x="260" y="181" text-anchor="middle">獨立工作目錄</text>
  <text class="s" x="260" y="199" text-anchor="middle">worktree-&lt;名稱&gt;</text>
  <line class="ln" x1="150" y1="91" x2="60" y2="138" marker-end="url(#a)"/>
  <line class="ln" x1="190" y1="91" x2="160" y2="138" marker-end="url(#a)"/>
  <line class="ln" x1="230" y1="91" x2="260" y2="138" marker-end="url(#a)"/>
  <text class="s" x="160" y="238" text-anchor="middle">路徑預設：.claude/worktrees/&lt;名稱&gt;/</text>
  <rect class="box" x="12" y="252" width="306" height="96" rx="8"/>
  <text class="b" x="24" y="274">分支基準（worktree.baseRef）</text>
  <text x="24" y="296">fresh（預設）：從 origin/HEAD 開分支</text>
  <text x="24" y="314">head：從本地 HEAD 開分支（含未推送 commit）</text>
  <text class="s" x="24" y="336">.env 等 gitignore 的檔：用 .worktreeinclude 複製</text>
  <rect class="box" x="334" y="46" width="294" height="302" rx="8"/>
  <text class="b" x="346" y="68">離開 worktree 時的清理</text>
  <rect class="good" x="346" y="82" width="270" height="74" rx="8"/>
  <text class="b" x="358" y="106">無未提交變更、無新 commit</text>
  <text x="358" y="130">→ 自動刪除 worktree 與 branch</text>
  <rect class="acc" x="346" y="168" width="270" height="74" rx="8"/>
  <text class="b" x="358" y="192">有變更或新 commit</text>
  <text x="358" y="216">→ 詢問是否保留（移除會刪掉未提交內容）</text>
  <rect class="bad" x="346" y="254" width="270" height="74" rx="8"/>
  <text class="b" x="358" y="278">搭配 -p（非互動）</text>
  <text x="358" y="302">→ 不自動清理，需手動 git worktree remove</text>
  <text class="s" x="320" y="368" text-anchor="middle">依本文〈Worktree 使用方法〉整理</text>
</svg>
