<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d">
  <title id="t">依背景選起點：要不要寫程式、偏好中文、先看原理還是先寫程式</title>
  <desc id="d">第一個問題是要不要寫程式。不用寫程式、非技術背景，先看吳恩達的 AI for Everyone，想再看視覺直覺就接 3Blue1Brown 的神經網路系列。要寫程式則問偏好中文嗎：偏好中文，看李宏毅的機器學習課程、《動手學深度學習》中文版，也可看第 7.5 節的浙大中國大學 MOOC；不限語言則問先看原理還是先寫程式：先看原理，看 3Blue1Brown 再看 Dive into Deep Learning；先寫程式，看 fast.ai。這是依各資源的定位所做的歸納。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="478.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">我該從哪裡開始？</text>
  <polygon class="acc" points="320,41.0 430.0,76 320,111.0 210.0,76"/>
  <text class="b" x="320" y="80" text-anchor="middle">要寫程式嗎？</text>
  <rect class="good" x="10.0" y="160.0" width="210" height="60" rx="8"/>
  <text class="b" x="115" y="186" text-anchor="middle">吳恩達：AI for Everyone</text>
  <text x="115" y="202" text-anchor="middle">非技術背景，不需寫程式</text>
  <path class="ln" d="M210.0,76.0 L115.0,76.0 L115.0,160.0" marker-end="url(#a)"/>
  <text class="s" x="160" y="68" text-anchor="middle">不用</text>
  <rect class="box" x="10.0" y="262.0" width="210" height="56" rx="8"/>
  <text class="b" x="115" y="286" text-anchor="middle">3Blue1Brown</text>
  <text x="115" y="302" text-anchor="middle">神經網路系列（視覺直覺）</text>
  <path class="ln" d="M115.0,220.0 L115.0,262.0" marker-end="url(#a)"/>
  <text class="s" x="188" y="246" text-anchor="middle">想再看視覺直覺</text>
  <path class="ln" d="M430.0,76.0 L535.0,76.0 L535.0,115.0" marker-end="url(#a)"/>
  <text class="s" x="480" y="68" text-anchor="middle">要</text>
  <polygon class="acc" points="535,117.0 620.0,152 535,187.0 450.0,152"/>
  <text class="b" x="535" y="156" text-anchor="middle">偏好中文嗎？</text>
  <rect class="acc" x="235.0" y="111.0" width="190" height="82" rx="8"/>
  <text class="b" x="330" y="140" text-anchor="middle">李宏毅：機器學習</text>
  <text x="330" y="156" text-anchor="middle">《動手學深度學習》中文版</text>
  <text x="330" y="172" text-anchor="middle">浙大 MOOC（第 7.5 節）</text>
  <path class="ln" d="M450.0,152.0 L425.0,152.0" marker-end="url(#a)"/>
  <text class="s" x="438" y="144" text-anchor="middle">是</text>
  <polygon class="acc" points="535,215.0 620.0,250 535,285.0 450.0,250"/>
  <text class="b" x="535" y="246" text-anchor="middle">先看原理</text>
  <text x="535" y="262" text-anchor="middle">還是先寫程式？</text>
  <path class="ln" d="M535.0,187.0 L535.0,215.0" marker-end="url(#a)"/>
  <text class="s" x="560" y="205" text-anchor="middle">不限</text>
  <rect class="box" x="235.0" y="325.0" width="190" height="70" rx="8"/>
  <text class="b" x="330" y="348" text-anchor="middle">3Blue1Brown</text>
  <text x="330" y="364" text-anchor="middle">→ Dive into Deep Learning</text>
  <text x="330" y="380" text-anchor="middle">（d2l.ai）</text>
  <path class="ln" d="M450.0,250.0 L330.0,250.0 L330.0,325.0" marker-end="url(#a)"/>
  <text class="s" x="395" y="242" text-anchor="middle">先看原理</text>
  <rect class="box" x="450.0" y="325.0" width="170" height="70" rx="8"/>
  <text class="b" x="535" y="348" text-anchor="middle">fast.ai</text>
  <text x="535" y="364" text-anchor="middle">先寫程式，再回頭</text>
  <text x="535" y="380" text-anchor="middle">理解原理</text>
  <path class="ln" d="M535.0,285.0 L535.0,325.0" marker-end="url(#a)"/>
  <text class="s" x="575" y="308" text-anchor="middle">先寫程式</text>
  <text class="s" x="320" y="446" text-anchor="middle">這是依各資源的定位所做的歸納，不是學校或作者的建議</text>
  <text class="s" x="320" y="464" text-anchor="middle">各資源的驗證狀態見第 11 節</text>
</svg>
