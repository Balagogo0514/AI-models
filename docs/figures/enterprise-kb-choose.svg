<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 740" role="img" aria-labelledby="t d">
  <title id="t">選型決策：這份知識該用哪種機制</title>
  <desc id="d">五個問題依序判斷。一，答案是現在的值，或要執行動作嗎？是就用 MCP 或 API 工具。二，內容是程式碼嗎？是就用程式碼搜尋與 repo 工具。三，只需要精確比對，例如編號、簽章、錯誤碼嗎？是就用資料庫或關鍵字搜尋。四，是會累積、需要人審閱的經驗知識，而且量中小嗎？是就用 LLM Wiki 加案件資料庫。五，是大量非結構化文件嗎？是就用 RAG，權限寫進 metadata。都不是就先從簡單做法開始。這是依本庫資料整理的建議。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="738.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">這份知識該用哪種機制？</text>
  <polygon class="acc" points="200,56.0 350.0,100 200,144.0 50.0,100"/>
  <text class="b" x="200" y="96" text-anchor="middle">答案是「現在的值」</text>
  <text x="200" y="112" text-anchor="middle">或要執行動作？</text>
  <rect class="acc" x="410.0" y="68.0" width="220" height="64" rx="8"/>
  <text class="b" x="520" y="96" text-anchor="middle">MCP／API 工具</text>
  <text x="520" y="112" text-anchor="middle">先唯讀再逐級放寬</text>
  <path class="ln" d="M350.0,100.0 L410.0,100.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="90" text-anchor="middle">是</text>
  <path class="ln" d="M200.0,144.0 L200.0,168.0" marker-end="url(#a)"/>
  <text class="s" x="214" y="158" text-anchor="middle">否</text>
  <polygon class="acc" points="200,168.0 350.0,212 200,256.0 50.0,212"/>
  <text class="b" x="200" y="216" text-anchor="middle">內容是程式碼？</text>
  <rect class="acc" x="410.0" y="180.0" width="220" height="64" rx="8"/>
  <text class="b" x="520" y="208" text-anchor="middle">程式碼搜尋</text>
  <text x="520" y="224" text-anchor="middle">與 repo 工具</text>
  <path class="ln" d="M350.0,212.0 L410.0,212.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="202" text-anchor="middle">是</text>
  <path class="ln" d="M200.0,256.0 L200.0,280.0" marker-end="url(#a)"/>
  <text class="s" x="214" y="270" text-anchor="middle">否</text>
  <polygon class="acc" points="200,280.0 350.0,324 200,368.0 50.0,324"/>
  <text class="b" x="200" y="320" text-anchor="middle">只需要精確比對？</text>
  <text x="200" y="336" text-anchor="middle">（編號、簽章、錯誤碼）</text>
  <rect class="box" x="410.0" y="292.0" width="220" height="64" rx="8"/>
  <text class="b" x="520" y="320" text-anchor="middle">資料庫或關鍵字搜尋</text>
  <text x="520" y="336" text-anchor="middle">不需要 RAG 或 wiki</text>
  <path class="ln" d="M350.0,324.0 L410.0,324.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="314" text-anchor="middle">是</text>
  <path class="ln" d="M200.0,368.0 L200.0,392.0" marker-end="url(#a)"/>
  <text class="s" x="214" y="382" text-anchor="middle">否</text>
  <polygon class="acc" points="200,392.0 350.0,436 200,480.0 50.0,436"/>
  <text class="b" x="200" y="432" text-anchor="middle">會累積、需要人審閱的</text>
  <text x="200" y="448" text-anchor="middle">經驗知識，且量中小？</text>
  <rect class="good" x="410.0" y="404.0" width="220" height="64" rx="8"/>
  <text class="b" x="520" y="432" text-anchor="middle">LLM Wiki ＋ 案件資料庫</text>
  <text x="520" y="448" text-anchor="middle">人工核准才寫入</text>
  <path class="ln" d="M350.0,436.0 L410.0,436.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="426" text-anchor="middle">是</text>
  <path class="ln" d="M200.0,480.0 L200.0,504.0" marker-end="url(#a)"/>
  <text class="s" x="214" y="494" text-anchor="middle">否</text>
  <polygon class="acc" points="200,504.0 350.0,548 200,592.0 50.0,548"/>
  <text class="b" x="200" y="544" text-anchor="middle">大量非結構化文件？</text>
  <text x="200" y="560" text-anchor="middle">（規格、手冊、設計）</text>
  <rect class="good" x="410.0" y="516.0" width="220" height="64" rx="8"/>
  <text class="b" x="520" y="544" text-anchor="middle">RAG</text>
  <text x="520" y="560" text-anchor="middle">權限寫進 metadata</text>
  <path class="ln" d="M350.0,548.0 L410.0,548.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="538" text-anchor="middle">是</text>
  <path class="ln" d="M200.0,592.0 L200.0,616.0" marker-end="url(#a)"/>
  <text class="s" x="214" y="606" text-anchor="middle">否</text>
  <rect class="box" x="40.0" y="620.0" width="320" height="56" rx="8"/>
  <text class="b" x="200" y="644" text-anchor="middle">先從簡單做法開始</text>
  <text x="200" y="660" text-anchor="middle">提示詞與工作流；再用真實問題評估</text>
  <text class="s" x="320" y="726" text-anchor="middle">依本庫資料整理的建議；一份知識可以同時被多種機制使用，例如案件資料庫＋wiki</text>
</svg>
