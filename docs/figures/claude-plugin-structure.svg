<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="t d">
  <title id="t">公司內部 plugin 的目錄結構與各元件載入後的名稱</title>
  <desc id="d">plugin 根目錄下有 .claude-plugin/plugin.json、skills、agents、.mcp.json、hooks、scripts。只有 plugin.json 放在 .claude-plugin 裡，其他都放在根目錄。skill 載入後的指令是 /plugin名:目錄名，agent 是 @agent-plugin名:agent名，MCP server 顯示為 plugin:plugin名:server名，hook 在 plugin 載入後就在事件上觸發。根目錄的 CLAUDE.md 不會被載入。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="498.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">plugin 的目錄結構，與載入後的名稱</text>
  <rect class="box" x="12" y="44" width="316" height="440" rx="12"/>
  <text class="monob" x="24" y="68">acme-toolkit/</text>
  <text class="mono" x="24" y="94">├── .claude-plugin/</text>
  <text class="mono" x="24" y="122">│   └── plugin.json</text>
  <text class="mono" x="24" y="150">├── skills/</text>
  <text class="mono" x="24" y="178">│   ├── code-review/</text>
  <text class="mono" x="24" y="206">│   │   ├── SKILL.md</text>
  <text class="mono" x="24" y="234">│   │   └── checklist.md</text>
  <text class="mono" x="24" y="262">│   └── onboarding/SKILL.md</text>
  <text class="mono" x="24" y="290">├── agents/</text>
  <text class="mono" x="24" y="318">│   └── security-reviewer.md</text>
  <text class="mono" x="24" y="346">├── .mcp.json</text>
  <text class="mono" x="24" y="374">├── hooks/hooks.json</text>
  <text class="mono" x="24" y="402">├── scripts/</text>
  <text class="mono" x="24" y="430">└── CLAUDE.md  ✗</text>
  <rect class="box" x="340" y="72" width="288" height="48" rx="8"/>
  <text class="b" x="352" y="92">plugin.json</text>
  <text class="s" x="352" y="110">只有它放在 .claude-plugin/ 裡</text>
  <rect class="good" x="340" y="128" width="288" height="48" rx="8"/>
  <text class="b" x="352" y="148">skill</text>
  <text class="s" x="352" y="166">/acme-toolkit:code-review</text>
  <rect class="good" x="340" y="184" width="288" height="48" rx="8"/>
  <text class="b" x="352" y="204">agent</text>
  <text class="s" x="352" y="222">@agent-acme-toolkit:security-reviewer</text>
  <rect class="good" x="340" y="240" width="288" height="48" rx="8"/>
  <text class="b" x="352" y="260">MCP</text>
  <text class="s" x="352" y="278">plugin:acme-toolkit:kb（在 /mcp 顯示）</text>
  <rect class="acc" x="340" y="296" width="288" height="48" rx="8"/>
  <text class="b" x="352" y="316">hook</text>
  <text class="s" x="352" y="334">plugin 載入後就在事件上觸發</text>
  <rect class="bad" x="340" y="352" width="288" height="48" rx="8"/>
  <text class="b" x="352" y="372">CLAUDE.md</text>
  <text class="s" x="352" y="390">不會被載入；要放指示就寫成 skill</text>
  <text class="s" x="340" y="452">其他元件都放在 plugin 根目錄，</text>
  <text class="s" x="340" y="470">放進 .claude-plugin/ 裡不會載入</text>
</svg>
