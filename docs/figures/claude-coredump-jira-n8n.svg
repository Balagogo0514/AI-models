<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" role="img" aria-labelledby="t d">
  <title id="t">要不要用 n8n：兩條路徑並排</title>
  <desc id="d">左邊是不用 n8n，建議先做：Jira webhook 或 Automation 打你們的小 API，小 API 驗證去重並丟進佇列，worker 分析，服務直接呼叫 Jira REST 回寫並通知。右邊是用 n8n，之後再加：Jira 打 n8n 的 webhook 節點，n8n 驗證去重後呼叫你們的 orchestrator API，由它佇列與分析，最後由 n8n 回寫 Jira、通知與人工核准。下方是取捨：非工程師要調整通知與核准、已在用 n8n、沒人想維護接收端時用 n8n；已有 queue 與 worker 框架、dump 不能離開公司時不建議，要用就得自架。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="488.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">要不要用 n8n</text>
  <rect class="hd" x="12" y="44" width="300" height="28" rx="6"/>
  <text class="b" x="162" y="63" text-anchor="middle">不用 n8n（建議先做）</text>
  <rect class="hd" x="328" y="44" width="300" height="28" rx="6"/>
  <text class="b" x="478" y="63" text-anchor="middle">用 n8n（之後再加）</text>
  <rect class="good" x="22.0" y="92.0" width="280" height="52" rx="8"/>
  <text x="162" y="122" text-anchor="middle">Jira webhook／Automation</text>
  <rect class="acc" x="338.0" y="92.0" width="280" height="52" rx="8"/>
  <text x="478" y="122" text-anchor="middle">Jira webhook／Automation</text>
  <path class="ln" d="M162.0,144.0 L162.0,162.0" marker-end="url(#a)"/>
  <path class="ln" d="M478.0,144.0 L478.0,162.0" marker-end="url(#a)"/>
  <rect class="good" x="22.0" y="162.0" width="280" height="52" rx="8"/>
  <text class="b" x="162" y="184" text-anchor="middle">你們的小 API</text>
  <text x="162" y="200" text-anchor="middle">驗證、去重、丟佇列</text>
  <rect class="acc" x="338.0" y="162.0" width="280" height="52" rx="8"/>
  <text class="b" x="478" y="184" text-anchor="middle">n8n webhook 節點</text>
  <text x="478" y="200" text-anchor="middle">驗證、去重</text>
  <path class="ln" d="M162.0,214.0 L162.0,232.0" marker-end="url(#a)"/>
  <path class="ln" d="M478.0,214.0 L478.0,232.0" marker-end="url(#a)"/>
  <rect class="good" x="22.0" y="232.0" width="280" height="52" rx="8"/>
  <text class="b" x="162" y="254" text-anchor="middle">佇列＋worker</text>
  <text x="162" y="270" text-anchor="middle">分析</text>
  <rect class="acc" x="338.0" y="232.0" width="280" height="52" rx="8"/>
  <text class="b" x="478" y="254" text-anchor="middle">你們的 orchestrator API</text>
  <text x="478" y="270" text-anchor="middle">佇列＋worker 分析</text>
  <path class="ln" d="M162.0,284.0 L162.0,302.0" marker-end="url(#a)"/>
  <path class="ln" d="M478.0,284.0 L478.0,302.0" marker-end="url(#a)"/>
  <rect class="good" x="22.0" y="302.0" width="280" height="52" rx="8"/>
  <text class="b" x="162" y="324" text-anchor="middle">服務直接呼叫 Jira REST 回寫</text>
  <text x="162" y="340" text-anchor="middle">並通知 Slack／Teams</text>
  <rect class="acc" x="338.0" y="302.0" width="280" height="52" rx="8"/>
  <text class="b" x="478" y="324" text-anchor="middle">n8n：回寫 Jira、通知</text>
  <text x="478" y="340" text-anchor="middle">人工核准</text>
  <rect class="good" x="12" y="392" width="300" height="56" rx="8"/>
  <text x="22" y="412">不用 n8n 的時機</text>
  <text x="22" y="429">已有 queue 與 worker 框架</text>
  <rect class="acc" x="328" y="392" width="300" height="56" rx="8"/>
  <text x="338" y="412">用 n8n 的時機</text>
  <text x="338" y="429">非工程師要調通知與核准、已在用</text>
  <text class="s" x="320" y="472" text-anchor="middle">dump 不能離開公司：n8n 要自架，並計入維運成本</text>
</svg>
