<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="t d">
  <title id="t">六個降低成本的槓桿，依預期效果排序</title>
  <desc id="d">六個槓桿。一，去重與初篩：不呼叫模型，每命中一案省掉整筆模型費，效果最大。二，控制升級到深度分析的比例：深度層單價高，升級太多會比不用漏斗更貴。三，每層選對模型等級：Haiku 5.5 與 Sonnet 5.5 單價差約二十倍，用案例集比較成本與準確率。四，快取固定前綴：cache 讀取每百萬 token 二角，約為 Sonnet 5.5 輸入價的十分之一。五，裁切證據：輸入 token 與送給模型的案件摘要大小成正比。六，預算硬上限與 Task Budgets：擋住失控案件，Task Budgets 為 beta，細節未查證。排序是我的判斷。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="498.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">降低成本的槓桿（依預期效果排序）</text>
  <rect class="acc" x="12" y="44" width="210" height="60" rx="10"/>
  <text x="24" y="79.0">1 去重與初篩</text>
  <line class="ln" x1="222" y1="74.0" x2="248" y2="74.0" marker-end="url(#a)"/>
  <rect class="good" x="250" y="44" width="378" height="60" rx="10"/>
  <text class="b" x="262" y="68.0">效果最大</text>
  <text class="s" x="262" y="90.0">不呼叫模型；命中一案省掉整筆模型費</text>
  <rect class="acc" x="12" y="112" width="210" height="60" rx="10"/>
  <text x="24" y="147.0">2 控制升級比例</text>
  <line class="ln" x1="222" y1="142.0" x2="248" y2="142.0" marker-end="url(#a)"/>
  <rect class="good" x="250" y="112" width="378" height="60" rx="10"/>
  <text class="b" x="262" y="136.0">常被忽略</text>
  <text class="s" x="262" y="158.0">深度層單價高；升級太多會比不用漏斗更貴</text>
  <rect class="acc" x="12" y="180" width="210" height="60" rx="10"/>
  <text x="24" y="215.0">3 每層選對模型等級</text>
  <line class="ln" x1="222" y1="210.0" x2="248" y2="210.0" marker-end="url(#a)"/>
  <rect class="acc" x="250" y="180" width="378" height="60" rx="10"/>
  <text class="b" x="262" y="204.0">單價差約 20 倍</text>
  <text class="s" x="262" y="226.0">Haiku 5.5 對 Sonnet 5.5；用案例集比成本與準確率</text>
  <rect class="acc" x="12" y="248" width="210" height="60" rx="10"/>
  <text x="24" y="283.0">4 快取固定前綴</text>
  <line class="ln" x1="222" y1="278.0" x2="248" y2="278.0" marker-end="url(#a)"/>
  <rect class="acc" x="250" y="248" width="378" height="60" rx="10"/>
  <text class="b" x="262" y="272.0">固定部分約省九成</text>
  <text class="s" x="262" y="294.0">cache 讀取 $0.20，Sonnet 輸入 $2（每 1M）</text>
  <rect class="acc" x="12" y="316" width="210" height="60" rx="10"/>
  <text x="24" y="351.0">5 裁切證據</text>
  <line class="ln" x1="222" y1="346.0" x2="248" y2="346.0" marker-end="url(#a)"/>
  <rect class="box" x="250" y="316" width="378" height="60" rx="10"/>
  <text class="b" x="262" y="340.0">少送 token</text>
  <text class="s" x="262" y="362.0">輸入 token 與案件摘要大小成正比</text>
  <rect class="acc" x="12" y="384" width="210" height="60" rx="10"/>
  <text x="24" y="419.0">6 預算硬上限</text>
  <line class="ln" x1="222" y1="414.0" x2="248" y2="414.0" marker-end="url(#a)"/>
  <rect class="box" x="250" y="384" width="378" height="60" rx="10"/>
  <text class="b" x="262" y="408.0">擋住失控案件</text>
  <text class="s" x="262" y="430.0">每案上限；Task Budgets（beta）細節未查證</text>
  <text class="s" x="320" y="488" text-anchor="middle">排序是我的判斷，不是官方建議；效果大小取決於你們的案件分布</text>
</svg>
