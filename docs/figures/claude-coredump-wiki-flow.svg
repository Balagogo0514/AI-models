<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img" aria-labelledby="t d">
  <title id="t">worker 的流程：先查 wiki，命中就不呼叫模型</title>
  <desc id="d">worker 領到案件後，下載 core、用 gdb 取得 signal 與 backtrace，算出簽章，再查 wiki。命中三種狀態：unknown_cause、known_open、known_fixed，就直接回寫引用 wiki 的 comment，沒有呼叫模型。沒命中 miss，或已修復的版本又出現 regression，就由 Claude 分析，回寫報告，並把報告放進待審區，regression 時還會把 wiki 的備註交給模型。之後由人工核准，才寫進 wiki 並 commit。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="698.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">worker 流程（含 wiki）</text>
  <rect class="box" x="40.0" y="48.0" width="320" height="44" rx="8"/>
  <text class="b" x="200" y="74" text-anchor="middle">領取案件，下載 core</text>
  <path class="ln" d="M200.0,92.0 L200.0,120.0" marker-end="url(#a)"/>
  <rect class="good" x="40.0" y="122.0" width="320" height="56" rx="8"/>
  <text class="b" x="200" y="146" text-anchor="middle">gdb：signal ＋ extract_backtrace</text>
  <text x="200" y="162" text-anchor="middle">→ crashing_thread_frames → make_signature</text>
  <path class="ln" d="M200.0,178.0 L200.0,210.0" marker-end="url(#a)"/>
  <polygon class="acc" points="200,209.0 360.0,254 200,299.0 40.0,254"/>
  <text class="b" x="200" y="250" text-anchor="middle">lookup(簽章, 版本)</text>
  <text x="200" y="266" text-anchor="middle">狀態？</text>
  <rect class="good" x="410.0" y="214.0" width="220" height="80" rx="8"/>
  <text class="b" x="520" y="234" text-anchor="middle">known_open／known_fixed</text>
  <text x="520" y="250" text-anchor="middle">unknown_cause</text>
  <text x="520" y="266" text-anchor="middle">→ 引用 wiki 的 comment</text>
  <text x="520" y="282" text-anchor="middle">（沒有呼叫模型）</text>
  <path class="ln" d="M360.0,254.0 L410.0,254.0" marker-end="url(#a)"/>
  <text class="s" x="385" y="244" text-anchor="middle">命中</text>
  <path class="ln" d="M200.0,299.0 L200.0,340.0" marker-end="url(#a)"/>
  <text class="s" x="270" y="322" text-anchor="middle">miss／regression</text>
  <rect class="acc" x="40.0" y="352.0" width="320" height="56" rx="8"/>
  <text class="b" x="200" y="376" text-anchor="middle">analyze_case（Claude 工具迴圈）</text>
  <text x="200" y="392" text-anchor="middle">regression 時附上 wiki_note</text>
  <path class="ln" d="M200.0,408.0 L200.0,440.0" marker-end="url(#a)"/>
  <rect class="good" x="40.0" y="448.0" width="320" height="44" rx="8"/>
  <text class="b" x="200" y="474" text-anchor="middle">回寫報告 comment ＋ label</text>
  <path class="ln" d="M200.0,492.0 L200.0,520.0" marker-end="url(#a)"/>
  <rect class="bad" x="40.0" y="528.0" width="320" height="44" rx="8"/>
  <text class="b" x="200" y="554" text-anchor="middle">propose：放進 _pending（待審）</text>
  <path class="ln" d="M200.0,572.0 L200.0,600.0" marker-end="url(#a)"/>
  <rect class="acc" x="40.0" y="608.0" width="320" height="44" rx="8"/>
  <text class="b" x="200" y="634" text-anchor="middle">人工核准 → 寫進 wiki ＋ git commit</text>
  <path class="dash" d="M520.0,294.0 L520.0,470.0 L360.0,470.0" marker-end="url(#a)"/>
  <text class="s" x="560" y="380" text-anchor="middle">回寫</text>
  <text class="s" x="320" y="692" text-anchor="middle">命中時也回寫 Jira 並加 label；regression 不能當成已知問題帶過</text>
</svg>
