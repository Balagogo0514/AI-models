<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="t d">
  <title id="t">想強制時用哪個設定：目的、設定名稱與注意事項</title>
  <desc id="d">全公司都有同一套：managed settings 的 extraKnownMarketplaces 加 enabledPlugins，使用者無法覆蓋。只允許公司的 marketplace：strictKnownMarketplaces，搭配 disableSideloadFlags。不准專案或個人另外放 skill：strictPluginOnlyCustomization，可只鎖 skills，現有專案 skill 會失效。各部門不同設定：沒有依部門的單一開關，要把設定分別發給各群組。隱藏某個 skill：skillOverrides，但不影響 plugin 的 skill。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="498.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">想強制時用哪個設定？</text>
  <rect class="hd" x="12" y="44" width="616" height="28" rx="6"/>
  <text class="b" x="20" y="63">目的</text>
  <text class="b" x="176" y="63">設定</text>
  <text class="b" x="414" y="63">注意</text>
  <rect class="box" x="12" y="80" width="616" height="60" rx="6"/>
  <text class="b" x="20" y="116">全公司都有同一套</text>
  <text class="monob" x="176" y="106">extraKnownMarketplaces</text>
  <text class="monob" x="176" y="126">+ enabledPlugins</text>
  <text class="s" x="414" y="108">managed 層</text>
  <text class="s" x="414" y="126">使用者無法覆蓋</text>
  <rect class="box" x="12" y="146" width="616" height="60" rx="6"/>
  <text class="b" x="20" y="182">只允許公司的來源</text>
  <text class="monob" x="176" y="172">strictKnownMarketplaces</text>
  <text class="monob" x="176" y="192">+ disableSideloadFlags</text>
  <text class="s" x="414" y="174">漏列 skills-dir 會停用</text>
  <text class="s" x="414" y="192">目錄型 plugin</text>
  <rect class="bad" x="12" y="212" width="616" height="60" rx="6"/>
  <text class="b" x="20" y="248">不准另放專案 skill</text>
  <text class="monob" x="176" y="248">strictPluginOnlyCustomization</text>
  <text class="s" x="414" y="240">可只鎖 [&quot;skills&quot;]</text>
  <text class="s" x="414" y="258">現有專案 skill 會失效</text>
  <rect class="box" x="12" y="278" width="616" height="60" rx="6"/>
  <text class="b" x="20" y="314">各部門不同設定</text>
  <text class="monob" x="176" y="314">分別發給各群組</text>
  <text class="s" x="414" y="314">沒有依部門的單一開關</text>
  <rect class="box" x="12" y="344" width="616" height="60" rx="6"/>
  <text class="b" x="20" y="380">隱藏某個 skill</text>
  <text class="monob" x="176" y="380">skillOverrides</text>
  <text class="s" x="414" y="380">不影響 plugin 的 skill</text>
  <rect class="box" x="12" y="410" width="616" height="60" rx="6"/>
  <text class="b" x="20" y="446">封鎖特定 plugin</text>
  <text class="monob" x="176" y="446">enabledPlugins: false</text>
  <text class="s" x="414" y="438">managed 層</text>
  <text class="s" x="414" y="456">所有 scope 都擋</text>
  <text class="s" x="320" y="490" text-anchor="middle">這些都是官方 managed／settings 設定；強制條款會影響所有人，先與各部門溝通</text>
</svg>
