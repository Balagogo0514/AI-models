<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d">
  <title id="t">閘門 2 之後怎麼走：達標看規模，未達標查失敗模式</title>
  <desc id="d">階段 2 評測結果先問：準確率與成本達標嗎？不達標：分析失敗模式，常見失敗與對策是證據不足就補工具，例如 inspect_frame；判斷錯就改 prompt 或模型等級；案例本身不可行就記錄並排除；修正後重跑評測。達標：再問每日案件量大嗎？不大，就用薄服務加現有 worker 即可，見 Claude-Coredump-Agent 第 9.3 節。大，就加去重、佇列與深度升級，見該文件第 10 節的階段三與四。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="518.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">閘門 2 之後怎麼走</text>
  <rect class="box" x="70.0" y="48.0" width="260" height="40" rx="8"/>
  <text class="b" x="200" y="72" text-anchor="middle">階段 2 評測結果</text>
  <path class="ln" d="M200.0,88.0 L200.0,108.0" marker-end="url(#a)"/>
  <polygon class="acc" points="200,108.0 340.0,150 200,192.0 60.0,150"/>
  <text class="b" x="200" y="154" text-anchor="middle">準確率與成本達標？</text>
  <rect class="bad" x="420.0" y="88.0" width="200" height="124" rx="8"/>
  <text class="b" x="520" y="122" text-anchor="middle">常見失敗與對策</text>
  <text x="520" y="138" text-anchor="middle">證據不足 → 補工具</text>
  <text x="520" y="154" text-anchor="middle">判斷錯 → 改 prompt／模型</text>
  <text x="520" y="170" text-anchor="middle">案例不可行 → 記錄排除</text>
  <text x="520" y="186" text-anchor="middle">修正後重跑評測</text>
  <path class="ln" d="M340.0,150.0 L420.0,150.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="140" text-anchor="middle">否</text>
  <path class="ln" d="M200.0,192.0 L200.0,226.0" marker-end="url(#a)"/>
  <text class="s" x="212" y="214" text-anchor="middle">是</text>
  <polygon class="acc" points="200,226.0 340.0,268 200,310.0 60.0,268"/>
  <text class="b" x="200" y="272" text-anchor="middle">每日案件量大？</text>
  <rect class="good" x="420.0" y="232.0" width="200" height="72" rx="8"/>
  <text class="b" x="520" y="256" text-anchor="middle">薄服務＋現有 worker</text>
  <text x="520" y="272" text-anchor="middle">（Claude-Coredump-Agent</text>
  <text x="520" y="288" text-anchor="middle">第 9.3 節）</text>
  <path class="ln" d="M340.0,268.0 L420.0,268.0" marker-end="url(#a)"/>
  <text class="s" x="380" y="258" text-anchor="middle">否</text>
  <path class="ln" d="M200.0,310.0 L200.0,350.0" marker-end="url(#a)"/>
  <text class="s" x="212" y="336" text-anchor="middle">是</text>
  <rect class="good" x="50.0" y="356.0" width="300" height="64" rx="8"/>
  <text class="b" x="200" y="376" text-anchor="middle">加去重、佇列、深度升級</text>
  <text x="200" y="392" text-anchor="middle">（Claude-Coredump-Agent</text>
  <text x="200" y="408" text-anchor="middle">第 10 節 階段 3–4）</text>
  <text class="s" x="320" y="468" text-anchor="middle">「量大」沒有固定門檻；請用你們的每日 core 數與值班負擔判斷</text>
  <text class="s" x="320" y="490" text-anchor="middle">未達標不代表不可行：先看失敗模式，多半是證據或 prompt 的問題</text>
</svg>
