<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="t d">
  <title id="t">Codex session 的生命週期：新建、resume 接續、fork 分叉、archive 封存</title>
  <desc id="d">codex 開新 session。codex resume 接續先前的 session，可用 --last 取最近一次、指定 session ID，或 --all 顯示所有 session。codex fork 從既有 session 分叉成新 session。codex archive 封存 session，codex unarchive 還原。codex exec resume 用在非互動執行，會延續先前 session。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="428.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">session 的生命週期</text>
  <rect class="good" x="240" y="44" width="160" height="56" rx="10"/>
  <text class="monob" x="320" y="70" text-anchor="middle">codex</text>
  <text class="s" x="320" y="88" text-anchor="middle">開新 session</text>
  <line class="ln" x1="320" y1="101" x2="320" y2="130" marker-end="url(#a)"/>
  <rect class="acc" x="220" y="132" width="200" height="64" rx="10"/>
  <text class="b" x="320" y="158" text-anchor="middle">既有 session</text>
  <text class="s" x="320" y="180" text-anchor="middle">存在 $CODEX_HOME</text>
  <line class="ln" x1="222" y1="164" x2="120" y2="230" marker-end="url(#a)"/>
  <line class="ln" x1="418" y1="164" x2="520" y2="230" marker-end="url(#a)"/>
  <rect class="box" x="12" y="232" width="200" height="92" rx="10"/>
  <text class="monob" x="24" y="256">codex resume</text>
  <text x="24" y="278">接續同一個 session</text>
  <text class="s" x="24" y="298">--last｜指定 ID｜--all</text>
  <rect class="box" x="428" y="232" width="200" height="92" rx="10"/>
  <text class="monob" x="440" y="256">codex fork</text>
  <text x="440" y="278">分叉成新 session</text>
  <text class="s" x="440" y="298">--last｜--all</text>
  <line class="ln" x1="320" y1="197" x2="320" y2="338" marker-end="url(#a)"/>
  <rect class="dash" x="220" y="340" width="200" height="64" rx="8"/>
  <text class="mono" x="320" y="364" text-anchor="middle">codex archive</text>
  <text class="s" x="320" y="386" text-anchor="middle">↔ unarchive：封存與還原</text>
  <text class="s" x="112" y="340" text-anchor="middle">非互動：</text>
  <text class="mono" x="112" y="358" text-anchor="middle">codex exec resume</text>
</svg>
