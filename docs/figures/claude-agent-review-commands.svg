<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d">
  <title id="t">依情境選 review 指令：快速看、重大變更、只擔心安全、整理程式碼、自動修、PR 全自動審</title>
  <desc id="d">開發途中快速看一下用 code-review 或 review。合併前重大變更用 code-review ultra。只擔心安全用 security-review。想整理程式碼而不是找 bug 用 simplify。要自動修用 code-review 加 fix 或 autofix-pr。PR 要全自動審用 GitHub App，留言 at claude review。這些依 Claude-Code-CLI 文件整理，尚未逐一實際執行驗證。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="518.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">依情境選 review 指令</text>
  <rect class="acc" x="12" y="44" width="270" height="64" rx="10"/>
  <text x="24" y="81.0">開發途中快速看一下</text>
  <line class="ln" x1="282" y1="76.0" x2="316" y2="76.0" marker-end="url(#a)"/>
  <rect class="box" x="318" y="44" width="310" height="64" rx="10"/>
  <text class="b" x="330" y="70.0">/code-review（可加 level）或 /review</text>
  <text class="s" x="330" y="92.0">單次審查，計入一般用量</text>
  <rect class="acc" x="12" y="116" width="270" height="64" rx="10"/>
  <text x="24" y="153.0">合併前重大變更</text>
  <line class="ln" x1="282" y1="148.0" x2="316" y2="148.0" marker-end="url(#a)"/>
  <rect class="bad" x="318" y="116" width="310" height="64" rx="10"/>
  <text class="b" x="330" y="142.0">/code-review ultra</text>
  <text class="s" x="330" y="164.0">雲端多 agent 深度審查</text>
  <rect class="acc" x="12" y="188" width="270" height="64" rx="10"/>
  <text x="24" y="225.0">只擔心安全</text>
  <line class="ln" x1="282" y1="220.0" x2="316" y2="220.0" marker-end="url(#a)"/>
  <rect class="acc" x="318" y="188" width="310" height="64" rx="10"/>
  <text class="b" x="330" y="214.0">/security-review</text>
  <text class="s" x="330" y="236.0">專攻安全，不是通用 review</text>
  <rect class="acc" x="12" y="260" width="270" height="64" rx="10"/>
  <text x="24" y="297.0">想整理程式碼、不找 bug</text>
  <line class="ln" x1="282" y1="292.0" x2="316" y2="292.0" marker-end="url(#a)"/>
  <rect class="acc" x="318" y="260" width="310" height="64" rx="10"/>
  <text class="b" x="330" y="286.0">/simplify</text>
  <text class="s" x="330" y="308.0">reuse、簡化、效率；不找 bug</text>
  <rect class="acc" x="12" y="332" width="270" height="64" rx="10"/>
  <text x="24" y="369.0">要自動修</text>
  <line class="ln" x1="282" y1="364.0" x2="316" y2="364.0" marker-end="url(#a)"/>
  <rect class="acc" x="318" y="332" width="310" height="64" rx="10"/>
  <text class="b" x="330" y="358.0">/code-review --fix／/autofix-pr</text>
  <text class="s" x="330" y="380.0">偏「修」而非「審」</text>
  <rect class="acc" x="12" y="404" width="270" height="64" rx="10"/>
  <text x="24" y="441.0">PR 要全自動審</text>
  <line class="ln" x1="282" y1="436.0" x2="316" y2="436.0" marker-end="url(#a)"/>
  <rect class="good" x="318" y="404" width="310" height="64" rx="10"/>
  <text class="b" x="330" y="430.0">GitHub App：@claude review</text>
  <text class="s" x="330" y="452.0">Team／Enterprise；PR 頂層留言觸發</text>
  <text class="s" x="320" y="498" text-anchor="middle">依 Claude-Code-CLI 的記載整理，尚未逐一實際執行驗證</text>
</svg>
