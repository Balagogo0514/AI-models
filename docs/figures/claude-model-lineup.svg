<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="t d">
  <title id="t">Claude 現行模型的價格與情境窗口：每 1M tokens 輸入與輸出單價</title>
  <desc id="d">七列依價格由高到低：Fable 5.1 與 Fable 5（Mythos 5.1 同價，僅限 Project Glasswing）輸入 10 美元、輸出 50 美元；Opus 5、4.8、4.7、4.6 輸入 5、輸出 25；Opus 5.5 輸入 4、輸出 20，是目前建議的預設模型；Sonnet 4.6 輸入 3、輸出 15；Sonnet 5.5 與 5 輸入 2、輸出 10；Haiku 4.5 輸入 1、輸出 5，情境 200K、最大輸出 64K；Haiku 5.5 輸入 0.10、輸出 0.50，prompt 超過 100K 為 0.50 與 2.50。除 Haiku 4.5 外皆為 1M 情境與 128K 輸出。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="498.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">現行模型：價格（每 1M tokens）與情境窗口</text>
  <rect class="hd" x="12" y="44" width="616" height="26" rx="6"/>
  <text class="b" x="20" y="62">模型</text>
  <text class="b" x="184" y="62">情境／輸出</text>
  <text class="b" x="270" y="62">輸入（淡）／輸出（深）單價 USD</text>
  <rect class="box" x="12" y="76" width="616" height="46" rx="8"/>
  <text class="b" x="20" y="96">Fable 5.1／5</text>
  <text class="s" x="20" y="113">Mythos 5.1 同價</text>
  <text class="mono" x="184" y="104">1M／128K</text>
  <rect class="bin" x="270" y="84" width="52.0" height="12" rx="2"/>
  <rect class="bout" x="270" y="102" width="260.0" height="12" rx="2"/>
  <text class="s" x="328.0" y="95">$10</text>
  <text class="s" x="536.0" y="113">$50</text>
  <rect class="good" x="12" y="128" width="616" height="46" rx="8"/>
  <text class="b" x="20" y="148">Opus 5.5</text>
  <text class="s" x="20" y="165">目前建議的預設模型</text>
  <text class="mono" x="184" y="156">1M／128K</text>
  <rect class="bin" x="270" y="136" width="20.8" height="12" rx="2"/>
  <rect class="bout" x="270" y="154" width="104.0" height="12" rx="2"/>
  <text class="s" x="296.8" y="147">$4</text>
  <text class="s" x="380.0" y="165">$20</text>
  <rect class="box" x="12" y="180" width="616" height="46" rx="8"/>
  <text class="b" x="20" y="208">Opus 5／4.8／4.7／4.6</text>
  <text class="mono" x="184" y="208">1M／128K</text>
  <rect class="bin" x="270" y="188" width="26.0" height="12" rx="2"/>
  <rect class="bout" x="270" y="206" width="130.0" height="12" rx="2"/>
  <text class="s" x="302.0" y="199">$5</text>
  <text class="s" x="406.0" y="217">$25</text>
  <rect class="box" x="12" y="232" width="616" height="46" rx="8"/>
  <text class="b" x="20" y="252">Sonnet 5.5／5</text>
  <text class="s" x="20" y="269">性價比選項</text>
  <text class="mono" x="184" y="260">1M／128K</text>
  <rect class="bin" x="270" y="240" width="10.4" height="12" rx="2"/>
  <rect class="bout" x="270" y="258" width="52.0" height="12" rx="2"/>
  <text class="s" x="286.4" y="251">$2</text>
  <text class="s" x="328.0" y="269">$10</text>
  <rect class="box" x="12" y="284" width="616" height="46" rx="8"/>
  <text class="b" x="20" y="312">Sonnet 4.6</text>
  <text class="mono" x="184" y="312">1M／128K</text>
  <rect class="bin" x="270" y="292" width="15.6" height="12" rx="2"/>
  <rect class="bout" x="270" y="310" width="78.0" height="12" rx="2"/>
  <text class="s" x="291.6" y="303">$3</text>
  <text class="s" x="354.0" y="321">$15</text>
  <rect class="box" x="12" y="336" width="616" height="46" rx="8"/>
  <text class="b" x="20" y="356">Haiku 5.5</text>
  <text class="s" x="20" y="373">prompt 超過 100K：0.50／2.50</text>
  <text class="mono" x="184" y="364">1M／128K</text>
  <rect class="bin" x="270" y="344" width="2.0" height="12" rx="2"/>
  <rect class="bout" x="270" y="362" width="2.6" height="12" rx="2"/>
  <text class="s" x="278" y="355">$0.10</text>
  <text class="s" x="278.6" y="373">$0.50</text>
  <rect class="bad" x="12" y="388" width="616" height="46" rx="8"/>
  <text class="b" x="20" y="416">Haiku 4.5</text>
  <text class="mono" x="184" y="416">200K／64K</text>
  <rect class="bin" x="270" y="396" width="5.2" height="12" rx="2"/>
  <rect class="bout" x="270" y="414" width="26.0" height="12" rx="2"/>
  <text class="s" x="281.2" y="407">$1</text>
  <text class="s" x="302.0" y="425">$5</text>
  <text class="s" x="320" y="458" text-anchor="middle">除 Haiku 4.5 外，現行模型皆為 1M 情境與 128K 最大輸出</text>
  <text class="s" x="320" y="478" text-anchor="middle">資料快取於 2026-10-06；價格會變動，實際以官方定價頁為準</text>
</svg>
