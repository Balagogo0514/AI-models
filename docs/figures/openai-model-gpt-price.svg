  <rect class="good" x="12" y="160" width="616" height="38" rx="8"/>
  <text class="monob" x="20" y="176">gpt-5.6-luna</text>
  <text class="s" x="20" y="191">成本優先</text>
  <rect class="bin" x="172" y="166" width="2.0" height="10" rx="2"/>
  <rect class="bout" x="172" y="181" width="12.0" height="10" rx="2"/>
  <text class="s" x="180.0" y="175">$1</text>
  <text class="s" x="190.0" y="190">$6</text>
  <rect class="box" x="12" y="202" width="616" height="38" rx="8"/>
  <text class="monob" x="20" y="218">gpt-5.5</text>
  <text class="s" x="20" y="233">舊一代高階</text>
  <rect class="bin" x="172" y="208" width="10.0" height="10" rx="2"/>
  <rect class="bout" x="172" y="223" width="60.0" height="10" rx="2"/>
  <text class="s" x="188.0" y="217">$5</text>
  <text class="s" x="238.0" y="232">$30</text>
  <rect class="bad" x="12" y="244" width="616" height="38" rx="8"/>
  <text class="monob" x="20" y="260">gpt-5.5-pro</text>
  <text class="s" x="20" y="275">很昂貴</text>
  <rect class="bin" x="172" y="250" width="60.0" height="10" rx="2"/>
  <rect class="bout" x="172" y="265" width="360.0" height="10" rx="2"/>
  <text class="s" x="238.0" y="259">$30</text>
  <text class="s" x="538.0" y="274">$180</text>
  <rect class="box" x="12" y="286" width="616" height="38" rx="8"/>
  <text class="monob" x="20" y="302">gpt-5.4</text>
  <text class="s" x="20" y="317">較低成本選項</text>
  <rect class="bin" x="172" y="292" width="5.0" height="10" rx="2"/>
