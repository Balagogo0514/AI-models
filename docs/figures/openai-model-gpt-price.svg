  <text class="s" x="183.0" y="301">$2.5</text>
  <text class="s" x="208.0" y="316">$15</text>
  <rect class="box" x="12" y="328" width="616" height="38" rx="8"/>
  <text class="monob" x="20" y="344">gpt-5.4-mini</text>
  <text class="s" x="20" y="359">輕量推理</text>
  <rect class="bin" x="172" y="334" width="2.0" height="10" rx="2"/>
  <rect class="bout" x="172" y="349" width="9.0" height="10" rx="2"/>
  <text class="s" x="180" y="343">$0.75</text>
  <text class="s" x="187.0" y="358">$4.5</text>
  <rect class="box" x="12" y="370" width="616" height="38" rx="8"/>
  <text class="monob" x="20" y="386">gpt-5.4-nano</text>
  <text class="s" x="20" y="401">分類、抽取</text>
  <rect class="bin" x="172" y="376" width="2.0" height="10" rx="2"/>
  <rect class="bout" x="172" y="391" width="2.5" height="10" rx="2"/>
  <text class="s" x="180" y="385">$0.20</text>
  <text class="s" x="180.5" y="400">$1.25</text>
  <rect class="bad" x="12" y="412" width="616" height="38" rx="8"/>
  <text class="monob" x="20" y="428">gpt-5.4-pro</text>
  <text class="s" x="20" y="443">舊代高價位</text>
  <rect class="bin" x="172" y="418" width="60.0" height="10" rx="2"/>
  <rect class="bout" x="172" y="433" width="360.0" height="10" rx="2"/>
  <text class="s" x="238.0" y="427">$30</text>
  <text class="s" x="538.0" y="442">$180</text>
  <text class="s" x="320" y="472" text-anchor="middle">gpt-5.6 三個型號皆為 1.05M 情境、128K 最大輸出</text>
  <text class="s" x="320" y="492" text-anchor="middle">gpt-5.6-terra 約為 gpt-5.5 價格的一半（$2.50／$15 對 $5／$30）</text>
  <text class="s" x="320" y="510" text-anchor="middle">資料日期 2026-07-12；short／long context 另有定價欄，請核對官方 pricing 頁</text>
</svg>
