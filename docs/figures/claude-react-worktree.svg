<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="t d">
  <title id="t">平行開發：worktree 與 batch，以及 Codex 要自己建</title>
  <desc id="d">主 checkout 是你的專案目錄，你在這裡自己跑 yarn start。用 claude --worktree 加名稱，會在 .claude/worktrees 底下建立隔離的工作目錄，例如 feature-a 與 feature-b。每個 worktree 有自己的分支與檔案，node_modules 不會跟著來要自己安裝，同時開 dev server 要換 port，.env 要靠 .worktreeinclude 複製。batch 把大型改動拆成 5 到 30 個獨立單元，各在隔離的 worktree 由背景 subagent 執行、跑測試、開 PR，需要 git repository，要先確認它拆出的計畫。Codex 沒有內建的 per-subagent worktree，也沒有已驗證的 batch 對應，要自己用 git worktree add 建立，再用 codex 的 -C 指向它。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="558.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">worktree 與 /batch</text>
  <rect class="box" x="120.0" y="46.0" width="400" height="72" rx="8"/>
  <text class="b" x="320" y="70" text-anchor="middle">你的專案目錄（主 checkout）</text>
  <text x="320" y="86" text-anchor="middle">你在這裡自己跑 yarn start</text>
  <text x="320" y="102" text-anchor="middle">建 worktree：claude --worktree &lt;名稱&gt;</text>
  <path class="ln" d="M320.0,118.0 L320.0,134.0 L165.0,134.0 L165.0,152.0" marker-end="url(#a)"/>
  <rect class="acc" x="20" y="152" width="290" height="150" rx="10"/>
  <text class="b" x="165" y="176" text-anchor="middle">worktree：feature-a</text>
  <text class="s" x="165" y="194" text-anchor="middle">.claude/worktrees/feature-a/</text>
  <text x="33" y="220">• 自己的分支與檔案，不互踩</text>
  <text x="33" y="239">• node_modules 不跟著來：自己 yarn install</text>
  <text x="33" y="258">• 同時開 dev server 要換 port</text>
  <text x="33" y="277">• .env 靠 .worktreeinclude 複製</text>
  <path class="ln" d="M320.0,118.0 L320.0,134.0 L475.0,134.0 L475.0,152.0" marker-end="url(#a)"/>
  <rect class="acc" x="330" y="152" width="290" height="150" rx="10"/>
  <text class="b" x="475" y="176" text-anchor="middle">worktree：feature-b</text>
  <text class="s" x="475" y="194" text-anchor="middle">.claude/worktrees/feature-b/</text>
  <text x="343" y="220">• 自己的分支與檔案，不互踩</text>
  <text x="343" y="239">• node_modules 不跟著來：自己 yarn install</text>
  <text x="343" y="258">• 同時開 dev server 要換 port</text>
  <text x="343" y="277">• .env 靠 .worktreeinclude 複製</text>
  <rect class="good" x="30.0" y="330.0" width="580" height="92" rx="8"/>
  <text class="b" x="320" y="364" text-anchor="middle">/batch：大規模、機械性的改動</text>
  <text x="320" y="380" text-anchor="middle">拆成 5 到 30 個獨立單元，各在隔離的 worktree 由背景 subagent 執行</text>
  <text x="320" y="396" text-anchor="middle">跑測試、開 PR；需要 git repository，先確認它拆出的計畫</text>
  <path class="dash" d="M165.0,330.0 L165.0,302.0" marker-end="url(#a)"/>
  <path class="dash" d="M475.0,330.0 L475.0,302.0" marker-end="url(#a)"/>
  <rect class="bad" x="30.0" y="445.0" width="580" height="66" rx="8"/>
  <text class="b" x="320" y="474" text-anchor="middle">Codex：沒有內建的 per-subagent worktree，也沒有已驗證的 /batch 對應</text>
  <text x="320" y="490" text-anchor="middle">自己建：git worktree add ../app-b -b feature-b，再 codex -C ../app-b</text>
  <text class="s" x="320" y="538" text-anchor="middle">worktree、.worktreeinclude、/batch 為官方；node_modules 與 port 的提醒是建議</text>
</svg>
