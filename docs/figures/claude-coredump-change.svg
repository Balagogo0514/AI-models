<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
  <title id="t">什麼情況下，結論會改變</title>
  <desc id="d">五種情況。每天 core 很少、只有人在看：claude -p 的 CI 腳本就夠，不必自建 orchestrator。團隊已熟 LangGraph：可用它取代自寫狀態機，但預算與安全限制仍要在工具層強制。dump 不能離開公司：先決定模型來源，這會影響整個選型。需要託管與長時間排程：再評估 Managed Agents，並重新評估資料外送。分析後的子流程變多：加入 Agent SDK，只做協作流程，不取代控制層。以上都是建議。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="418.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">如果…… → 結論會變成</text>
  <rect class="acc" x="12" y="44" width="250" height="62" rx="10"/>
  <text x="24" y="80.0">每天 core 很少、只有人在看</text>
  <line class="ln" x1="262" y1="75.0" x2="296" y2="75.0" marker-end="url(#a)"/>
  <rect class="box" x="298" y="44" width="330" height="62" rx="10"/>
  <text class="b" x="310" y="69.0">claude -p 的 CI 腳本就夠</text>
  <text class="s" x="310" y="91.0">不必自建 orchestrator</text>
  <rect class="acc" x="12" y="114" width="250" height="62" rx="10"/>
  <text x="24" y="150.0">團隊已熟 LangGraph</text>
  <line class="ln" x1="262" y1="145.0" x2="296" y2="145.0" marker-end="url(#a)"/>
  <rect class="box" x="298" y="114" width="330" height="62" rx="10"/>
  <text class="b" x="310" y="139.0">可用它取代自寫狀態機</text>
  <text class="s" x="310" y="161.0">預算與安全限制仍要在工具層強制</text>
  <rect class="acc" x="12" y="184" width="250" height="62" rx="10"/>
  <text x="24" y="220.0">dump 不能離開公司</text>
  <line class="ln" x1="262" y1="215.0" x2="296" y2="215.0" marker-end="url(#a)"/>
  <rect class="bad" x="298" y="184" width="330" height="62" rx="10"/>
  <text class="b" x="310" y="209.0">先決定模型來源</text>
  <text class="s" x="310" y="231.0">這會影響整個選型</text>
  <rect class="acc" x="12" y="254" width="250" height="62" rx="10"/>
  <text x="24" y="290.0">需要託管、長時間排程</text>
  <line class="ln" x1="262" y1="285.0" x2="296" y2="285.0" marker-end="url(#a)"/>
  <rect class="box" x="298" y="254" width="330" height="62" rx="10"/>
  <text class="b" x="310" y="279.0">再評估 Managed Agents</text>
  <text class="s" x="310" y="301.0">要重新評估資料外送</text>
  <rect class="acc" x="12" y="324" width="250" height="62" rx="10"/>
  <text x="24" y="360.0">分析後的子流程變多</text>
  <line class="ln" x1="262" y1="355.0" x2="296" y2="355.0" marker-end="url(#a)"/>
  <rect class="box" x="298" y="324" width="330" height="62" rx="10"/>
  <text class="b" x="310" y="349.0">加入 Agent SDK</text>
  <text class="s" x="310" y="371.0">只做協作流程，不取代控制層</text>
  <text class="s" x="320" y="406" text-anchor="middle">以上都是我的建議，不是官方結論</text>
</svg>
