<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="t d">
  <title id="t">Codex 的 code review 入口：本機單次、subagents、Codex Cloud、多個 codex exec、GitHub at codex review</title>
  <desc id="d">本機單次審查用 slash review 或 codex review，單次審查，開發途中快速回饋。Subagents 在同一 session 內分檔唯讀並行審，只有明確要求才會 spawn。Codex Cloud 並行提交多個獨立耗時的審查任務，之後用 cloud diff 與 apply 取回。多個 codex exec 由你的腳本平行，適合接 CI 與精確控制。GitHub 端在 PR 留言 at codex review，標 P0 與 P1。Codex 沒有已驗證的一鍵雲端多 reviewer 加獨立驗證指令。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="558.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">Codex 的 review 入口</text>
  <rect class="box" x="12" y="44" width="616" height="72" rx="10"/>
  <text class="b" x="24" y="72">3.1 本機單次：/review、codex review ✅</text>
  <text class="s" x="24" y="98">開發途中快速回饋；--uncommitted、--base、--commit 或 prompt 指定焦點</text>
  <rect class="good" x="12" y="126" width="616" height="72" rx="10"/>
  <text class="b" x="24" y="154">3.2 Subagents 🔎</text>
  <text class="s" x="24" y="180">同一 session 內分檔唯讀並行審；要明確要求才 spawn；/agent 管理</text>
  <rect class="good" x="12" y="208" width="616" height="72" rx="10"/>
  <text class="b" x="24" y="236">3.3 Codex Cloud ✅</text>
  <text class="s" x="24" y="262">多個獨立耗時審查，提交後不用盯；cloud diff／apply 取回（experimental）</text>
  <rect class="acc" x="12" y="290" width="616" height="72" rx="10"/>
  <text class="b" x="24" y="318">3.4 多個 codex exec ✅</text>
  <text class="s" x="24" y="344">你的腳本平行；--sandbox read-only、-a never、-o 寫檔；適合接 CI</text>
  <rect class="bad" x="12" y="372" width="616" height="72" rx="10"/>
  <text class="b" x="24" y="400">3.5 GitHub @codex review 🔎</text>
  <text class="s" x="24" y="426">PR 頂層留言；標 P0／P1；需 Codex cloud 設定</text>
  <rect class="dash" x="12" y="458" width="616" height="90" rx="8"/>
  <text class="b" x="24" y="482">Codex 沒有已驗證的「一鍵雲端多 reviewer ＋ 獨立驗證每個 finding」指令 ⚠️</text>
  <text class="s" x="24" y="506">要多 agent 審查，得自己用 3.2–3.4 組合；也沒有內建的 /security-review</text>
  <text class="s" x="24" y="526">用 prompt 指定焦點（安全、相容性）達到類似效果</text>
</svg>
