<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 612" role="img" aria-labelledby="t d">
  <title id="t">coredump 自動分析的整體流程：每一步由誰負責</title>
  <desc id="d">六個步驟由上到下。一，coredump 或 CI 事件觸發，由 n8n 或 CI 負責。二，佇列、artifact storage 與 fingerprint 去重，由你們的 Python 程式負責，命中既有分析就不呼叫模型。三，Python orchestrator 管預算、狀態、權限與重試。四，Claude Messages API 加受控工具，由模型與工具負責。五，結構化報告用 schema 驗證，由 Python 負責。六，人工審核、建立 Issue 與通知，由 n8n 與人負責。顏色代表負責者：藍色是 n8n 與人，綠色是你們的 Python 程式，白色是模型與工具。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="610.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">整體流程：誰負責哪一步</text>
  <rect class="acc" x="80.0" y="44.0" width="380" height="64" rx="8"/>
  <text class="b" x="270" y="72" text-anchor="middle">1 coredump／CI 事件</text>
  <text x="270" y="88" text-anchor="middle">觸發分析</text>
  <rect class="acc" x="478.0" y="56.0" width="140" height="40" rx="8"/>
  <text x="548" y="80" text-anchor="middle">n8n 或 CI</text>
  <path class="ln" d="M270.0,108.0 L270.0,132.0" marker-end="url(#a)"/>
  <rect class="good" x="80.0" y="132.0" width="380" height="64" rx="8"/>
  <text class="b" x="270" y="160" text-anchor="middle">2 佇列、artifact、fingerprint 去重</text>
  <text x="270" y="176" text-anchor="middle">命中既有分析 → 不呼叫模型</text>
  <rect class="good" x="478.0" y="144.0" width="140" height="40" rx="8"/>
  <text x="548" y="168" text-anchor="middle">你們的 Python</text>
  <path class="ln" d="M270.0,196.0 L270.0,220.0" marker-end="url(#a)"/>
  <rect class="good" x="80.0" y="220.0" width="380" height="64" rx="8"/>
  <text class="b" x="270" y="248" text-anchor="middle">3 orchestrator</text>
  <text x="270" y="264" text-anchor="middle">預算、狀態、權限、重試</text>
  <rect class="good" x="478.0" y="232.0" width="140" height="40" rx="8"/>
  <text x="548" y="256" text-anchor="middle">你們的 Python</text>
  <path class="ln" d="M270.0,284.0 L270.0,308.0" marker-end="url(#a)"/>
  <rect class="box" x="80.0" y="308.0" width="380" height="64" rx="8"/>
  <text class="b" x="270" y="336" text-anchor="middle">4 Claude Messages API ＋ 受控工具</text>
  <text x="270" y="352" text-anchor="middle">規劃、選工具、判讀證據</text>
  <rect class="box" x="478.0" y="320.0" width="140" height="40" rx="8"/>
  <text x="548" y="344" text-anchor="middle">模型與工具</text>
  <path class="ln" d="M270.0,372.0 L270.0,396.0" marker-end="url(#a)"/>
  <rect class="good" x="80.0" y="396.0" width="380" height="64" rx="8"/>
  <text class="b" x="270" y="424" text-anchor="middle">5 結構化報告</text>
  <text x="270" y="440" text-anchor="middle">用 schema 驗證；區分事實與假設</text>
  <rect class="good" x="478.0" y="408.0" width="140" height="40" rx="8"/>
  <text x="548" y="432" text-anchor="middle">你們的 Python</text>
  <path class="ln" d="M270.0,460.0 L270.0,484.0" marker-end="url(#a)"/>
  <rect class="acc" x="80.0" y="484.0" width="380" height="64" rx="8"/>
  <text class="b" x="270" y="512" text-anchor="middle">6 人工審核／建 Issue／通知</text>
  <text x="270" y="528" text-anchor="middle">高風險動作要人核准</text>
  <rect class="acc" x="478.0" y="496.0" width="140" height="40" rx="8"/>
  <text x="548" y="520" text-anchor="middle">n8n 與人</text>
  <text class="s" x="320" y="590" text-anchor="middle">藍：n8n 與人　綠：你們的 Python 程式　白：模型與工具</text>
</svg>
