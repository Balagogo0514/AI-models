<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="t d">
  <title id="t">知識回饋整理的流程：從回饋到寫回、驗證與結案</title>
  <desc id="d">八個步驟由上到下。一，收集：使用者回饋、查無結果、issue 結案、引用到過時內容、維護流程的發現，程式負責收集與去重。二，分類：答案錯、知識缺、知識過時、權限問題、使用者誤解。三，路由給負責人。四，草稿：由 AI 或程式產生。五，人工審核：確認回饋屬實、決定怎麼改，這一步不能省；駁回就結案並記錄原因。六，寫回：留痕，記錄版本、狀態、最後確認日期、來源回饋與 log。七，驗證：用評測集回歸，變差就退回。八，結案：通知提供回饋的人。這是設計建議，沒有實作或驗證過。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="638.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">知識回饋整理流程</text>
  <rect class="box" x="12" y="46" width="340" height="52" rx="10"/>
  <text class="b" x="26" y="68">1 收集</text>
  <text class="s" x="26" y="88">回饋、查無結果、issue 結案、過時引用、維護發現；去重</text>
  <path class="ln" d="M182.0,98.0 L182.0,112.0" marker-end="url(#a)"/>
  <rect class="box" x="12" y="112" width="340" height="52" rx="10"/>
  <text class="b" x="26" y="134">2 分類</text>
  <text class="s" x="26" y="154">答案錯／知識缺／知識過時／權限問題／使用者誤解</text>
  <path class="ln" d="M182.0,164.0 L182.0,178.0" marker-end="url(#a)"/>
  <rect class="box" x="12" y="178" width="340" height="52" rx="10"/>
  <text class="b" x="26" y="200">3 路由</text>
  <text class="s" x="26" y="220">依知識型態與範圍，交給該知識的負責人</text>
  <path class="ln" d="M182.0,230.0 L182.0,244.0" marker-end="url(#a)"/>
  <rect class="good" x="12" y="244" width="340" height="52" rx="10"/>
  <text class="b" x="26" y="266">4 草稿</text>
  <text class="s" x="26" y="286">AI 或程式整理成修改草稿，附來源回饋</text>
  <path class="ln" d="M182.0,296.0 L182.0,310.0" marker-end="url(#a)"/>
  <rect class="acc" x="12" y="310" width="340" height="52" rx="10"/>
  <text class="b" x="26" y="332">5 人工審核</text>
  <text class="s" x="26" y="352">確認回饋屬實、決定怎麼改；不能省</text>
  <path class="ln" d="M182.0,362.0 L182.0,376.0" marker-end="url(#a)"/>
  <rect class="box" x="12" y="376" width="340" height="52" rx="10"/>
  <text class="b" x="26" y="398">6 寫回</text>
  <text class="s" x="26" y="418">更新版本、狀態、最後確認日期、來源、log</text>
  <path class="ln" d="M182.0,428.0 L182.0,442.0" marker-end="url(#a)"/>
  <rect class="box" x="12" y="442" width="340" height="52" rx="10"/>
  <text class="b" x="26" y="464">7 驗證</text>
  <text class="s" x="26" y="484">用評測集回歸；變差就退回</text>
  <path class="ln" d="M182.0,494.0 L182.0,508.0" marker-end="url(#a)"/>
  <rect class="good" x="12" y="508" width="340" height="52" rx="10"/>
  <text class="b" x="26" y="530">8 結案</text>
  <text class="s" x="26" y="550">通知提供回饋的人；記錄結果</text>
  <path class="dash" d="M352.0,336.0 L430.0,336.0 L430.0,534.0 L352.0,534.0" marker-end="url(#a)"/>
  <text class="s" x="442" y="332.0">駁回：不寫入</text>
  <text class="s" x="442" y="348.0">記錄原因後結案</text>
  <path class="dash" d="M352.0,468.0 L386.0,468.0 L386.0,402.0 L352.0,402.0" marker-end="url(#a)"/>
  <text class="s" x="408" y="433.0" text-anchor="middle">變差</text>
  <text class="s" x="408" y="449.0" text-anchor="middle">退回</text>
  <text class="s" x="320" y="626" text-anchor="middle">設計建議；沒有實作或驗證過；「不自動寫入」與第 5.5 節的核准原則一致</text>
</svg>
