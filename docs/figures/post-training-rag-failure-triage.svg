<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="t d">
  <title id="t">RAG 不夠時：先做錯誤分析，依失敗類型決定對策</title>
  <desc id="d">在評測集上答錯的題目先做錯誤分析並歸類。檢索失敗要修檢索：切塊、embedding、混合檢索、reranker，微調幫不上忙；有證據卻答錯要換更強模型、改 prompt、加驗證步驟，穩定重現再考慮微調；格式風格不符用 SFT 或 LoRA 固定格式、語氣與術語，微調最划算；數字與結構化資料用 text-to-SQL 或 API 工具，不走向量檢索；跨文件與全局問題用 Agentic RAG、GraphRAG 與分層摘要。最後是 RAG 加微調搭配：微調管行為與格式，RAG 管事實。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="598.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">答錯的題目屬於哪一類？</text>
  <rect class="acc" x="155.0" y="46.0" width="330" height="40" rx="8"/>
  <text x="320" y="62" text-anchor="middle">評測集上答錯的題目</text>
  <text x="320" y="78" text-anchor="middle">先做錯誤分析、歸類</text>
  <path class="ln" d="M320.0,88.0 L320.0,100.0" marker-end="url(#a)"/>
  <polygon class="acc" points="320,100.0 440.0,128 320,156.0 200.0,128"/>
  <text class="b" x="320" y="132" text-anchor="middle">失敗屬於哪一類？</text>
  <path class="ln" d="M200.0,128.0 L24.0,128.0 L24.0,446.0"/>
  <path class="ln" d="M24.0,182.0 L36.0,182.0" marker-end="url(#a)"/>
  <rect class="acc" x="36" y="158" width="128" height="48" rx="8"/>
  <text class="b" x="100" y="187" text-anchor="middle">檢索失敗</text>
  <path class="ln" d="M164.0,182.0 L172.0,182.0"/>
  <rect class="box" x="172.0" y="158.0" width="210" height="48" rx="8"/>
  <text x="277" y="178" text-anchor="middle">修檢索：切塊、embedding、</text>
  <text x="277" y="194" text-anchor="middle">混合檢索、reranker</text>
  <path class="ln" d="M382.0,182.0 L394.0,182.0" marker-end="url(#a)"/>
  <rect class="bad" x="394.0" y="158.0" width="126" height="48" rx="8"/>
  <text x="457" y="186" text-anchor="middle">微調幫不上忙</text>
  <path class="ln" d="M520.0,182.0 L580.0,182.0"/>
  <path class="ln" d="M24.0,248.0 L36.0,248.0" marker-end="url(#a)"/>
  <rect class="acc" x="36" y="224" width="128" height="48" rx="8"/>
  <text class="b" x="100" y="253" text-anchor="middle">有證據卻答錯</text>
  <path class="ln" d="M164.0,248.0 L172.0,248.0"/>
  <rect class="box" x="172.0" y="224.0" width="210" height="48" rx="8"/>
  <text x="277" y="244" text-anchor="middle">換更強模型、改 prompt、</text>
  <text x="277" y="260" text-anchor="middle">加驗證步驟</text>
  <path class="ln" d="M382.0,248.0 L394.0,248.0" marker-end="url(#a)"/>
  <rect class="box" x="394.0" y="224.0" width="126" height="48" rx="8"/>
  <text x="457" y="252" text-anchor="middle">穩定重現再考慮微調</text>
  <path class="ln" d="M520.0,248.0 L580.0,248.0"/>
  <path class="ln" d="M24.0,314.0 L36.0,314.0" marker-end="url(#a)"/>
  <rect class="acc" x="36" y="290" width="128" height="48" rx="8"/>
  <text class="b" x="100" y="319" text-anchor="middle">格式風格不符</text>
  <path class="ln" d="M164.0,314.0 L172.0,314.0"/>
  <rect class="box" x="172.0" y="290.0" width="210" height="48" rx="8"/>
  <text x="277" y="310" text-anchor="middle">SFT／LoRA</text>
  <text x="277" y="326" text-anchor="middle">固定格式、語氣與術語</text>
  <path class="ln" d="M382.0,314.0 L394.0,314.0" marker-end="url(#a)"/>
  <rect class="good" x="394.0" y="290.0" width="126" height="48" rx="8"/>
  <text x="457" y="318" text-anchor="middle">微調最划算</text>
  <path class="ln" d="M520.0,314.0 L580.0,314.0"/>
  <path class="ln" d="M24.0,380.0 L36.0,380.0" marker-end="url(#a)"/>
  <rect class="acc" x="36" y="356" width="128" height="48" rx="8"/>
  <text class="b" x="100" y="385" text-anchor="middle">數字、結構化資料</text>
  <path class="ln" d="M164.0,380.0 L172.0,380.0"/>
  <rect class="box" x="172.0" y="356.0" width="210" height="48" rx="8"/>
  <text x="277" y="376" text-anchor="middle">text-to-SQL、API 工具</text>
  <text x="277" y="392" text-anchor="middle">不走向量檢索</text>
  <path class="ln" d="M382.0,380.0 L580.0,380.0"/>
  <path class="ln" d="M24.0,446.0 L36.0,446.0" marker-end="url(#a)"/>
  <rect class="acc" x="36" y="422" width="128" height="48" rx="8"/>
  <text class="b" x="100" y="451" text-anchor="middle">跨文件、全局問題</text>
  <path class="ln" d="M164.0,446.0 L172.0,446.0"/>
  <rect class="box" x="172.0" y="422.0" width="210" height="48" rx="8"/>
  <text x="277" y="442" text-anchor="middle">Agentic RAG、GraphRAG、</text>
  <text x="277" y="458" text-anchor="middle">分層摘要</text>
  <path class="ln" d="M382.0,446.0 L580.0,446.0"/>
  <path class="ln" d="M580.0,182.0 L580.0,494.0" marker-end="url(#a)"/>
  <rect class="good" x="36" y="494" width="568" height="56" rx="10"/>
  <text class="b" x="320" y="518" text-anchor="middle">RAG ＋ 微調搭配</text>
  <text class="s" x="320" y="538" text-anchor="middle">微調管行為與格式，RAG 管事實</text>
  <text class="s" x="320" y="582" text-anchor="middle">五類對策最後都匯入同一個搭配策略</text>
</svg>
