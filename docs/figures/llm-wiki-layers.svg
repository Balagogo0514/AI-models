<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="t d">
  <title id="t">LLM Wiki 的三層：原始資料、wiki、schema</title>
  <desc id="d">三層由上到下。原始資料：文章、論文、圖片、資料檔，唯讀，是事實來源，由你提供。wiki：LLM 產生的 markdown，含摘要、實體與概念頁、比較、總覽、index 與 log，由 LLM 擁有並維護。schema：像 CLAUDE.md 或 AGENTS.md 的設定文件，規定結構、慣例與工作流程，是關鍵的設定檔。原始資料經 ingest 進入 wiki；schema 規範 LLM 如何維護 wiki。你負責挑資料、提問與審閱；LLM 負責整理、交叉引用、歸檔與維護。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="468.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">LLM Wiki 的三層</text>
  <rect class="box" x="12" y="52" width="616" height="92" rx="10"/>
  <text class="b" x="26" y="82">原始資料（raw）</text>
  <text x="26" y="106">文章、論文、圖片、資料檔</text>
  <text class="s" x="26" y="128">唯讀、事實來源</text>
  <rect class="box" x="470" y="76" width="144" height="44" rx="8"/>
  <text class="b" x="542" y="103" text-anchor="middle">你提供</text>
  <rect class="good" x="12" y="172" width="616" height="92" rx="10"/>
  <text class="b" x="26" y="202">wiki</text>
  <text x="26" y="226">摘要、實體與概念頁、比較、總覽、index.md、log.md</text>
  <text class="s" x="26" y="248">LLM 產生的 markdown</text>
  <rect class="box" x="470" y="196" width="144" height="44" rx="8"/>
  <text class="b" x="542" y="223" text-anchor="middle">LLM 擁有並維護</text>
  <rect class="acc" x="12" y="292" width="616" height="92" rx="10"/>
  <text class="b" x="26" y="322">schema</text>
  <text x="26" y="346">CLAUDE.md 或 AGENTS.md：結構、慣例、工作流程</text>
  <text class="s" x="26" y="368">gist：「the key configuration file」</text>
  <rect class="box" x="470" y="316" width="144" height="44" rx="8"/>
  <text class="b" x="542" y="343" text-anchor="middle">規範 LLM 怎麼維護</text>
  <path class="ln" d="M220.0,144.0 L220.0,172.0" marker-end="url(#a)"/>
  <text class="s" x="262" y="162" text-anchor="middle">ingest</text>
  <path class="ln" d="M420.0,384.0 L420.0,264.0" marker-end="url(#a)"/>
  <text class="s" x="454" y="330" text-anchor="middle">規範</text>
  <text class="b" x="320" y="424" text-anchor="middle">你：挑資料、提問、審閱</text>
  <text class="b" x="320" y="446" text-anchor="middle">LLM：整理、交叉引用、歸檔、維護</text>
</svg>
