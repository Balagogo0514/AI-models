<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 606" role="img" aria-labelledby="t d">
  <title id="t">三大模型家族的 API 能力比較：Fable 5.1、Opus 5.5、Sonnet 5.5</title>
  <desc id="d">以 Fable 5.1、Opus 5.5、Sonnet 5.5 三欄比較：定位分別是最強推理與長時程代理、預設推薦、性價比。價格 10/50、4/20、2/10。思考方面 Fable 永遠開啟不可關、Opus 5.5 不可關且 effort 預設 medium、Sonnet 5.5 只支援 adaptive 且以 between_tools 取代 disabled。三者都建議啟用 refusal 回退；Fast Mode 只有 Opus 5.5 支援；三者皆支援對話中途系統訊息；強制 tool_choice 三者都回 400；Priority Tier 三者都不支援；資料保留上只有 Fable 需 30 天且與 ZDR 不相容。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="604.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">三大家族：API 能力一覽</text>
  <rect class="hd" x="12" y="44" width="616" height="26" rx="6"/>
  <text class="b" x="20" y="62">面向</text>
  <text class="b" x="146" y="62">Fable 5.1</text>
  <text class="b" x="306" y="62">Opus 5.5</text>
  <text class="b" x="466" y="62">Sonnet 5.5</text>
  <rect class="box" x="12" y="76" width="122" height="48" rx="8"/>
  <text class="b" x="20" y="105.0">定位</text>
  <rect class="box" x="142" y="76" width="156" height="48" rx="8"/>
  <text x="150" y="96">最強推理</text>
  <text x="150" y="113">長時程代理</text>
  <rect class="good" x="302" y="76" width="156" height="48" rx="8"/>
  <text x="310" y="104.0">目前預設推薦</text>
  <rect class="box" x="462" y="76" width="156" height="48" rx="8"/>
  <text x="470" y="104.0">性價比選項</text>
  <rect class="box" x="12" y="128" width="122" height="48" rx="8"/>
  <text class="b" x="20" y="157.0">價格（輸入／輸出）</text>
  <rect class="box" x="142" y="128" width="156" height="48" rx="8"/>
  <text x="150" y="156.0">$10／$50</text>
  <rect class="good" x="302" y="128" width="156" height="48" rx="8"/>
  <text x="310" y="156.0">$4／$20</text>
  <rect class="box" x="462" y="128" width="156" height="48" rx="8"/>
  <text x="470" y="156.0">$2／$10</text>
  <rect class="box" x="12" y="180" width="122" height="48" rx="8"/>
  <text class="b" x="20" y="209.0">思考模式</text>
  <rect class="box" x="142" y="180" width="156" height="48" rx="8"/>
  <text x="150" y="200">永遠開啟</text>
  <text x="150" y="217">只能調 effort</text>
  <rect class="box" x="302" y="180" width="156" height="48" rx="8"/>
  <text x="310" y="200">不可關閉</text>
  <text x="310" y="217">effort 預設 medium</text>
  <rect class="box" x="462" y="180" width="156" height="48" rx="8"/>
  <text x="470" y="200">只支援 adaptive</text>
  <text x="470" y="217">disabled 回 400</text>
  <rect class="box" x="12" y="232" width="122" height="48" rx="8"/>
  <text class="b" x="20" y="261.0">refusal 回退</text>
  <rect class="bad" x="142" y="232" width="156" height="48" rx="8"/>
  <text x="150" y="252">必須處理</text>
  <text x="150" y="269">建議啟用 fallback</text>
  <rect class="box" x="302" y="232" width="156" height="48" rx="8"/>
  <text x="310" y="260.0">建議啟用 fallback</text>
  <rect class="box" x="462" y="232" width="156" height="48" rx="8"/>
  <text x="470" y="252">建議啟用</text>
  <text x="470" y="269">僅 default 形式</text>
  <rect class="box" x="12" y="284" width="122" height="48" rx="8"/>
  <text class="b" x="20" y="313.0">Fast Mode</text>
  <rect class="box" x="142" y="284" width="156" height="48" rx="8"/>
  <text x="150" y="312.0">不支援</text>
  <rect class="good" x="302" y="284" width="156" height="48" rx="8"/>
  <text x="310" y="304">支援（$8／$40）</text>
  <text x="310" y="321">僅 Claude API</text>
  <rect class="box" x="462" y="284" width="156" height="48" rx="8"/>
  <text x="470" y="312.0">不支援</text>
  <rect class="box" x="12" y="336" width="122" height="48" rx="8"/>
  <text class="b" x="20" y="365.0">對話中途系統訊息</text>
  <rect class="box" x="142" y="336" width="156" height="48" rx="8"/>
  <text x="150" y="364.0">支援</text>
  <rect class="box" x="302" y="336" width="156" height="48" rx="8"/>
  <text x="310" y="364.0">支援</text>
  <rect class="box" x="462" y="336" width="156" height="48" rx="8"/>
  <text x="470" y="364.0">支援</text>
  <rect class="box" x="12" y="388" width="122" height="48" rx="8"/>
  <text class="b" x="20" y="417.0">強制 tool_choice</text>
  <rect class="bad" x="142" y="388" width="156" height="48" rx="8"/>
  <text x="150" y="416.0">回 400</text>
  <rect class="bad" x="302" y="388" width="156" height="48" rx="8"/>
  <text x="310" y="416.0">回 400</text>
  <rect class="bad" x="462" y="388" width="156" height="48" rx="8"/>
  <text x="470" y="416.0">回 400</text>
  <rect class="box" x="12" y="440" width="122" height="48" rx="8"/>
  <text class="b" x="20" y="469.0">Priority Tier</text>
  <rect class="box" x="142" y="440" width="156" height="48" rx="8"/>
  <text x="150" y="468.0">不支援</text>
  <rect class="box" x="302" y="440" width="156" height="48" rx="8"/>
  <text x="310" y="468.0">不支援</text>
  <rect class="box" x="462" y="440" width="156" height="48" rx="8"/>
  <text x="470" y="468.0">不支援</text>
  <rect class="box" x="12" y="492" width="122" height="48" rx="8"/>
  <text class="b" x="20" y="521.0">資料保留</text>
  <rect class="bad" x="142" y="492" width="156" height="48" rx="8"/>
  <text x="150" y="512">30 天</text>
  <text x="150" y="529">不相容 ZDR</text>
  <rect class="box" x="302" y="492" width="156" height="48" rx="8"/>
  <text x="310" y="520.0">依方案彈性設定</text>
  <rect class="box" x="462" y="492" width="156" height="48" rx="8"/>
  <text x="470" y="520.0">依方案彈性設定</text>
  <text class="s" x="320" y="568" text-anchor="middle">Sonnet 5.5 的 refusal 回退僅限 &quot;default&quot; 形式與 Claude API</text>
  <text class="s" x="320" y="588" text-anchor="middle">自 2026-10-21 起，temperature／top_p／top_k 在所有模型都回 400</text>
</svg>
