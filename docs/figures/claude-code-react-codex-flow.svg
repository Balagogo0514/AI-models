<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 656" role="img" aria-labelledby="t d">
  <title id="t">localhost 上的 React 範例流程（Codex）：你、dev server、Codex 與瀏覽器的互動順序</title>
  <desc id="d">四個角色：你、跑 dev server 的終端機 A、跑 Codex CLI 的終端機 B、經 Playwright MCP 控制的瀏覽器。順序：一，終端機 A 執行 yarn start。二，終端機 B 用 codex 搭配 workspace-write 啟動。三，用 /mcp 確認有 playwright 工具。四，你要求 Codex 開 localhost 登入頁、送出錯誤資料並檢查 console。五，Codex 透過 MCP 請瀏覽器開頁操作表單。六，瀏覽器向 dev server 載入頁面。七，瀏覽器回報頁面內容與 console。八，Codex 修改元件檔案。九，dev server 熱更新。十，Codex 請瀏覽器重新驗證並回報。十一，你用 diff 與 review 審查。在 Codex app 可改用 Browser plugin。流程由文件組成，沒有實際執行過。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="654.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">Codex 的 localhost 範例流程：誰跟誰說話</text>
  <rect class="acc" x="16.0" y="45.0" width="128" height="34" rx="8"/>
  <text class="b" x="80" y="66" text-anchor="middle">你</text>
  <line class="dash" x1="80" y1="86" x2="80" y2="614"/>
  <rect class="acc" x="176.0" y="40.0" width="128" height="44" rx="8"/>
  <text class="b" x="240" y="58" text-anchor="middle">終端機 A</text>
  <text x="240" y="74" text-anchor="middle">dev server</text>
  <line class="dash" x1="240" y1="86" x2="240" y2="614"/>
  <rect class="acc" x="336.0" y="40.0" width="128" height="44" rx="8"/>
  <text class="b" x="400" y="58" text-anchor="middle">終端機 B</text>
  <text x="400" y="74" text-anchor="middle">Codex CLI</text>
  <line class="dash" x1="400" y1="86" x2="400" y2="614"/>
  <rect class="acc" x="496.0" y="40.0" width="128" height="44" rx="8"/>
  <text class="b" x="560" y="58" text-anchor="middle">瀏覽器</text>
  <text x="560" y="74" text-anchor="middle">Playwright MCP</text>
  <line class="dash" x1="560" y1="86" x2="560" y2="614"/>
  <path class="ln" d="M80.0,112.0 L240.0,112.0" marker-end="url(#a)"/>
  <rect x="88.6" y="92" width="142.8" height="16" fill="var(--bg)"/>
  <text class="s" x="160.0" y="104" text-anchor="middle">1 yarn start（localhost）</text>
  <path class="ln" d="M80.0,158.0 L400.0,158.0" marker-end="url(#a)"/>
  <rect x="150.9" y="138" width="178.1" height="16" fill="var(--bg)"/>
  <text class="s" x="240.0" y="150" text-anchor="middle">2 codex -C . -s workspace-write</text>
  <path class="ln" d="M80.0,204.0 L400.0,204.0" marker-end="url(#a)"/>
  <rect x="164.3" y="184" width="151.5" height="16" fill="var(--bg)"/>
  <text class="s" x="240.0" y="196" text-anchor="middle">3 /mcp 確認 playwright 工具</text>
  <path class="ln" d="M80.0,250.0 L400.0,250.0" marker-end="url(#a)"/>
  <rect x="114.7" y="230" width="250.6" height="16" fill="var(--bg)"/>
  <text class="s" x="240.0" y="242" text-anchor="middle">4 「開 localhost 登入頁、送錯資料、看 console」</text>
  <path class="ln" d="M400.0,296.0 L560.0,296.0" marker-end="url(#a)"/>
  <rect x="436.2" y="276" width="87.6" height="16" fill="var(--bg)"/>
  <text class="s" x="480.0" y="288" text-anchor="middle">5 開頁、操作表單</text>
  <path class="ln" d="M560.0,342.0 L240.0,342.0" marker-end="url(#a)"/>
  <rect x="370.9" y="322" width="58.2" height="16" fill="var(--bg)"/>
  <text class="s" x="400.0" y="334" text-anchor="middle">6 載入頁面</text>
  <path class="ln" d="M560.0,388.0 L400.0,388.0" marker-end="url(#a)"/>
  <rect x="414.3" y="368" width="131.5" height="16" fill="var(--bg)"/>
  <text class="s" x="480.0" y="380" text-anchor="middle">7 回報頁面內容與 console</text>
  <rect class="good" x="330" y="420" width="140" height="28" rx="6"/>
  <text x="400" y="439" text-anchor="middle">8 修改元件檔案</text>
  <path class="ln" d="M240.0,480.0 L560.0,480.0" marker-end="url(#a)"/>
  <rect x="351.3" y="460" width="97.4" height="16" fill="var(--bg)"/>
  <text class="s" x="400.0" y="472" text-anchor="middle">9 熱更新（依專案）</text>
  <path class="ln" d="M400.0,526.0 L560.0,526.0" marker-end="url(#a)"/>
  <rect x="420.3" y="506" width="119.3" height="16" fill="var(--bg)"/>
  <text class="s" x="480.0" y="518" text-anchor="middle">10 重新驗證 → 回報結果</text>
  <path class="ln" d="M400.0,572.0 L80.0,572.0" marker-end="url(#a)"/>
  <rect x="170.3" y="552" width="139.3" height="16" fill="var(--bg)"/>
  <text class="s" x="240.0" y="564" text-anchor="middle">11 /diff、/review；你審查</text>
  <text class="s" x="320" y="642" text-anchor="middle">在 Codex app 可改用 Browser plugin；埠號與熱更新依專案；流程由文件組成，未實跑</text>
</svg>
