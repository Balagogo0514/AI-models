<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d">
  <title id="t">fastpath 除錯的多 agent 分工：七種角色、用到的機制、是否改檔</title>
  <desc id="d">子系統稽核員用 Subagents，每個認領一個子系統，不改檔。全樹模式掃描用 Workflows，不改檔。instrumentation 實作用 subagent 加 worktree 隔離，會改檔。重現 harness 建置用 Agent View 的獨立 session，會改檔但隔離。log 與 core 分析用 subagent，不改檔。競爭假說調查用 Agent teams，每個 teammate 追一個假說。獨立驗證員用 subagent 複核每個 finding，不改檔。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="518.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">多 agent 分工：角色、機制、是否改檔</text>
  <rect class="hd" x="12" y="44" width="616" height="26" rx="6"/>
  <text class="b" x="20" y="62">角色</text>
  <text class="b" x="220" y="62">機制</text>
  <text class="b" x="500" y="62">改檔</text>
  <rect class="box" x="12" y="76" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="107">子系統稽核員 ×N</text>
  <text x="220" y="107">Subagents（每個認領一個子系統）</text>
  <text x="500" y="107">否</text>
  <rect class="box" x="12" y="132" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="163">全樹模式掃描</text>
  <text x="220" y="163">Workflows</text>
  <text x="500" y="163">否</text>
  <rect class="bad" x="12" y="188" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="219">instrumentation 實作</text>
  <text x="220" y="219">Subagent ＋ isolation: worktree</text>
  <text x="500" y="219">是（隔離）</text>
  <rect class="bad" x="12" y="244" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="275">重現 harness 建置</text>
  <text x="220" y="275">獨立 session（Agent View）</text>
  <text x="500" y="275">是（隔離）</text>
  <rect class="box" x="12" y="300" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="331">log／core 分析</text>
  <text x="220" y="331">Subagent</text>
  <text x="500" y="331">否</text>
  <rect class="acc" x="12" y="356" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="387">競爭假說調查</text>
  <text x="220" y="387">Agent teams（一人追一個假說）</text>
  <text x="500" y="387">視情況</text>
  <rect class="good" x="12" y="412" width="616" height="50" rx="8"/>
  <text class="b" x="20" y="443">獨立驗證員</text>
  <text x="220" y="443">Subagent（複核每個 finding）</text>
  <text x="500" y="443">否</text>
  <text class="s" x="320" y="482" text-anchor="middle">概念上等同 /code-review ultra：多個 reviewer 平行找，再由獨立 agent 驗證</text>
  <text class="s" x="320" y="502" text-anchor="middle">範圍聲明：通用 DPDK／fastpath 除錯方法論，未針對特定產品原始碼逐項驗證</text>
</svg>
