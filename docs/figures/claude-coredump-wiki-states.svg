<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
  <title id="t">lookup 的五種狀態與處理</title>
  <desc id="d">五種狀態。miss：wiki 沒有這個簽章，走 Claude 分析。unknown_cause：簽章出現過但還沒有根因，引用簽章頁，不呼叫模型。known_open：已知根因且尚未修復，引用根因頁，不呼叫模型。known_fixed：已在較新版本修復，引用並提示確認版本，不呼叫模型。regression：根因標記已於某版本修復，但這個版本以上又出現，不能帶過，重新分析並把備註交給模型。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="418.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">lookup 的五種狀態</text>
  <rect class="acc" x="12" y="44" width="210" height="62" rx="10"/>
  <text x="24" y="80.0">miss（沒看過）</text>
  <line class="ln" x1="222" y1="75.0" x2="248" y2="75.0" marker-end="url(#a)"/>
  <rect class="box" x="250" y="44" width="378" height="62" rx="10"/>
  <text class="b" x="262" y="69.0">走 Claude 分析</text>
  <text class="s" x="262" y="91.0">分析後放進待審區</text>
  <rect class="acc" x="12" y="114" width="210" height="62" rx="10"/>
  <text x="24" y="150.0">unknown_cause</text>
  <line class="ln" x1="222" y1="145.0" x2="248" y2="145.0" marker-end="url(#a)"/>
  <rect class="good" x="250" y="114" width="378" height="62" rx="10"/>
  <text class="b" x="262" y="139.0">引用簽章頁，不呼叫模型</text>
  <text class="s" x="262" y="161.0">提示「以前出現過，還沒有根因」</text>
  <rect class="acc" x="12" y="184" width="210" height="62" rx="10"/>
  <text x="24" y="220.0">known_open</text>
  <line class="ln" x1="222" y1="215.0" x2="248" y2="215.0" marker-end="url(#a)"/>
  <rect class="good" x="250" y="184" width="378" height="62" rx="10"/>
  <text class="b" x="262" y="209.0">引用根因頁，不呼叫模型</text>
  <text class="s" x="262" y="231.0">已知問題、尚未修復</text>
  <rect class="acc" x="12" y="254" width="210" height="62" rx="10"/>
  <text x="24" y="290.0">known_fixed</text>
  <line class="ln" x1="222" y1="285.0" x2="248" y2="285.0" marker-end="url(#a)"/>
  <rect class="good" x="250" y="254" width="378" height="62" rx="10"/>
  <text class="b" x="262" y="279.0">引用根因頁，不呼叫模型</text>
  <text class="s" x="262" y="301.0">提示：已在較新版本修復，請確認版本</text>
  <rect class="acc" x="12" y="324" width="210" height="62" rx="10"/>
  <text x="24" y="360.0">regression</text>
  <line class="ln" x1="222" y1="355.0" x2="248" y2="355.0" marker-end="url(#a)"/>
  <rect class="bad" x="250" y="324" width="378" height="62" rx="10"/>
  <text class="b" x="262" y="349.0">不能帶過：重新分析</text>
  <text class="s" x="262" y="371.0">把 wiki_note 交給模型，也提醒人</text>
  <text class="s" x="320" y="406" text-anchor="middle">regression ＝ 根因標記已於某版本修復，但這個版本以上又出現</text>
</svg>
