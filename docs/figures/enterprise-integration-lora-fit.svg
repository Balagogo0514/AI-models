<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d">
  <title id="t">改什麼：事實用 RAG，行為用 LoRA</title>
  <desc id="d">五種需求對應的做法。公司文件、規格與最新資訊這類事實：用 RAG，不要用 LoRA 灌事實，因為會過時、難更新、也無法依權限過濾。輸出格式、語氣與術語：LoRA（SFT）最划算。固定的推理或標註習慣：先確認提示詞做不到，再用 LoRA。即時資料與精確數字：用 API 工具或 text-to-SQL。檢索沒找到正確資料：修切塊、混合檢索與重排，微調幫不上忙。來源是本庫 Post-Training 的失敗類型與對策。</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1c2330; --muted:#5b6678; --line:#c9cfda; --accent:#2f5fd0; --warn:#b4531a; --good:#1f7a4d; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161b22; --fg:#e6e9ef; --muted:#9aa4b5; --line:#39414f; --accent:#8fb0ff; --warn:#e5a06a; --good:#5cc796; }
    }
    text { font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: var(--fg); font-size: 12.5px; }
    .m { fill: var(--muted); }
    .s { fill: var(--muted); font-size: 11px; }
    .b { font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .mono { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; }
    .monob { font-variant-ligatures: none; font-family: "JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; font-weight: 700; }
    .at { fill: var(--accent); } .wt { fill: var(--warn); } .gt { fill: var(--good); }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .acc { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1.2; }
    .bad { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-width: 1.2; }
    .good { fill: var(--good); fill-opacity: .12; stroke: var(--good); stroke-width: 1.2; }
    .zone { fill: var(--accent); fill-opacity: .05; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dash { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hd { fill: var(--accent); fill-opacity: .14; }
    .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ar { fill: var(--muted); }
    .dotf { fill: var(--accent); } .dote { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { fill: none; stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .bin { fill: var(--accent); fill-opacity: .38; } .bout { fill: var(--accent); } .onacc { fill: var(--bg); font-size: 10.5px; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker></defs>
  <rect class="frame" x="0.6" y="0.6" width="638.8" height="438.8" rx="12"/>
  <text class="t" x="320" y="28" text-anchor="middle">改什麼 → 用什麼</text>
  <rect class="acc" x="12" y="44" width="250" height="64" rx="10"/>
  <text x="24" y="81.0">公司文件、規格、最新資訊（事實）</text>
  <line class="ln" x1="262" y1="76.0" x2="284" y2="76.0" marker-end="url(#a)"/>
  <rect class="good" x="286" y="44" width="342" height="64" rx="10"/>
  <text class="b" x="298" y="70.0">RAG</text>
  <text class="s" x="298" y="92.0">會過時、要可追溯與可刪除；LoRA 不適合灌事實</text>
  <rect class="acc" x="12" y="116" width="250" height="64" rx="10"/>
  <text x="24" y="153.0">輸出格式、語氣、術語</text>
  <line class="ln" x1="262" y1="148.0" x2="284" y2="148.0" marker-end="url(#a)"/>
  <rect class="acc" x="286" y="116" width="342" height="64" rx="10"/>
  <text class="b" x="298" y="142.0">LoRA（SFT）</text>
  <text class="s" x="298" y="164.0">答對但格式或術語不符規範，最划算</text>
  <rect class="acc" x="12" y="188" width="250" height="64" rx="10"/>
  <text x="24" y="225.0">固定的推理或標註習慣</text>
  <line class="ln" x1="262" y1="220.0" x2="284" y2="220.0" marker-end="url(#a)"/>
  <rect class="acc" x="286" y="188" width="342" height="64" rx="10"/>
  <text class="b" x="298" y="214.0">先試提示詞，再 LoRA</text>
  <text class="s" x="298" y="236.0">提示詞做不到、能穩定重現，才值得訓練</text>
  <rect class="acc" x="12" y="260" width="250" height="64" rx="10"/>
  <text x="24" y="297.0">即時資料、精確數字</text>
  <line class="ln" x1="262" y1="292.0" x2="284" y2="292.0" marker-end="url(#a)"/>
  <rect class="box" x="286" y="260" width="342" height="64" rx="10"/>
  <text class="b" x="298" y="286.0">API 工具／text-to-SQL</text>
  <text class="s" x="298" y="308.0">不是微調的問題</text>
  <rect class="acc" x="12" y="332" width="250" height="64" rx="10"/>
  <text x="24" y="369.0">檢索沒找到正確資料</text>
  <line class="ln" x1="262" y1="364.0" x2="284" y2="364.0" marker-end="url(#a)"/>
  <rect class="box" x="286" y="332" width="342" height="64" rx="10"/>
  <text class="b" x="298" y="358.0">修檢索</text>
  <text class="s" x="298" y="380.0">切塊、混合檢索、重排；微調幫不上忙</text>
  <text class="s" x="320" y="428" text-anchor="middle">整理自本庫 Post-Training 的失敗類型與對策；比例要看各自的評測結果</text>
</svg>
